<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Multiple Tools: Calendar Assistant Example</text>

  <!-- Available Tools Box -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="none" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="110" y="20" fill="#9c27b0" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Tools</text>

    <rect x="15" y="32" width="85" height="22" rx="3" fill="url(#greenGrad)"/>
    <text x="57" y="47" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">make_appointment</text>

    <rect x="110" y="32" width="85" height="22" rx="3" fill="url(#greenGrad)"/>
    <text x="152" y="47" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">check_calendar</text>

    <rect x="60" y="58" width="100" height="18" rx="3" fill="#21262d" stroke="#8b949e"/>
    <text x="110" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">delete_appointment</text>
  </g>

  <!-- Second tools box -->
  <g transform="translate(480, 50)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="none" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="110" y="20" fill="#9c27b0" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Tools</text>

    <rect x="15" y="32" width="85" height="22" rx="3" fill="url(#redGrad)"/>
    <text x="57" y="47" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">make_appointment</text>

    <rect x="110" y="32" width="85" height="22" rx="3" fill="#21262d" stroke="#8b949e"/>
    <text x="152" y="47" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">check_calendar</text>

    <rect x="60" y="58" width="100" height="18" rx="3" fill="#21262d" stroke="#8b949e"/>
    <text x="110" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">delete_appointment</text>
  </g>

  <!-- User Input -->
  <rect x="20" y="160" width="110" height="70" rx="8" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="75" y="182" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Find a free slot</text>
  <text x="75" y="196" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">on Thursday in my</text>
  <text x="75" y="210" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">calendar and make</text>
  <text x="75" y="224" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">an appt with Alice.</text>

  <!-- Arrow -->
  <line x1="135" y1="195" x2="170" y2="195" stroke="#8b949e" stroke-width="2"/>
  <polygon points="170,195 160,189 160,201" fill="#8b949e"/>

  <!-- LLM 1 -->
  <rect x="175" y="170" width="55" height="50" rx="6" fill="url(#grayGrad)" filter="url(#shadow)"/>
  <text x="202" y="200" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM</text>

  <!-- Arrow -->
  <line x1="235" y1="195" x2="275" y2="195" stroke="#8b949e" stroke-width="2"/>
  <polygon points="275,195 265,189 265,201" fill="#8b949e"/>

  <!-- check_calendar -->
  <rect x="280" y="165" width="95" height="60" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="327" y="185" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">check_calendar</text>
  <text x="327" y="200" fill="#c8e6c9" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Thursday, 3pm</text>
  <text x="327" y="212" fill="#c8e6c9" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Thursday, 4pm</text>
  <text x="327" y="222" fill="#c8e6c9" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">...</text>

  <!-- Arrow with label -->
  <line x1="380" y1="195" x2="420" y2="195" stroke="#8b949e" stroke-width="2"/>
  <text x="400" y="185" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">times</text>
  <polygon points="420,195 410,189 410,201" fill="#8b949e"/>

  <!-- LLM 2 -->
  <rect x="425" y="170" width="55" height="50" rx="6" fill="url(#grayGrad)" filter="url(#shadow)"/>
  <text x="452" y="200" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM</text>

  <!-- Arrow -->
  <line x1="485" y1="195" x2="525" y2="195" stroke="#8b949e" stroke-width="2"/>
  <polygon points="525,195 515,189 515,201" fill="#8b949e"/>

  <!-- make_appointment -->
  <rect x="530" y="160" width="100" height="70" rx="6" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="580" y="180" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">make_appointment</text>
  <text x="580" y="198" fill="#ffcdd2" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Meeting created</text>
  <text x="580" y="210" fill:#ffcdd2" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">successfully!</text>

  <!-- Arrow -->
  <line x1="635" y1="195" x2="675" y2="195" stroke="#8b949e" stroke-width="2"/>
  <text x="655" y="185" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">output</text>
  <polygon points="675,195 665,189 665,201" fill="#8b949e"/>

  <!-- LLM 3 -->
  <rect x="680" y="170" width="55" height="50" rx="6" fill="url(#grayGrad)" filter="url(#shadow)"/>
  <text x="707" y="200" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM</text>

  <!-- Final output -->
  <rect x="625" y="250" width="150" height="55" rx="6" fill="#21262d" stroke="#4caf50" stroke-width="2"/>
  <text x="700" y="272" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Your appointment is</text>
  <text x="700" y="287" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">set up with Alice at</text>
  <text x="700" y="302" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">3 PM Thursday.</text>
  <line x1="707" y1="220" x2="707" y2="245" stroke="#8b949e" stroke-width="2"/>
  <polygon points="707,245 701,235 713,235" fill="#8b949e"/>

  <!-- Key Insight Box -->
  <rect x="30" y="320" width="580" height="85" rx="8" fill="#161b22" stroke="#ff9800" stroke-width="2"/>
  <text x="320" y="345" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Key Insight: LLM Makes Multiple Decisions</text>

  <text x="50" y="370" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10">1. First calls check_calendar to find free slots</text>
  <text x="50" y="388" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10">2. Then calls make_appointment to book one (chose 3pm)</text>
  <text x="50" y="406" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">3. Did NOT call delete_appointment - it wasn't needed!</text>
</svg>