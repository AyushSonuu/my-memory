<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Degrees of Autonomy Spectrum</text>

  <!-- Spectrum Bar -->
  <defs>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="50%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f44336"/>
    </linearGradient>
  </defs>

  <rect x="80" y="70" width="640" height="20" rx="10" fill="url(#spectrumGrad)" filter="url(#shadow)"/>

  <!-- Markers -->
  <circle cx="120" cy="80" r="8" fill="#fff" stroke="#4caf50" stroke-width="3"/>
  <circle cx="400" cy="80" r="8" fill="#fff" stroke="#ff9800" stroke-width="3"/>
  <circle cx="680" cy="80" r="8" fill="#fff" stroke="#f44336" stroke-width="3"/>

  <!-- Three Cards -->
  <!-- Less Autonomous -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="220" height="220" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="45" rx="12" fill="url(#greenGrad)"/>
    <rect x="0" y="30" width="220" height="15" fill="url(#greenGrad)"/>
    <text x="110" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Less Autonomous</text>

    <text x="15" y="75" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Steps</text>
    <text x="15" y="95" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">All predetermined by developer</text>

    <text x="15" y="120" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Tools</text>
    <text x="15" y="140" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Hard-coded (web search, fetch)</text>

    <text x="15" y="165" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">LLM Role</text>
    <text x="15" y="185" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Only generates text</text>

    <rect x="15" y="200" width="190" height="10" rx="5" fill="#21262d"/>
    <rect x="15" y="200" width="180" height="10" rx="5" fill="#4caf50"/>
    <text x="110" y="220" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Predictable &amp; Controllable</text>
  </g>

  <!-- Semi Autonomous -->
  <g transform="translate(290, 120)">
    <rect x="0" y="0" width="220" height="220" rx="12" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="45" rx="12" fill="url(#yellowGrad)"/>
    <rect x="0" y="30" width="220" height="15" fill="url(#yellowGrad)"/>
    <text x="110" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Semi-Autonomous</text>

    <text x="15" y="75" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Steps</text>
    <text x="15" y="95" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Some decided by LLM</text>

    <text x="15" y="120" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Tools</text>
    <text x="15" y="140" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Predefined set, LLM chooses</text>

    <text x="15" y="165" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold">LLM Role</text>
    <text x="15" y="185" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Decisions + tool selection</text>

    <rect x="15" y="200" width="190" height="10" rx="5" fill="#21262d"/>
    <rect x="15" y="200" width="95" height="10" rx="5" fill="#ff9800"/>
    <text x="110" y="220" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Moderate Control</text>
  </g>

  <!-- Highly Autonomous -->
  <g transform="translate(540, 120)">
    <rect x="0" y="0" width="220" height="220" rx="12" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="45" rx="12" fill="url(#redGrad)"/>
    <rect x="0" y="30" width="220" height="15" fill="url(#redGrad)"/>
    <text x="110" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Highly Autonomous</text>

    <text x="15" y="75" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Steps</text>
    <text x="15" y="95" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">LLM decides the full plan</text>

    <text x="15" y="120" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Tools</text>
    <text x="15" y="140" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Can create new tools on the fly</text>

    <text x="15" y="165" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold">LLM Role</text>
    <text x="15" y="185" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">ALL decisions autonomous</text>

    <rect x="15" y="200" width="190" height="10" rx="5" fill="#21262d"/>
    <rect x="15" y="200" width="40" height="10" rx="5" fill="#f44336"/>
    <text x="110" y="220" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Less Predictable</text>
  </g>

  <!-- Footer insight -->
  <text x="400" y="365" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">"Agentic" is an adjective, not a binary — systems can be agentic to different degrees</text>
</svg>