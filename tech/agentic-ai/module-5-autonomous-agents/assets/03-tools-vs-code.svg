<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Tools vs Code Execution: The Flexibility Problem</text>

  <!-- Tools Approach (Left) -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="350" height="310" rx="8" fill="#161b22" stroke="#f44336" stroke-width="2"/>
    <text x="175" y="25" fill="#f44336" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Approach A: Hardcoded Tools</text>

    <!-- Tools box -->
    <rect x="20" y="45" width="310" height="55" rx="6" fill="none" stroke="#4caf50" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="175" y="62" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Fixed Tools</text>
    <rect x="30" y="72" width="65" height="22" rx="3" fill="url(#greenGrad)"/>
    <text x="62" y="87" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">filter_rows</text>
    <rect x="105" y="72" width="70" height="22" rx="3" fill="url(#greenGrad)"/>
    <text x="140" y="87" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">get_col_mean</text>
    <rect x="185" y="72" width="65" height="22" rx="3" fill="url(#greenGrad)"/>
    <text x="217" y="87" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">sum_rows</text>
    <rect x="260" y="72" width="60" height="22" rx="3" fill="url(#greenGrad)"/>
    <text x="290" y="87" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">get_max</text>

    <!-- Query example -->
    <rect x="20" y="115" width="310" height="50" rx="4" fill="url(#orangeGrad)"/>
    <text x="175" y="135" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"Which month had highest hot chocolate sales?"</text>
    <text x="175" y="155" fill="#ffe0b2" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">→ Needs 12 filter calls + 12 mean calls!</text>

    <!-- Problem: new queries need new tools -->
    <rect x="20" y="180" width="310" height="110" rx="4" fill="#21262d"/>
    <text x="175" y="200" fill="#f44336" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Problems:</text>
    <text x="35" y="220" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• New query? Make new tool!</text>
    <text x="35" y="240" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• "Unique entries" → add get_unique tool</text>
    <text x="35" y="260" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• "Last 5 rows" → add get_last_N tool</text>
    <text x="35" y="280" fill="#f44336" font-family="Inter, sans-serif" font-size="9">• Brittle, inefficient, endless edge cases</text>
  </g>

  <!-- Code Execution Approach (Right) -->
  <g transform="translate(420, 55)">
    <rect x="0" y="0" width="350" height="310" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <text x="175" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Approach B: Code Execution</text>

    <!-- System prompt -->
    <rect x="20" y="45" width="310" height="40" rx="4" fill="#21262d"/>
    <text x="175" y="62" fill="#e6edf3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">System: "Write code to solve query.</text>
    <text x="175" y="77" fill="#e6edf3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Return Python between &lt;execute_python&gt; tags."</text>

    <!-- Query -->
    <rect x="20" y="95" width="150" height="40" rx="4" fill="url(#redGrad)"/>
    <text x="95" y="112" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"How many unique</text>
    <text x="95" y="125" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">entries last week?"</text>

    <line x1="175" y1="115" x2="195" y2="115" stroke="#8b949e" stroke-width="1"/>
    <polygon points="195,115 188,111 188,119" fill="#8b949e"/>

    <rect x="200" y="95" width="50" height="40" rx="4" fill="url(#grayGrad)"/>
    <text x="225" y="120" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM</text>

    <line x1="255" y1="115" x2="275" y2="115" stroke="#8b949e" stroke-width="1"/>
    <polygon points="275,115 268,111 268,119" fill="#8b949e"/>

    <!-- Code output -->
    <rect x="20" y="145" width="310" height="115" rx="4" fill="#0d1117" stroke="#4caf50" stroke-width="1"/>
    <text x="35" y="165" fill="#ff9800" font-family="monospace" font-size="8">import pandas as pd</text>
    <text x="35" y="180" fill="#e6edf3" font-family="monospace" font-size="8">df = pd.read_csv("data.csv",</text>
    <text x="50" y="195" fill="#e6edf3" font-family="monospace" font-size="8">parse_dates=["date"])</text>
    <text x="35" y="215" fill="#e6edf3" font-family="monospace" font-size="8">week_ago = pd.Timestamp.today()</text>
    <text x="50" y="230" fill="#e6edf3" font-family="monospace" font-size="8">- pd.Timedelta(days=7)</text>
    <text x="35" y="250" fill="#e6edf3" font-family="monospace" font-size="8">print(df[df["date"] > week_ago]</text>
    <text x="50" y="265" fill="#e6edf3" font-family="monospace" font-size="8">.drop_duplicates().shape[0])</text>

    <!-- Result -->
    <rect x="20" y="270" width="310" height="30" rx="4" fill="#21262d" stroke="#4caf50"/>
    <text x="175" y="290" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Any query → LLM writes the code! Flexible!</text>
  </g>
</svg>
