<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Chart Generation Agentic Workflow (Multimodal Reflection)</text>

  <!-- User Input -->
  <rect x="20" y="60" width="100" height="60" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="70" y="80" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Create plot</text>
  <text x="70" y="92" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">comparing Q1</text>
  <text x="70" y="104" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">coffee sales</text>

  <!-- Arrow -->
  <line x1="125" y1="90" x2="160" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="160,90 150,84 150,96" fill="#8b949e"/>

  <!-- LLM 1 -->
  <rect x="165" y="65" width="70" height="50" rx="6" fill="url(#grayGrad)" filter="url(#shadow)"/>
  <text x="200" y="90" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM</text>
  <text x="200" y="105" fill="#e6edf3" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Write Python</text>

  <!-- Arrow -->
  <line x1="240" y1="90" x2="275" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="275,90 265,84 265,96" fill="#8b949e"/>

  <!-- v1 code -->
  <rect x="280" y="70" width="50" height="40" rx="4" fill="#21262d" stroke="#ff9800"/>
  <text x="305" y="95" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">v1 code</text>

  <!-- Arrow -->
  <line x1="335" y1="90" x2="370" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="370,90 360,84 360,96" fill="#8b949e"/>

  <!-- Execute code -->
  <rect x="375" y="65" width="65" height="50" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="407" y="87" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">execute</text>
  <text x="407" y="100" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">code</text>

  <!-- Arrow -->
  <line x1="445" y1="90" x2="480" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="480,90 470,84 470,96" fill="#8b949e"/>

  <!-- v1 chart (plot.png) -->
  <rect x="485" y="55" width="75" height="70" rx="6" fill="#21262d" stroke="#ff9800" stroke-width="2"/>
  <text x="522" y="75" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">v1 code,</text>
  <text x="522" y="90" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">plot.png</text>
  <!-- Mini stacked chart representation -->
  <rect x="500" y="100" width="15" height="15" fill="#f44336"/>
  <rect x="520" y="95" width="15" height="20" fill="#4caf50"/>
  <rect x="540" y="100" width="15" height="15" fill="#2196f3"/>

  <!-- Arrow -->
  <line x1="565" y1="90" x2="600" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="600,90 590,84 590,96" fill="#8b949e"/>

  <!-- LLM 2 (Multimodal Critic) -->
  <rect x="605" y="55" width="90" height="70" rx="6" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="650" y="75" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM</text>
  <text x="650" y="90" fill="#e1bee7" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Critique image,</text>
  <text x="650" y="102" fill="#e1bee7" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">update code</text>
  <text x="650" y="118" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">👁️ Sees chart!</text>

  <!-- Arrow down -->
  <line x1="650" y1="130" x2="650" y2="165" stroke="#8b949e" stroke-width="2"/>
  <polygon points="650,165 644,155 656,155" fill="#8b949e"/>

  <!-- v2 code -->
  <rect x="625" y="170" width="50" height="35" rx="4" fill="#21262d" stroke="#4caf50"/>
  <text x="650" y="192" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">v2 code</text>

  <!-- Arrow -->
  <line x1="620" y1="187" x2="575" y2="187" stroke="#8b949e" stroke-width="2"/>
  <polygon points="575,187 585,181 585,193" fill="#8b949e"/>

  <!-- Execute code v2 -->
  <rect x="505" y="165" width="65" height="45" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="537" y="185" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">execute</text>
  <text x="537" y="198" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">code</text>

  <!-- Arrow -->
  <line x1="500" y1="187" x2="455" y2="187" stroke="#8b949e" stroke-width="2"/>
  <polygon points="455,187 465,181 465,193" fill="#8b949e"/>

  <!-- v2 chart (plot_v2.png) - Better! -->
  <rect x="380" y="155" width="70" height="65" rx="6" fill="#21262d" stroke="#4caf50" stroke-width="2"/>
  <text x="415" y="175" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">plot_v2.png</text>
  <!-- Mini grouped chart representation -->
  <rect x="392" y="185" width="8" height="20" fill="#f44336"/>
  <rect x="402" y="190" width="8" height="15" fill="#ffcdd2"/>
  <rect x="415" y="180" width="8" height="25" fill="#4caf50"/>
  <rect x="425" y="185" width="8" height="20" fill="#c8e6c9"/>
  <rect x="438" y="190" width="8" height="15" fill="#2196f3"/>
  <text x="415" y="220" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">✓ Better!</text>

  <!-- Comparison boxes at bottom -->
  <g transform="translate(30, 260)">
    <!-- v1 chart explanation -->
    <rect x="0" y="0" width="350" height="130" rx="8" fill="#161b22" stroke="#ff9800" stroke-width="2"/>
    <text x="175" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">v1: Stacked Bar Chart</text>

    <!-- Stacked bars -->
    <rect x="50" y="45" width="30" height="70" fill="#f44336"/>
    <rect x="50" y="50" width="30" height="35" fill="#4caf50"/>
    <rect x="50" y="55" width="30" height="20" fill="#2196f3"/>

    <rect x="100" y="35" width="30" height="80" fill="#f44336"/>
    <rect x="100" y="45" width="30" height="40" fill="#4caf50"/>
    <rect x="100" y="55" width="30" height="25" fill="#2196f3"/>

    <text x="180" y="60" fill="#f44336" font-family="Inter, sans-serif" font-size="9">❌ Hard to compare</text>
    <text x="180" y="78" fill="#f44336" font-family="Inter, sans-serif" font-size="9">❌ Visually confusing</text>
    <text x="180" y="96" fill="#f44336" font-family="Inter, sans-serif" font-size="9">❌ Not intuitive</text>
  </g>

  <g transform="translate(420, 260)">
    <!-- v2 chart explanation -->
    <rect x="0" y="0" width="350" height="130" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <text x="175" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">v2: Grouped Bar Chart ✓</text>

    <!-- Grouped bars -->
    <rect x="30" y="60" width="15" height="50" fill="#2196f3"/>
    <rect x="48" y="70" width="15" height="40" fill="#90caf9"/>

    <rect x="80" y="50" width="15" height="60" fill="#4caf50"/>
    <rect x="98" y="55" width="15" height="55" fill="#a5d6a7"/>

    <rect x="130" y="65" width="15" height="45" fill="#ff9800"/>
    <rect x="148" y="75" width="15" height="35" fill="#ffcc80"/>

    <text x="100" y="122" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">2024   2025</text>

    <text x="210" y="60" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">✓ Clear comparison</text>
    <text x="210" y="78" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">✓ Side-by-side</text>
    <text x="210" y="96" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">✓ Easy to read</text>
  </g>
</svg>