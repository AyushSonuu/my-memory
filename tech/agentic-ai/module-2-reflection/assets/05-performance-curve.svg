<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Performance Curve: When to Escalate</text>

  <!-- Y-axis -->
  <line x1="80" y1="80" x2="80" y2="350" stroke="#8b949e" stroke-width="2"/>
  <text x="40" y="215" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" font-weight="bold" transform="rotate(-90, 40, 215)">Performance</text>

  <!-- X-axis -->
  <line x1="80" y1="350" x2="720" y2="350" stroke="#8b949e" stroke-width="2"/>
  <text x="400" y="390" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Time spent prompt engineering</text>

  <!-- Tier 1: No Reflection (Red) -->
  <path d="M 80 330 Q 200 280 320 270 Q 450 265 650 265" stroke="#f44336" stroke-width="3" fill="none"/>
  <text x="660" y="255" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Plateaus</text>

  <!-- Tier 1 label box -->
  <rect x="140" y="275" width="140" height="40" rx="8" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="210" y="293" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">No Reflection</text>
  <text x="210" y="307" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(direct generation)</text>

  <!-- Tier 2: With Reflection (Orange) -->
  <path d="M 80 320 Q 200 240 320 200 Q 450 185 650 180" stroke="#ff9800" stroke-width="3" fill="none"/>

  <!-- Tier 2 label box -->
  <rect x="320" y="175" width="140" height="40" rx="8" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <text x="390" y="193" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">With Reflection</text>
  <text x="390" y="207" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(nice bump)</text>

  <!-- Tier 3: Reflection + External Feedback (Green) -->
  <path d="M 80 310 Q 200 200 320 140 Q 450 100 650 85" stroke="#4caf50" stroke-width="3" fill="none"/>

  <!-- Tier 3 label box -->
  <rect x="500" y="60" width="160" height="45" rx="8" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="580" y="78" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Reflection +</text>
  <text x="580" y="93" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">External Feedback</text>

  <!-- Upward arrow showing escalation -->
  <line x1="260" y1="270" x2="260" y2="200" stroke="#fff" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="260,200 254,210 266,210" fill="#fff"/>
  <text x="270" y="235" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Escalate!</text>

  <line x1="450" y1="180" x2="450" y2="120" stroke="#fff" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="450,120 444,130 456,130" fill="#fff"/>
  <text x="460" y="150" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Escalate!</text>

  <!-- Key insight -->
  <rect x="80" y="365" width="640" height="40" rx="6" fill="#161b22"/>
  <text x="400" y="387" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Don't grind the plateau. When prompt tuning shows diminishing returns → add reflection → add external feedback</text>
</svg>