<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <defs>
    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#0d1117"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="44" fill="url(#headerGrad)"/>
  <text x="450" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Graph DB vs SQL — How They Store &amp; Traverse Relationships</text>

  <!-- ===== LEFT SIDE: SQL ===== -->
  <!-- SQL main card -->
  <rect x="30" y="60" width="390" height="460" rx="12" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
  <!-- SQL header -->
  <rect x="30" y="60" width="390" height="36" rx="12" fill="url(#sqlGrad)"/>
  <rect x="30" y="82" width="390" height="14" fill="url(#sqlGrad)"/>
  <text x="225" y="84" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SQL Database (B-Tree Index)</text>

  <!-- SQL structure visual -->
  <!-- User Table -->
  <rect x="55" y="112" width="155" height="72" rx="8" fill="#21262d" stroke="#2196f3" stroke-width="1.5"/>
  <rect x="55" y="112" width="155" height="22" rx="8" fill="#2196f3" opacity="0.8"/>
  <rect x="55" y="126" width="155" height="8" fill="#2196f3" opacity="0.8"/>
  <text x="132" y="128" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Users Table</text>
  <text x="132" y="147" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">user_id | name | email</text>
  <text x="132" y="161" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">1 | Ayush | ...</text>
  <text x="132" y="175" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">2 | Rahul | ...</text>

  <!-- Friendship Table -->
  <rect x="245" y="112" width="155" height="72" rx="8" fill="#21262d" stroke="#2196f3" stroke-width="1.5"/>
  <rect x="245" y="112" width="155" height="22" rx="8" fill="#2196f3" opacity="0.8"/>
  <rect x="245" y="126" width="155" height="8" fill="#2196f3" opacity="0.8"/>
  <text x="322" y="128" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Friendships Table</text>
  <text x="322" y="147" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">user_id_1 | user_id_2</text>
  <text x="322" y="161" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">1 → 2</text>
  <text x="322" y="175" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">2 → 3</text>

  <!-- JOIN arrow -->
  <line x1="210" y1="148" x2="245" y2="148" stroke="#ff9800" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="245,148 236,143 236,153" fill="#ff9800"/>
  <text x="227" y="143" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">JOIN</text>

  <!-- SQL traversal label -->
  <text x="225" y="204" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">To find 3-hop friends:</text>

  <!-- SQL join chain -->
  <rect x="48" y="216" width="80" height="24" rx="5" fill="#21262d" stroke="#2196f3" stroke-width="1"/>
  <text x="88" y="232" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">users u1</text>

  <line x1="128" y1="228" x2="155" y2="228" stroke="#f44336" stroke-width="1.5"/>
  <polygon points="155,228 148,223 148,233" fill="#f44336"/>
  <text x="141" y="222" fill="#f44336" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">JOIN</text>

  <rect x="155" y="216" width="80" height="24" rx="5" fill="#21262d" stroke="#f44336" stroke-width="1"/>
  <text x="195" y="232" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">friends f1</text>

  <line x1="235" y1="228" x2="262" y2="228" stroke="#f44336" stroke-width="1.5"/>
  <polygon points="262,228 255,223 255,233" fill="#f44336"/>
  <text x="248" y="222" fill="#f44336" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">JOIN</text>

  <rect x="262" y="216" width="80" height="24" rx="5" fill="#21262d" stroke="#f44336" stroke-width="1"/>
  <text x="302" y="232" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">users u2</text>

  <line x1="342" y1="228" x2="356" y2="228" stroke="#f44336" stroke-width="1.5"/>
  <polygon points="365,228 356,223 356,233" fill="#f44336"/>
  <text x="351" y="222" fill="#f44336" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">+2</text>

  <text x="375" y="232" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">more</text>

  <!-- SQL complexity boxes -->
  <rect x="48" y="255" width="342" height="52" rx="8" fill="#21262d"/>
  <text x="219" y="272" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">k-hop Complexity: O(d^k)</text>
  <text x="219" y="288" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">d = avg connections per node, k = depth</text>
  <text x="219" y="300" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Each hop = new JOIN = exponential blowup</text>

  <!-- SQL wins -->
  <text x="225" y="328" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SQL Excels At</text>
  <rect x="48" y="334" width="342" height="66" rx="8" fill="#161b22" stroke="#2196f3" stroke-width="1"/>
  <text x="219" y="352" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Point lookups: O(log n) via B-Tree index</text>
  <text x="219" y="366" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Analytics &amp; aggregations (SUM, COUNT, GROUP BY)</text>
  <text x="219" y="380" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Tabular structured data (orders, customers)</text>
  <text x="219" y="394" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">e.g. SELECT * FROM orders WHERE customer_id = 123</text>

  <!-- SQL lookup steps -->
  <text x="225" y="420" fill="#2196f3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Relationship Lookup Process</text>
  <rect x="48" y="426" width="342" height="80" rx="8" fill="#161b22" stroke="#2196f3" stroke-width="1"/>
  <text x="219" y="443" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">1. Read index (B-Tree) to find row IDs</text>
  <text x="219" y="457" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">2. Match foreign keys across tables</text>
  <text x="219" y="471" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">3. Perform JOIN operation</text>
  <text x="219" y="485" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Repeat for every hop — cost compounds</text>
  <text x="219" y="499" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">JOIN: O(n log n) to O(n²)</text>

  <!-- ===== RIGHT SIDE: Graph DB ===== -->
  <rect x="480" y="60" width="390" height="460" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
  <!-- Graph header -->
  <rect x="480" y="60" width="390" height="36" rx="12" fill="url(#graphGrad)"/>
  <rect x="480" y="82" width="390" height="14" fill="url(#graphGrad)"/>
  <text x="675" y="84" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Graph Database (Neo4j)</text>

  <!-- Graph nodes visual -->
  <!-- Node Ayush -->
  <circle cx="590" cy="152" r="28" fill="#21262d" stroke="#4caf50" stroke-width="2"/>
  <text x="590" y="148" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Person</text>
  <text x="590" y="162" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Ayush</text>

  <!-- Node Rahul -->
  <circle cx="700" cy="130" r="24" fill="#21262d" stroke="#4caf50" stroke-width="2"/>
  <text x="700" y="126" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Person</text>
  <text x="700" y="140" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Rahul</text>

  <!-- Node Priya -->
  <circle cx="790" cy="160" r="24" fill="#21262d" stroke="#4caf50" stroke-width="2"/>
  <text x="790" y="156" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Person</text>
  <text x="790" y="170" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Priya</text>

  <!-- Edges with direct pointers -->
  <line x1="618" y1="143" x2="676" y2="133" stroke="#00bcd4" stroke-width="2"/>
  <polygon points="676,133 665,128 668,138" fill="#00bcd4"/>
  <text x="645" y="128" fill="#00bcd4" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">FRIEND</text>

  <line x1="724" y1="138" x2="768" y2="152" stroke="#00bcd4" stroke-width="2"/>
  <polygon points="768,152 757,146 760,156" fill="#00bcd4"/>
  <text x="750" y="140" fill="#00bcd4" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">FRIEND</text>

  <!-- Pointer label -->
  <text x="675" y="193" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Direct pointers — no lookup needed!</text>

  <!-- Graph traversal label -->
  <text x="675" y="213" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">To find 3-hop friends (Cypher):</text>

  <!-- Cypher query box -->
  <rect x="498" y="220" width="342" height="46" rx="8" fill="#0d1117" stroke="#4caf50" stroke-width="1"/>
  <text x="669" y="238" fill="#4caf50" font-family="monospace" font-size="9" text-anchor="middle">MATCH (a)-[:FRIEND*1..3]-&gt;(b)</text>
  <text x="669" y="254" fill="#4caf50" font-family="monospace" font-size="9" text-anchor="middle">RETURN b</text>

  <!-- Graph complexity box -->
  <rect x="498" y="274" width="342" height="52" rx="8" fill="#21262d"/>
  <text x="669" y="291" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">k-hop Complexity: O(nodes visited)</text>
  <text x="669" y="307" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Index-Free Adjacency: each node holds direct</text>
  <text x="669" y="319" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">pointers to its neighbors — no lookup, just follow</text>

  <!-- Graph wins -->
  <text x="675" y="346" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Graph DB Excels At</text>
  <rect x="498" y="352" width="342" height="66" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="1"/>
  <text x="669" y="370" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">k-hop traversal: social networks, fraud chains</text>
  <text x="669" y="384" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Shortest path (BFS/Dijkstra) — native support</text>
  <text x="669" y="398" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Recommendation engines, knowledge graphs</text>
  <text x="669" y="412" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">e.g. "All users within 4 hops of Ayush"</text>

  <!-- Graph traversal steps -->
  <text x="675" y="437" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Relationship Traversal Process</text>
  <rect x="498" y="443" width="342" height="66" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="1"/>
  <text x="669" y="460" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">1. Go to starting node in memory</text>
  <text x="669" y="474" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">2. Follow direct pointer to neighbor node</text>
  <text x="669" y="488" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">3. Repeat (pointer chasing)</text>
  <text x="669" y="502" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Cost stays constant per hop — scales linearly</text>

  <!-- VS divider -->
  <circle cx="450" cy="290" r="22" fill="#9c27b0" filter="url(#shadow)"/>
  <text x="450" y="286" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VS</text>
  <line x1="420" y1="60" x2="420" y2="520" stroke="#9c27b0" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Footer insight -->
  <rect x="30" y="530" width="840" height="22" rx="6" fill="#21262d"/>
  <text x="450" y="545" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Rule: Point lookup/analytics → SQL wins | Relationship traversal (2+ hops) → Graph DB can be orders of magnitude faster</text>
</svg>
