<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/><stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/><stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/><stop offset="100%" style="stop-color:#e65100"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/><stop offset="100%" style="stop-color:#6a1b9a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/><stop offset="100%" style="stop-color:#b71c1c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="860" height="480" fill="#0d1117"/>
  <text x="430" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Query Parameter Models — Group &amp; Validate Together</text>
  <text x="430" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Pydantic BaseModel + Query() = reusable, validated, documented query param groups</text>

  <!-- Before (scattered params) -->
  <g transform="translate(30, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="170" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="28" rx="10" fill="url(#redGrad)"/>
    <rect x="0" y="16" width="380" height="12" fill="url(#redGrad)"/>
    <text x="190" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">❌ Before — Scattered Params</text>
    <text x="14" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">async def read_items(</text>
    <text x="22" y="65" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">limit: int = Query(100, gt=0, le=100),</text>
    <text x="22" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">offset: int = Query(0, ge=0),</text>
    <text x="22" y="95" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">order_by: str = Query("created_at"),</text>
    <text x="22" y="110" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">tags: list[str] = Query([]),</text>
    <text x="14" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">):</text>
    <rect x="14" y="136" width="352" height="24" rx="6" fill="#2d0a0a"/>
    <text x="190" y="152" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Repeated on every endpoint. No reuse. Hard to maintain.</text>
  </g>

  <!-- Arrow -->
  <text x="430" y="165" fill="#4caf50" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">→</text>

  <!-- After (model) -->
  <g transform="translate(450, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="170" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="28" rx="10" fill="url(#greenGrad)"/>
    <rect x="0" y="16" width="380" height="12" fill="url(#greenGrad)"/>
    <text x="190" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✅ After — Query Param Model</text>
    <text x="14" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" font-weight="bold">class FilterParams(BaseModel):</text>
    <text x="22" y="65" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">limit: int = Field(100, gt=0, le=100)</text>
    <text x="22" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">offset: int = Field(0, ge=0)</text>
    <text x="22" y="95" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">order_by: Literal["created_at", "updated_at"] = "created_at"</text>
    <text x="22" y="110" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">tags: list[str] = []</text>
    <text x="14" y="130" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9">async def read_items(filter_query: Annotated[FilterParams, Query()]):</text>
    <rect x="14" y="142" width="352" height="18" rx="6" fill="#0d2818"/>
    <text x="190" y="155" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Define once → reuse on any endpoint. All validation in one class.</text>
  </g>

  <!-- Forbid extra card -->
  <g transform="translate(30, 263)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="190" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="28" rx="10" fill="url(#orangeGrad)"/>
    <rect x="0" y="16" width="380" height="12" fill="url(#orangeGrad)"/>
    <text x="190" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🚫 Forbidding Extra Query Params</text>
    <text x="14" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" font-weight="bold">class FilterParams(BaseModel):</text>
    <text x="22" y="65" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">model_config = {"extra": "forbid"}</text>
    <text x="22" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">limit: int = Field(100, gt=0, le=100)</text>
    <text x="22" y="95" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">...</text>
    <line x1="14" y1="106" x2="366" y2="106" stroke="#21262d" stroke-width="1"/>
    <text x="14" y="123" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">Client sends: /items/?tool=plumbus</text>
    <text x="14" y="138" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">→ 422 Error: "Extra inputs are not permitted"</text>
    <text x="14" y="158" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9">Without "extra": "forbid" → unknown params silently ignored</text>
    <text x="14" y="173" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">With "extra": "forbid"   → unknown params = 422 error</text>
  </g>

  <!-- Benefits card -->
  <g transform="translate(450, 263)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="190" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="28" rx="10" fill="url(#blueGrad)"/>
    <rect x="0" y="16" width="380" height="12" fill="url(#blueGrad)"/>
    <text x="190" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🎁 What You Get</text>
    <text x="14" y="50" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">✅ Reusability</text>
    <text x="150" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Define once, use across endpoints</text>
    <text x="14" y="70" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">✅ Validation</text>
    <text x="150" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Field(gt=0, le=100) on all fields</text>
    <text x="14" y="90" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">✅ Literal types</text>
    <text x="150" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Literal["created_at", "updated_at"]</text>
    <text x="14" y="110" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">✅ List params</text>
    <text x="150" y="110" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">tags: list[str] = [] → ?tags=a&amp;tags=b</text>
    <text x="14" y="130" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">✅ Auto docs</text>
    <text x="150" y="130" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">All fields shown in /docs</text>
    <text x="14" y="150" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">✅ Extra forbidden</text>
    <text x="150" y="150" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">model_config = {"extra": "forbid"}</text>
    <line x1="14" y1="162" x2="366" y2="162" stroke="#21262d" stroke-width="1"/>
    <text x="190" y="180" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Same pattern works for cookies and headers too ✓</text>
  </g>
</svg>
