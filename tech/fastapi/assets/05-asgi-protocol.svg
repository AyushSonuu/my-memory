<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#e65100"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#6a1b9a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#b71c1c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#0d1117"/>

  <!-- Title -->
  <text x="430" y="32" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ASGI Protocol — The Full Picture ⚙️</text>
  <text x="430" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">async def app(scope, receive, send) — the only contract between server &amp; application</text>

  <!-- ======= ROW 1: Browser → Uvicorn → FastAPI ======= -->

  <!-- Browser Box -->
  <g transform="translate(30, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="80" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="28" rx="10" fill="#21262d"/>
    <rect x="0" y="14" width="130" height="14" fill="#21262d"/>
    <text x="65" y="19" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🌐 Browser</text>
    <text x="65" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">GET /hello</text>
    <text x="65" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">HTTP Request</text>
  </g>

  <!-- Arrow: Browser → Uvicorn -->
  <line x1="162" y1="115" x2="212" y2="115" stroke="#2196f3" stroke-width="2"/>
  <polygon points="212,115 202,109 202,121" fill="#2196f3"/>
  <text x="187" y="108" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">TCP</text>

  <!-- Uvicorn Box -->
  <g transform="translate(215, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="175" height="130" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2"/>
    <rect x="0" y="0" width="175" height="28" rx="10" fill="url(#blueGrad)"/>
    <rect x="0" y="14" width="175" height="14" fill="url(#blueGrad)"/>
    <text x="87" y="19" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🖥️ Uvicorn Server</text>
    <text x="87" y="48" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Parses raw HTTP bytes</text>
    <text x="87" y="63" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Builds scope dict</text>
    <text x="87" y="78" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Creates receive() callable</text>
    <text x="87" y="93" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Creates send() callable</text>
    <text x="87" y="114" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">await app(scope, receive, send)</text>
  </g>

  <!-- Arrow: Uvicorn → FastAPI -->
  <line x1="392" y1="140" x2="442" y2="140" stroke="#4caf50" stroke-width="2"/>
  <polygon points="442,140 432,134 432,146" fill="#4caf50"/>
  <text x="417" y="133" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">calls</text>

  <!-- FastAPI Box -->
  <g transform="translate(445, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="185" height="130" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="28" rx="10" fill="url(#greenGrad)"/>
    <rect x="0" y="14" width="185" height="14" fill="url(#greenGrad)"/>
    <text x="92" y="19" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚡ FastAPI App</text>
    <text x="92" y="46" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">app = FastAPI()</text>
    <text x="92" y="61" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Implements __call__(scope, receive, send)</text>
    <text x="92" y="76" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Routes to your path operation</text>
    <text x="92" y="91" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">FastAPI → Starlette → ASGI</text>
    <text x="92" y="114" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">await send(http.response.*)</text>
  </g>

  <!-- Arrow: FastAPI → Browser (response loop) -->
  <path d="M 630 115 Q 720 60 750 115 Q 780 170 750 200 Q 700 230 430 230 Q 160 230 96 200 Q 60 185 65 155" stroke="#ff9800" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <polygon points="65,155 58,165 72,163" fill="#ff9800"/>
  <text x="430" y="248" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">HTTP Response travels back to Browser</text>

  <!-- ======= ROW 2: Three Parameters ======= -->

  <!-- Section label -->
  <text x="430" y="285" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">The Three Parameters</text>

  <!-- scope card -->
  <g transform="translate(30, 298)" filter="url(#shadow)">
    <rect x="0" y="0" width="248" height="110" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="2"/>
    <rect x="0" y="0" width="248" height="28" rx="10" fill="url(#purpleGrad)"/>
    <rect x="0" y="14" width="248" height="14" fill="url(#purpleGrad)"/>
    <text x="124" y="19" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📋 scope — Request Metadata</text>
    <text x="12" y="45" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9">{</text>
    <text x="20" y="58" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">  "type": "http",</text>
    <text x="20" y="71" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">  "method": "GET",   "path": "/users/123"</text>
    <text x="20" y="84" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">  "headers": [...]</text>
    <text x="12" y="97" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9">}</text>
    <text x="124" y="107" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Plain dict · read-only · WHO is asking &amp; WHERE</text>
  </g>

  <!-- receive() card -->
  <g transform="translate(303, 298)" filter="url(#shadow)">
    <rect x="0" y="0" width="248" height="110" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2"/>
    <rect x="0" y="0" width="248" height="28" rx="10" fill="url(#blueGrad)"/>
    <rect x="0" y="14" width="248" height="14" fill="url(#blueGrad)"/>
    <text x="124" y="19" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📥 receive() — Incoming Events</text>
    <text x="12" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">msg = await receive()</text>
    <text x="12" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">HTTP:  {"type": "http.request", "body": b"hello"}</text>
    <text x="12" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">WS:    {"type": "websocket.receive", "text": "hi"}</text>
    <text x="12" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Async callable · app pulls events from server</text>
    <text x="124" y="107" fill="#2196f3" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">App → Server: "give me the next event"</text>
  </g>

  <!-- send() card -->
  <g transform="translate(576, 298)" filter="url(#shadow)">
    <rect x="0" y="0" width="254" height="110" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2"/>
    <rect x="0" y="0" width="254" height="28" rx="10" fill="url(#orangeGrad)"/>
    <rect x="0" y="14" width="254" height="14" fill="url(#orangeGrad)"/>
    <text x="127" y="19" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📤 send() — Outgoing Events</text>
    <text x="12" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">await send({"type":"http.response.start","status":200})</text>
    <text x="12" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">await send({"type":"http.response.body","body":b"Hi"})</text>
    <text x="12" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Async callable · app pushes events to server</text>
    <text x="12" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Two-step: start (headers) → body</text>
    <text x="127" y="107" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">App → Server: "here is my response"</text>
  </g>

  <!-- ======= ROW 3: WSGI vs ASGI ======= -->

  <!-- WSGI -->
  <g transform="translate(30, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="70" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="24" rx="10" fill="url(#redGrad)"/>
    <rect x="0" y="12" width="380" height="12" fill="url(#redGrad)"/>
    <text x="190" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❌ Old: WSGI — def app(environ, start_response)</text>
    <text x="190" y="40" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Synchronous only · No WebSockets · No streaming · No SSE · No long-lived connections</text>
    <text x="190" y="56" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Flask, Django (traditional) — one thread per request, blocking I/O</text>
  </g>

  <!-- ASGI -->
  <g transform="translate(445, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="385" height="70" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <rect x="0" y="0" width="385" height="24" rx="10" fill="url(#greenGrad)"/>
    <rect x="0" y="12" width="385" height="12" fill="url(#greenGrad)"/>
    <text x="192" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✅ New: ASGI — async def app(scope, receive, send)</text>
    <text x="192" y="40" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Async I/O · WebSockets · Streaming responses · SSE · Long-lived connections</text>
    <text x="192" y="56" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">FastAPI + Uvicorn — event-driven, one thread handles thousands of connections</text>
  </g>
</svg>
