<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <defs>
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="headerGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="headerOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="headerRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="headerPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="540" fill="#0d1117"/>

  <!-- Title -->
  <text x="430" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Concurrency vs Parallelism — The Burger Shop</text>
  <text x="430" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">One chef, smart switching (concurrent) vs many chefs, all working at once (parallel)</text>

  <!-- ══ LEFT PANEL: Concurrent Burgers ══ -->
  <g transform="translate(30, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="320" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="36" rx="12" fill="url(#headerGreen)"/>
    <rect x="0" y="24" width="380" height="12" fill="url(#headerGreen)"/>
    <text x="190" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🍔 Concurrent Burgers (async def)</text>

    <!-- Timeline steps -->
    <!-- Step 1 -->
    <rect x="14" y="50" width="352" height="42" rx="8" fill="#21262d"/>
    <text x="24" y="67" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">1. Order &amp; get a number 🎫</text>
    <text x="24" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">You place order, cashier gives you a ticket → you're FREE</text>

    <!-- Step 2 -->
    <rect x="14" y="100" width="352" height="42" rx="8" fill="#21262d"/>
    <text x="24" y="117" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">2. Sit &amp; entertain your crush 💕</text>
    <text x="24" y="132" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">While kitchen cooks → YOU do other work (await = pause here)</text>

    <!-- Step 3 -->
    <rect x="14" y="150" width="352" height="42" rx="8" fill="#21262d"/>
    <text x="24" y="167" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">3. Number called → pick up 🔔</text>
    <text x="24" y="182" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">I/O done → resume from where you paused. Get burgers. Done.</text>

    <!-- Verdict box -->
    <rect x="14" y="202" width="352" height="54" rx="8" fill="#0d2818" stroke="#4caf50" stroke-width="1"/>
    <text x="190" y="222" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✅ Best for: I/O-bound work</text>
    <text x="190" y="238" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Network calls · DB queries · File reads</text>
    <text x="190" y="252" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Web APIs · Most FastAPI routes</text>

    <!-- Key insight -->
    <text x="190" y="290" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" font-style="italic" text-anchor="middle">One thread, many tasks — smart switching while waiting</text>
    <text x="190" y="306" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">→ Use async def + await</text>
  </g>

  <!-- ══ RIGHT PANEL: Parallel Burgers ══ -->
  <g transform="translate(450, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="320" rx="12" fill="#161b22" stroke="#f44336" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="36" rx="12" fill="url(#headerRed)"/>
    <rect x="0" y="24" width="380" height="12" fill="url(#headerRed)"/>
    <text x="190" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🍔 Parallel Burgers (multiprocessing)</text>

    <!-- Step 1 -->
    <rect x="14" y="50" width="352" height="42" rx="8" fill="#21262d"/>
    <text x="24" y="67" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold">1. Multiple cashiers + cooks 👨‍🍳👨‍🍳👨‍🍳</text>
    <text x="24" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Many workers literally doing different things simultaneously</text>

    <!-- Step 2 -->
    <rect x="14" y="100" width="352" height="42" rx="8" fill="#21262d"/>
    <text x="24" y="117" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold">2. You stand &amp; watch 👀</text>
    <text x="24" y="132" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">No multitasking — you're locked to the counter waiting</text>

    <!-- Step 3 -->
    <rect x="14" y="150" width="352" height="42" rx="8" fill="#21262d"/>
    <text x="24" y="167" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold">3. Order ready → take it 🥡</text>
    <text x="24" y="182" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">More throughput via raw CPU workers, not smart scheduling</text>

    <!-- Verdict box -->
    <rect x="14" y="202" width="352" height="54" rx="8" fill="#2d0a0a" stroke="#f44336" stroke-width="1"/>
    <text x="190" y="222" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✅ Best for: CPU-bound work</text>
    <text x="190" y="238" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Image/audio processing · ML/DL training</text>
    <text x="190" y="252" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Computer vision · Heavy math</text>

    <!-- Key insight -->
    <text x="190" y="290" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" font-style="italic" text-anchor="middle">Multiple cores, true simultaneous execution</text>
    <text x="190" y="306" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">→ Use multiprocessing</text>
  </g>

  <!-- ══ BOTTOM: async def vs def in FastAPI ══ -->
  <g transform="translate(30, 408)" filter="url(#shadow)">
    <rect x="0" y="0" width="800" height="108" rx="12" fill="#161b22" stroke="#ff9800" stroke-width="2"/>
    <rect x="0" y="0" width="800" height="36" rx="12" fill="url(#headerOrange)"/>
    <rect x="0" y="24" width="800" height="12" fill="url(#headerOrange)"/>
    <text x="400" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚡ async def vs def in FastAPI — What Actually Happens</text>

    <!-- Two columns -->
    <line x1="400" y1="40" x2="400" y2="100" stroke="#21262d" stroke-width="1.5"/>

    <!-- Left: async def -->
    <text x="30" y="57" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">async def route_handler():</text>
    <text x="30" y="73" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">→ Called directly by FastAPI and awaited</text>
    <text x="30" y="87" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">→ Runs on main event loop thread</text>
    <text x="30" y="101" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">→ Use when your code uses await</text>

    <!-- Right: def -->
    <text x="420" y="57" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">def route_handler():</text>
    <text x="420" y="73" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">→ Run in external threadpool (auto by FastAPI)</text>
    <text x="420" y="87" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">→ Doesn't block event loop (~100ns overhead)</text>
    <text x="420" y="101" fill="#2196f3" font-family="Inter, sans-serif" font-size="10">→ Use with sync libraries; safe default if unsure</text>
  </g>

  <!-- Footer note -->
  <text x="430" y="532" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">FastAPI advantage: handles BOTH concurrency (async) and parallelism (multiprocessing) simultaneously 🚀</text>
</svg>
