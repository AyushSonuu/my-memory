<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="doll1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="doll2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="doll3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Matryoshka Embeddings: Flexible Dimensions</text>
  <text x="450" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Information density decreases as you go deeper — use fewer dims for speed, more for quality 🪆</text>

  <!-- Largest doll (1000 dims) -->
  <g transform="translate(100, 120)">
    <ellipse cx="100" cy="200" rx="90" ry="160" fill="url(#doll1Grad)" filter="url(#shadow)"/>
    <ellipse cx="100" cy="140" rx="70" ry="80" fill="#0d1117"/>
    <circle cx="85" cy="130" r="8" fill="#fff"/>
    <circle cx="115" cy="130" r="8" fill="#fff"/>
    <circle cx="85" cy="130" r="4" fill="#1e1e1e"/>
    <circle cx="115" cy="130" r="4" fill="#1e1e1e"/>
    <path d="M 85 150 Q 100 160 115 150" stroke="#fff" stroke-width="2" fill="none"/>

    <text x="100" y="270" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1000 dims</text>
    <text x="100" y="290" fill="#ffcdd2" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Full fidelity</text>
    <text x="100" y="305" fill="#ffcdd2" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">100% info</text>
  </g>

  <!-- Middle doll (500 dims) -->
  <g transform="translate(320, 150)">
    <ellipse cx="90" cy="160" rx="75" ry="135" fill="url(#doll2Grad)" filter="url(#shadow)"/>
    <ellipse cx="90" cy="110" rx="60" ry="65" fill="#0d1117"/>
    <circle cx="78" cy="105" r="7" fill="#fff"/>
    <circle cx="102" cy="105" r="7" fill="#fff"/>
    <circle cx="78" cy="105" r="3" fill="#1e1e1e"/>
    <circle cx="102" cy="105" r="3" fill="#1e1e1e"/>
    <path d="M 78 120 Q 90 128 102 120" stroke="#fff" stroke-width="2" fill="none"/>

    <text x="90" y="230" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">500 dims</text>
    <text x="90" y="247" fill="#ffe0b2" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Medium fidelity</text>
    <text x="90" y="260" fill="#ffe0b2" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">~95% info</text>
  </g>

  <!-- Smallest doll (100 dims) -->
  <g transform="translate(520, 180)">
    <ellipse cx="80" cy="120" rx="60" ry="110" fill="url(#doll3Grad)" filter="url(#shadow)"/>
    <ellipse cx="80" cy="80" rx="48" ry="50" fill="#0d1117"/>
    <circle cx="70" cy="77" r="6" fill="#fff"/>
    <circle cx="90" cy="77" r="6" fill="#fff"/>
    <circle cx="70" cy="77" r="2.5" fill="#1e1e1e"/>
    <circle cx="90" cy="77" r="2.5" fill="#1e1e1e"/>
    <path d="M 70 90 Q 80 97 90 90" stroke="#fff" stroke-width="1.5" fill="none"/>

    <text x="80" y="175" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100 dims</text>
    <text x="80" y="190" fill="#c8e6c9" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Low fidelity</text>
    <text x="80" y="202" fill="#c8e6c9" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">~80% info</text>
  </g>

  <!-- Right side: Use cases -->
  <g transform="translate(670, 100)">
    <rect width="210" height="340" rx="12" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>

    <text x="105" y="30" fill="#2196f3" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">💡 How to Use</text>

    <!-- Strategy 1 -->
    <g transform="translate(15, 50)">
      <rect width="180" height="75" rx="8" fill="#1e3a1e" stroke="#4caf50" stroke-width="1.5"/>
      <text x="90" y="18" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Low-Fidelity Only</text>
      <text x="90" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Always use first 100 dims</text>
      <text x="90" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">• 10× smaller, 10× faster</text>
      <text x="90" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">• ~80% quality preserved</text>
    </g>

    <!-- Strategy 2 -->
    <g transform="translate(15, 140)">
      <rect width="180" height="75" rx="8" fill="#3d2e1f" stroke="#ff9800" stroke-width="1.5"/>
      <text x="90" y="18" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">High-Fidelity Always</text>
      <text x="90" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Always use full 1000 dims</text>
      <text x="90" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">• Maximum quality</text>
      <text x="90" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">• Slower, more expensive</text>
    </g>

    <!-- Strategy 3 (Hybrid - Best) -->
    <g transform="translate(15, 230)">
      <rect width="180" height="95" rx="8" fill="#1e3a5f" stroke="#2196f3" stroke-width="2"/>
      <text x="90" y="18" fill="#2196f3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⚡ Hybrid (Best!)</text>
      <text x="90" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">1. Retrieve with 100 dims (fast)</text>
      <text x="90" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">2. Rescore top-K with 1000</text>
      <text x="90" y="67" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">• Speed of 100-dim search</text>
      <text x="90" y="79" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">• Quality of 1000-dim ranking</text>
      <text x="90" y="91" fill="#4caf50" font-family="Inter, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">✓ Best of both worlds!</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="450" y="470" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">🪆 Key property: Dimensions sorted by info density — first 100 dims = most variance, last 900 = less critical</text>
  <text x="450" y="490" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">🎯 Perfect for dynamic environments: switch from low to high fidelity as needed (speed vs quality)</text>
</svg>
