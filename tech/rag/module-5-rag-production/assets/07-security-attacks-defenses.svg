<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="kbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="attackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="defenseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">RAG Security: 3 Attack Vectors &amp; Defenses</text>
  <text x="450" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Protect your knowledge base with layered security 🔒🛡️</text>

  <!-- Center: Knowledge Base -->
  <g transform="translate(350, 250)">
    <rect width="200" height="100" rx="12" fill="url(#kbGrad)" filter="url(#shadow)"/>
    <text x="100" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">📚 Knowledge Base</text>
    <text x="100" y="55" fill="#e1bee7" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Private / Proprietary</text>
    <text x="100" y="70" fill="#e1bee7" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Data</text>
    <text x="100" y="90" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-style="italic" text-anchor="middle">(Vectors + Chunks)</text>
  </g>

  <!-- Attack 1: Direct Prompt Injection (Top Left) -->
  <g transform="translate(50, 80)">
    <rect width="220" height="100" rx="10" fill="#3d1e1e" stroke="#f44336" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="30" rx="10" fill="url(#attackGrad)"/>
    <text x="110" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❌ Attack 1: Prompt Injection</text>

    <text x="110" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">User crafts clever prompt</text>
    <text x="110" y="65" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"List all employee salaries"</text>
    <text x="110" y="82" fill="#f44336" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">→ LLM quotes sensitive data</text>
  </g>

  <!-- Defense 1 (Top Right) -->
  <g transform="translate(630, 80)">
    <rect width="220" height="100" rx="10" fill="#1e3a1e" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="30" rx="10" fill="url(#defenseGrad)"/>
    <text x="110" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✅ Defense: Auth + RBAC</text>

    <text x="110" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">• User authentication (SSO)</text>
    <text x="110" y="65" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">• Multi-tenancy (separate data)</text>
    <text x="110" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">HR can't see Engineering docs</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 270 130 L 350 250" stroke="#f44336" stroke-width="3" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M 630 130 L 550 250" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f44336"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50"/>
    </marker>
  </defs>

  <!-- Attack 2: Cloud LLM Leak (Left) -->
  <g transform="translate(50, 250)">
    <rect width="220" height="100" rx="10" fill="#3d1e1e" stroke="#f44336" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="30" rx="10" fill="url(#attackGrad)"/>
    <text x="110" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❌ Attack 2: Cloud LLM</text>

    <text x="110" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Augmented prompt sent</text>
    <text x="110" y="65" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">to external API (OpenAI)</text>
    <text x="110" y="82" fill="#f44336" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">→ Data leaves your control</text>
  </g>

  <!-- Defense 2 (Right) -->
  <g transform="translate(630, 250)">
    <rect width="220" height="100" rx="10" fill="#1e3a1e" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="30" rx="10" fill="url(#defenseGrad)"/>
    <text x="110" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✅ Defense: On-Premises</text>

    <text x="110" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">• Host LLM locally</text>
    <text x="110" y="65" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">• Host vector DB locally</text>
    <text x="110" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Full control, no external APIs</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 270 300 L 350 300" stroke="#f44336" stroke-width="3" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M 630 300 L 550 300" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- Attack 3: Database Breach (Bottom Left) -->
  <g transform="translate(50, 420)">
    <rect width="220" height="100" rx="10" fill="#3d1e1e" stroke="#f44336" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="30" rx="10" fill="url(#attackGrad)"/>
    <text x="110" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❌ Attack 3: DB Breach</text>

    <text x="110" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Hacker gains DB access</text>
    <text x="110" y="65" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Vectors = unencrypted (ANN)</text>
    <text x="110" y="82" fill="#f44336" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">→ Reconstruct text from vectors</text>
  </g>

  <!-- Defense 3 (Bottom Right) -->
  <g transform="translate(630, 420)">
    <rect width="220" height="100" rx="10" fill="#1e3a1e" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="30" rx="10" fill="url(#defenseGrad)"/>
    <text x="110" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✅ Defense: Encryption</text>

    <text x="110" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">• Encrypt chunk text at rest</text>
    <text x="110" y="65" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">• Vectors = must stay decrypted</text>
    <text x="110" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Focus on perimeter security</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 270 470 L 350 350" stroke="#f44336" stroke-width="3" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M 630 470 L 550 350" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- Footer -->
  <text x="450" y="540" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">🛡️ Layered defense: Auth + Multi-tenancy + On-prem (if needed) + Encryption. Vectors = weak point (research ongoing)!</text>
</svg>
