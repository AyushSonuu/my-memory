<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350">
  <defs>
    <linearGradient id="run1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="run2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ce93d8"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadowEx">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="350" fill="#0d1117"/>

  <!-- Title -->
  <text x="375" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Precision-Recall Trade-off Example</text>

  <!-- Ground truth badge -->
  <rect x="280" y="45" width="190" height="30" rx="6" fill="#238636"/>
  <text x="375" y="66" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Knowledge Base: 10 Relevant Docs</text>

  <!-- RUN 1 -->
  <rect x="30" y="95" width="330" height="230" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="30" y="95" width="330" height="35" rx="10" fill="url(#run1Grad)"/>
  <text x="195" y="120" fill="#fff" font-family="Inter, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">RUN 1</text>

  <!-- Run 1 docs visualization -->
  <text x="195" y="155" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Retrieved 12 documents:</text>

  <!-- 8 relevant (green) -->
  <g transform="translate(50, 170)">
    <circle cx="0" cy="0" r="12" fill="#4caf50"/>
    <circle cx="32" cy="0" r="12" fill="#4caf50"/>
    <circle cx="64" cy="0" r="12" fill="#4caf50"/>
    <circle cx="96" cy="0" r="12" fill="#4caf50"/>
    <circle cx="128" cy="0" r="12" fill="#4caf50"/>
    <circle cx="160" cy="0" r="12" fill="#4caf50"/>
    <circle cx="192" cy="0" r="12" fill="#4caf50"/>
    <circle cx="224" cy="0" r="12" fill="#4caf50"/>
    <!-- 4 irrelevant (red) -->
    <circle cx="256" cy="0" r="12" fill="#f44336"/>
    <circle cx="288" cy="0" r="12" fill="#f44336"/>
    <circle cx="0" cy="32" r="12" fill="#f44336"/>
    <circle cx="32" cy="32" r="12" fill="#f44336"/>
  </g>

  <!-- Run 1 legend -->
  <circle cx="70" cy="235" r="8" fill="#4caf50"/>
  <text x="85" y="239" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">8 Relevant</text>
  <circle cx="170" cy="235" r="8" fill="#f44336"/>
  <text x="185" y="239" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">4 Irrelevant</text>

  <!-- Run 1 metrics -->
  <rect x="50" y="255" width="120" height="50" rx="6" fill="#1f6feb"/>
  <text x="110" y="275" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Precision</text>
  <text x="110" y="295" fill="#fff" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">66%</text>

  <rect x="190" y="255" width="120" height="50" rx="6" fill="#238636"/>
  <text x="250" y="275" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Recall</text>
  <text x="250" y="295" fill="#fff" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">80%</text>

  <!-- RUN 2 -->
  <rect x="390" y="95" width="330" height="230" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="390" y="95" width="330" height="35" rx="10" fill="url(#run2Grad)"/>
  <text x="555" y="120" fill="#fff" font-family="Inter, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">RUN 2</text>

  <!-- Run 2 docs visualization -->
  <text x="555" y="155" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Retrieved 15 documents:</text>

  <!-- 9 relevant (green) -->
  <g transform="translate(410, 170)">
    <circle cx="0" cy="0" r="12" fill="#4caf50"/>
    <circle cx="32" cy="0" r="12" fill="#4caf50"/>
    <circle cx="64" cy="0" r="12" fill="#4caf50"/>
    <circle cx="96" cy="0" r="12" fill="#4caf50"/>
    <circle cx="128" cy="0" r="12" fill="#4caf50"/>
    <circle cx="160" cy="0" r="12" fill="#4caf50"/>
    <circle cx="192" cy="0" r="12" fill="#4caf50"/>
    <circle cx="224" cy="0" r="12" fill="#4caf50"/>
    <circle cx="256" cy="0" r="12" fill="#4caf50"/>
    <!-- 6 irrelevant (red) -->
    <circle cx="288" cy="0" r="12" fill="#f44336"/>
    <circle cx="0" cy="32" r="12" fill="#f44336"/>
    <circle cx="32" cy="32" r="12" fill="#f44336"/>
    <circle cx="64" cy="32" r="12" fill="#f44336"/>
    <circle cx="96" cy="32" r="12" fill="#f44336"/>
    <circle cx="128" cy="32" r="12" fill="#f44336"/>
  </g>

  <!-- Run 2 legend -->
  <circle cx="430" cy="235" r="8" fill="#4caf50"/>
  <text x="445" y="239" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">9 Relevant</text>
  <circle cx="530" cy="235" r="8" fill="#f44336"/>
  <text x="545" y="239" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">6 Irrelevant</text>

  <!-- Run 2 metrics -->
  <rect x="410" y="255" width="120" height="50" rx="6" fill="#1f6feb"/>
  <text x="470" y="275" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Precision</text>
  <text x="470" y="295" fill="#fff" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">60% ↓</text>

  <rect x="550" y="255" width="120" height="50" rx="6" fill="#238636"/>
  <text x="610" y="275" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Recall</text>
  <text x="610" y="295" fill="#fff" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">90% ↑</text>
</svg>