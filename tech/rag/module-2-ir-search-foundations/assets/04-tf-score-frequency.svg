<svg viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="25" font-size="14" font-weight="bold" fill="#333">Query: "pizza oven" — TF Score (count frequency)</text>
  <text x="10" y="50" font-size="12" fill="#666">Rule: score = number of times keyword appears in doc</text>

  <rect x="10" y="65" width="150" height="70" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="4"/>
  <text x="20" y="85" font-size="12" font-weight="bold" fill="#333">Doc 1</text>
  <text x="20" y="105" font-size="11" fill="#555">"pizza" x2, "oven" x1</text>
  <text x="20" y="135" font-size="12" font-weight="bold" fill="#2e7d32">Total: 3 points</text>

  <rect x="200" y="65" width="150" height="70" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="4"/>
  <text x="210" y="85" font-size="12" font-weight="bold" fill="#333">Doc 2</text>
  <text x="210" y="105" font-size="11" fill="#555">"pizza" x1, "oven" x3</text>
  <text x="210" y="135" font-size="12" font-weight="bold" fill="#f57c00">Total: 4 points</text>

  <text x="400" y="95" font-size="11" font-style="italic" fill="#4caf50">Better! Frequency matters.</text>
  <text x="400" y="115" font-size="11" font-style="italic" fill="#666">But long docs unfairly win...</text>
</svg>
