<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="colGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadowCol">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ColBERT: MaxSim Token-Level Scoring</text>

  <!-- Prompt tokens -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Prompt: "Great places to eat in New York"</text>
    <text x="0" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">→ 7 tokens → 7 vectors</text>

    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="55" height="25" rx="4" fill="#ff9800"/>
      <text x="27" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Great</text>

      <rect x="60" y="0" width="55" height="25" rx="4" fill="#ff9800"/>
      <text x="87" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">places</text>

      <rect x="120" y="0" width="35" height="25" rx="4" fill="#ff9800"/>
      <text x="137" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">to</text>

      <rect x="160" y="0" width="40" height="25" rx="4" fill="#ff9800"/>
      <text x="180" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">eat</text>

      <rect x="205" y="0" width="35" height="25" rx="4" fill="#ff9800"/>
      <text x="222" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">in</text>

      <rect x="245" y="0" width="50" height="25" rx="4" fill="#ff9800"/>
      <text x="270" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">New</text>

      <rect x="300" y="0" width="50" height="25" rx="4" fill="#ff9800"/>
      <text x="325" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">York</text>
    </g>
  </g>

  <!-- Document tokens -->
  <g transform="translate(450, 60)">
    <text x="0" y="0" fill="#9c27b0" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Document tokens (pre-embedded)</text>
    <text x="0" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">"NYC has amazing cuisine options"</text>

    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="40" height="25" rx="4" fill="#9c27b0"/>
      <text x="20" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">NYC</text>

      <rect x="45" y="0" width="40" height="25" rx="4" fill="#9c27b0"/>
      <text x="65" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">has</text>

      <rect x="90" y="0" width="55" height="25" rx="4" fill="#9c27b0"/>
      <text x="117" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">amazing</text>

      <rect x="150" y="0" width="55" height="25" rx="4" fill="#9c27b0"/>
      <text x="177" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">cuisine</text>

      <rect x="210" y="0" width="55" height="25" rx="4" fill="#9c27b0"/>
      <text x="237" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">options</text>
    </g>
  </g>

  <!-- Similarity Grid -->
  <g transform="translate(100, 160)">
    <text x="250" y="0" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Token Similarity Grid (Prompt × Document)</text>

    <!-- Grid header - doc tokens -->
    <text x="180" y="35" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">NYC</text>
    <text x="240" y="35" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">has</text>
    <text x="300" y="35" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">amazing</text>
    <text x="370" y="35" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">cuisine</text>
    <text x="440" y="35" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">options</text>
    <text x="510" y="35" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">MAX</text>

    <!-- Row 1: Great -->
    <text x="70" y="60" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">Great</text>
    <rect x="155" y="45" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="177" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="215" y="45" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="237" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="275" y="45" width="45" height="22" rx="3" fill="#4caf50"/>
    <text x="297" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.7</text>
    <rect x="345" y="45" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="367" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.2</text>
    <rect x="415" y="45" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="437" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="485" y="45" width="45" height="22" rx="3" fill="#4caf50"/>
    <text x="507" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">0.7</text>

    <!-- Row 2: eat -->
    <text x="70" y="90" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">eat</text>
    <rect x="155" y="75" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="177" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.2</text>
    <rect x="215" y="75" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="237" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="275" y="75" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="297" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.3</text>
    <rect x="345" y="75" width="45" height="22" rx="3" fill="#4caf50"/>
    <text x="367" y="90" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.85</text>
    <rect x="415" y="75" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="437" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.2</text>
    <rect x="485" y="75" width="45" height="22" rx="3" fill="#4caf50"/>
    <text x="507" y="90" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">0.85</text>

    <!-- Row 3: New -->
    <text x="70" y="120" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">New</text>
    <rect x="155" y="105" width="45" height="22" rx="3" fill="#4caf50"/>
    <text x="177" y="120" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.9</text>
    <rect x="215" y="105" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="237" y="120" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="275" y="105" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="297" y="120" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="345" y="105" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="367" y="120" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="415" y="105" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="437" y="120" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="485" y="105" width="45" height="22" rx="3" fill="#4caf50"/>
    <text x="507" y="120" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">0.9</text>

    <!-- Row 4: York -->
    <text x="70" y="150" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">York</text>
    <rect x="155" y="135" width="45" height="22" rx="3" fill="#4caf50"/>
    <text x="177" y="150" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.88</text>
    <rect x="215" y="135" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="237" y="150" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="275" y="135" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="297" y="150" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="345" y="135" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="367" y="150" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="415" y="135" width="45" height="22" rx="3" fill="#21262d"/>
    <text x="437" y="150" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.1</text>
    <rect x="485" y="135" width="45" height="22" rx="3" fill="#4caf50"/>
    <text x="507" y="150" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">0.88</text>
  </g>

  <!-- MaxSim Calculation -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="600" height="60" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadowCol)"/>
    <text x="300" y="25" fill="#9c27b0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MaxSim Score = Sum of MAX values per prompt token</text>
    <text x="300" y="48" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Score = 0.7 + 0.85 + 0.9 + 0.88 + ... = 3.33</text>
  </g>

  <!-- Key insight -->
  <g transform="translate(100, 430)">
    <text x="0" y="0" fill="#58a6ff" font-family="Inter, sans-serif" font-size="10" font-weight="bold">💡 Key:</text>
    <text x="50" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">"New" and "York" both match "NYC" strongly! Token-level matching captures this nuance.</text>
    <text x="0" y="20" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold">⚠️ Cost:</text>
    <text x="50" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">2000-token doc = 2000 vectors to store (vs 1 in bi-encoder). Storage explodes!</text>
  </g>
</svg>