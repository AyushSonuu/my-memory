<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320">
  <defs>
    <filter id="shadowCmp">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="320" fill="#0d1117"/>

  <!-- Title -->
  <text x="375" y="28" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Fixed-Size vs Semantic Chunking</text>

  <!-- Example text -->
  <g transform="translate(50, 55)">
    <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Example text: "Canada is known for its Maple syrup. The country has beautiful mountains. Canadian landscapes are stunning."</text>
  </g>

  <!-- Fixed Size -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="310" height="200" rx="12" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadowCmp)"/>
    <rect x="0" y="0" width="310" height="35" rx="12" fill="#f44336"/>
    <text x="155" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Fixed-Size Chunking</text>

    <!-- Chunks -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="#21262d"/>
      <text x="140" y="18" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Chunk 1 (chars 1-50)</text>
      <text x="140" y="32" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"Canada is known for its Maple syrup. The coun"</text>
    </g>

    <g transform="translate(15, 98)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="#21262d"/>
      <text x="140" y="18" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Chunk 2 (chars 51-100)</text>
      <text x="140" y="32" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"try has beautiful mountains. Canadian landsca"</text>
    </g>

    <g transform="translate(15, 146)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="#21262d"/>
      <text x="140" y="18" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Chunk 3 (chars 101-...)</text>
      <text x="140" y="32" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"pes are stunning."</text>
    </g>
  </g>

  <!-- Problem arrow -->
  <g transform="translate(155, 290)">
    <text x="0" y="0" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">❌ Splits mid-word: "coun|try", "landsca|pes"</text>
  </g>

  <!-- Semantic -->
  <g transform="translate(390, 85)">
    <rect x="0" y="0" width="310" height="200" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowCmp)"/>
    <rect x="0" y="0" width="310" height="35" rx="12" fill="#4caf50"/>
    <text x="155" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Semantic Chunking</text>

    <!-- All in one chunk because similar meaning -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="280" height="135" rx="6" fill="#4caf50" opacity="0.15" stroke="#4caf50" stroke-width="1"/>
      <text x="140" y="20" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Single Chunk (similar meaning)</text>

      <text x="140" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"Canada is known for its Maple syrup.</text>
      <text x="140" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">The country has beautiful mountains.</text>
      <text x="140" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Canadian landscapes are stunning."</text>

      <text x="140" y="120" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">All 3 sentences about Canada's nature</text>
      <text x="140" y="132" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">→ kept together!</text>
    </g>
  </g>

  <!-- Benefit arrow -->
  <g transform="translate(545, 290)">
    <text x="0" y="0" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">✅ Groups by meaning, not arbitrary characters</text>
  </g>
</svg>