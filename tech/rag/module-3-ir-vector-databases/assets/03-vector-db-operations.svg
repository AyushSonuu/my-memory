<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
  <defs>
    <linearGradient id="setupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="loadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <linearGradient id="searchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <filter id="shadowVdb">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="375" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Vector Database Operations Pipeline</text>

  <!-- Phase 1: Setup -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#161b22" stroke="#667eea" stroke-width="2" filter="url(#shadowVdb)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="url(#setupGrad)"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. SETUP</text>

    <text x="15" y="60" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">• Connect to instance</text>
    <text x="15" y="80" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">• Create collection</text>
    <text x="15" y="100" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">• Define properties</text>
    <text x="15" y="120" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">• Set vectorizer model</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 240 130 L 270 130" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>

  <!-- Phase 2: Load & Index -->
  <g transform="translate(275, 60)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#161b22" stroke="#38ef7d" stroke-width="2" filter="url(#shadowVdb)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="url(#loadGrad)"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. LOAD &amp; INDEX</text>

    <text x="15" y="60" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">• Batch insert documents</text>
    <text x="15" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" font-style="italic">Auto-generated:</text>
    <text x="15" y="97" fill="#4caf50" font-family="Inter, sans-serif" font-size="11">✓ Sparse vectors (BM25)</text>
    <text x="15" y="114" fill="#4caf50" font-family="Inter, sans-serif" font-size="11">✓ Dense vectors (embeddings)</text>
    <text x="15" y="131" fill="#4caf50" font-family="Inter, sans-serif" font-size="11">✓ HNSW index</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 485 130 L 515 130" stroke="#38ef7d" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38ef7d"/>
    </marker>
  </defs>

  <!-- Phase 3: Search -->
  <g transform="translate(520, 60)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#161b22" stroke="#f5576c" stroke-width="2" filter="url(#shadowVdb)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="url(#searchGrad)"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. SEARCH</text>

    <text x="15" y="60" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">• near_text (semantic)</text>
    <text x="15" y="80" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">• bm25 (keyword)</text>
    <text x="15" y="100" fill="#ffd54f" font-family="Inter, sans-serif" font-size="11" font-weight="bold">• hybrid (production ⭐)</text>
    <text x="15" y="120" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">• + metadata filters</text>
  </g>

  <!-- Search Types Detail -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="690" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="345" y="25" fill="#e6edf3" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Search Methods Comparison</text>

    <!-- Vector Search -->
    <rect x="20" y="45" width="200" height="90" rx="8" fill="#1f6feb" opacity="0.2"/>
    <text x="120" y="70" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VECTOR (near_text)</text>
    <text x="120" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Find by meaning</text>
    <text x="120" y="110" fill="#e6edf3" font-family="monospace" font-size="9" text-anchor="middle">alpha = 1.0</text>
    <text x="120" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"similar concepts"</text>

    <!-- Keyword Search -->
    <rect x="245" y="45" width="200" height="90" rx="8" fill="#238636" opacity="0.2"/>
    <text x="345" y="70" fill="#3fb950" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">KEYWORD (bm25)</text>
    <text x="345" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Find exact terms</text>
    <text x="345" y="110" fill="#e6edf3" font-family="monospace" font-size="9" text-anchor="middle">alpha = 0.0</text>
    <text x="345" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"exact words"</text>

    <!-- Hybrid Search -->
    <rect x="470" y="45" width="200" height="90" rx="8" fill="#f5576c" opacity="0.2"/>
    <text x="570" y="70" fill="#f5576c" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">HYBRID ⭐</text>
    <text x="570" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Best of both</text>
    <text x="570" y="110" fill="#e6edf3" font-family="monospace" font-size="9" text-anchor="middle">alpha = 0.25 (default)</text>
    <text x="570" y="125" fill="#ffd54f" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Production choice!</text>
  </g>
</svg>