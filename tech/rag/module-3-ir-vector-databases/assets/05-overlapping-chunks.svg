<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <linearGradient id="chunk1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="90%" style="stop-color:#2196f3"/>
      <stop offset="90%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#4caf50"/>
    </linearGradient>
    <linearGradient id="chunk2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="10%" style="stop-color:#4caf50"/>
      <stop offset="10%" style="stop-color:#ff9800"/>
      <stop offset="90%" style="stop-color:#ff9800"/>
      <stop offset="90%" style="stop-color:#e91e63"/>
      <stop offset="100%" style="stop-color:#e91e63"/>
    </linearGradient>
    <linearGradient id="chunk3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="10%" style="stop-color:#e91e63"/>
      <stop offset="10%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#9c27b0"/>
    </linearGradient>
    <filter id="shadowOv">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="320" fill="#0d1117"/>

  <!-- Title -->
  <text x="350" y="28" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Fixed-Size Chunking with Overlap</text>

  <!-- Document bar -->
  <g transform="translate(50, 55)">
    <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">Original Document (characters 1-750):</text>
    <rect x="0" y="10" width="600" height="25" rx="4" fill="#21262d"/>

    <!-- Character markers -->
    <line x1="0" y1="38" x2="0" y2="45" stroke="#8b949e" stroke-width="1"/>
    <text x="0" y="58" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">1</text>

    <line x1="200" y1="38" x2="200" y2="45" stroke="#8b949e" stroke-width="1"/>
    <text x="200" y="58" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">250</text>

    <line x1="400" y1="38" x2="400" y2="45" stroke="#8b949e" stroke-width="1"/>
    <text x="400" y="58" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">500</text>

    <line x1="600" y1="38" x2="600" y2="45" stroke="#8b949e" stroke-width="1"/>
    <text x="600" y="58" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">750</text>
  </g>

  <!-- Chunk visualization -->
  <g transform="translate(50, 135)">
    <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">Chunks (250 chars, 10% overlap = 25 char overlap):</text>

    <!-- Chunk 1 -->
    <rect x="0" y="15" width="200" height="35" rx="6" fill="#2196f3" filter="url(#shadowOv)"/>
    <text x="100" y="37" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Chunk 1</text>
    <text x="100" y="48" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">chars 1-250</text>

    <!-- Overlap zone 1-2 -->
    <rect x="180" y="55" width="40" height="15" rx="3" fill="#4caf50" opacity="0.6"/>
    <text x="200" y="65" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">overlap</text>

    <!-- Chunk 2 -->
    <rect x="180" y="75" width="200" height="35" rx="6" fill="#ff9800" filter="url(#shadowOv)"/>
    <text x="280" y="97" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Chunk 2</text>
    <text x="280" y="108" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">chars 226-475</text>

    <!-- Overlap zone 2-3 -->
    <rect x="360" y="115" width="40" height="15" rx="3" fill="#e91e63" opacity="0.6"/>
    <text x="380" y="125" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">overlap</text>

    <!-- Chunk 3 -->
    <rect x="360" y="135" width="200" height="35" rx="6" fill="#9c27b0" filter="url(#shadowOv)"/>
    <text x="460" y="157" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Chunk 3</text>
    <text x="460" y="168" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">chars 451-700</text>
  </g>

  <!-- Benefits box -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">✅ Words at edges appear in TWO chunks → preserved context</text>
    <text x="400" y="0" fill="#ff9800" font-family="Inter, sans-serif" font-size="10">⚠️ Trade-off: more vectors, some redundancy</text>
  </g>
</svg>