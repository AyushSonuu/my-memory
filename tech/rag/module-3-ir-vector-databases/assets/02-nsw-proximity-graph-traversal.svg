<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#1a1a2e" rx="12"/>
  
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#e0e0e0">NSW: Proximity Graph Traversal</text>
  
  <!-- Nodes (documents) -->
  <circle cx="100" cy="200" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="180" cy="120" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="250" cy="280" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="300" cy="180" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="380" cy="100" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="400" cy="250" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="480" cy="180" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="520" cy="300" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="580" cy="140" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="620" cy="250" r="12" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  
  <!-- Edges (proximity connections) -->
  <line x1="100" y1="200" x2="180" y2="120" stroke="#37474f" stroke-width="1"/>
  <line x1="100" y1="200" x2="250" y2="280" stroke="#37474f" stroke-width="1"/>
  <line x1="180" y1="120" x2="300" y2="180" stroke="#37474f" stroke-width="1"/>
  <line x1="180" y1="120" x2="380" y2="100" stroke="#37474f" stroke-width="1"/>
  <line x1="250" y1="280" x2="300" y2="180" stroke="#37474f" stroke-width="1"/>
  <line x1="250" y1="280" x2="400" y2="250" stroke="#37474f" stroke-width="1"/>
  <line x1="300" y1="180" x2="380" y2="100" stroke="#37474f" stroke-width="1"/>
  <line x1="300" y1="180" x2="400" y2="250" stroke="#37474f" stroke-width="1"/>
  <line x1="300" y1="180" x2="480" y2="180" stroke="#37474f" stroke-width="1"/>
  <line x1="380" y1="100" x2="480" y2="180" stroke="#37474f" stroke-width="1"/>
  <line x1="380" y1="100" x2="580" y2="140" stroke="#37474f" stroke-width="1"/>
  <line x1="400" y1="250" x2="480" y2="180" stroke="#37474f" stroke-width="1"/>
  <line x1="400" y1="250" x2="520" y2="300" stroke="#37474f" stroke-width="1"/>
  <line x1="480" y1="180" x2="580" y2="140" stroke="#37474f" stroke-width="1"/>
  <line x1="480" y1="180" x2="620" y2="250" stroke="#37474f" stroke-width="1"/>
  <line x1="520" y1="300" x2="620" y2="250" stroke="#37474f" stroke-width="1"/>
  <line x1="580" y1="140" x2="620" y2="250" stroke="#37474f" stroke-width="1"/>
  
  <!-- Traversal path (highlighted) -->
  <line x1="100" y1="200" x2="300" y2="180" stroke="#ff9800" stroke-width="3" stroke-dasharray="6,3"/>
  <line x1="300" y1="180" x2="480" y2="180" stroke="#ff9800" stroke-width="3" stroke-dasharray="6,3"/>
  <line x1="480" y1="180" x2="580" y2="140" stroke="#ff9800" stroke-width="3" stroke-dasharray="6,3"/>
  
  <!-- Entry point marker -->
  <circle cx="100" cy="200" r="14" fill="none" stroke="#f44336" stroke-width="2.5"/>
  <text x="100" y="230" text-anchor="middle" font-family="system-ui" font-size="10" fill="#ef5350">Entry</text>
  
  <!-- Candidate progression -->
  <circle cx="300" cy="180" r="14" fill="none" stroke="#ff9800" stroke-width="2"/>
  <circle cx="480" cy="180" r="14" fill="none" stroke="#ff9800" stroke-width="2"/>
  
  <!-- Final candidate -->
  <circle cx="580" cy="140" r="14" fill="none" stroke="#4caf50" stroke-width="2.5"/>
  <text x="580" y="165" text-anchor="middle" font-family="system-ui" font-size="10" fill="#66bb6a">Result</text>
  
  <!-- Query vector (star) -->
  <polygon points="600,90 605,105 620,105 608,114 612,128 600,120 588,128 592,114 580,105 595,105" fill="#2196f3"/>
  <text x="600" y="80" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64b5f6" font-weight="bold">Query</text>
  
  <!-- Legend -->
  <rect x="30" y="330" width="640" height="55" rx="6" fill="rgba(255,255,255,0.04)" stroke="#444" stroke-width="1"/>
  <circle cx="60" cy="355" r="5" fill="#f44336"/>
  <text x="75" y="359" font-family="system-ui" font-size="11" fill="#aaa">Random entry</text>
  <line x1="170" y1="355" x2="200" y2="355" stroke="#ff9800" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="210" y="359" font-family="system-ui" font-size="11" fill="#aaa">Traversal path</text>
  <circle cx="330" cy="355" r="5" fill="#4caf50"/>
  <text x="345" y="359" font-family="system-ui" font-size="11" fill="#aaa">Best candidate (returned)</text>
  <polygon points="530,350 533,357 540,357 535,362 537,369 530,365 523,369 525,362 520,357 527,357" fill="#2196f3"/>
  <text x="550" y="362" font-family="system-ui" font-size="11" fill="#aaa">Query vector (target)</text>
  <text x="350" y="378" text-anchor="middle" font-family="system-ui" font-size="10" fill="#666">At each hop: move to whichever neighbor is closest to query. Stop when no neighbor is closer.</text>
</svg>
