<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <rect width="700" height="380" fill="#1a1a2e" rx="12"/>
  
  <!-- Title -->
  <text x="350" y="32" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#e0e0e0">KNN: K-Nearest Neighbors (Brute Force)</text>
  
  <!-- Prompt vector (center-left) -->
  <circle cx="200" cy="190" r="16" fill="#ff9800" stroke="#ffcc80" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" font-family="system-ui" font-size="11" fill="#fff" font-weight="bold">Q</text>
  <text x="200" y="225" text-anchor="middle" font-family="system-ui" font-size="11" fill="#ffcc80">Prompt vector</text>
  
  <!-- Document vectors scattered -->
  <circle cx="350" cy="80" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="420" cy="120" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="500" cy="90" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="380" cy="180" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="450" cy="200" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="530" cy="160" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="350" cy="260" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="420" cy="290" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="500" cy="270" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="580" cy="230" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="600" cy="310" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  <circle cx="560" cy="320" r="10" fill="#455a64" stroke="#78909c" stroke-width="1.5"/>
  
  <!-- Distance lines from Q to ALL docs (showing brute force) -->
  <line x1="216" y1="190" x2="340" y2="80" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="216" y1="190" x2="410" y2="120" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="216" y1="190" x2="490" y2="90" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="216" y1="190" x2="370" y2="180" stroke="#4caf5099" stroke-width="2"/>
  <line x1="216" y1="190" x2="440" y2="200" stroke="#4caf5099" stroke-width="2"/>
  <line x1="216" y1="190" x2="520" y2="160" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="216" y1="190" x2="340" y2="260" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="216" y1="190" x2="410" y2="290" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="216" y1="190" x2="490" y2="270" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="216" y1="190" x2="570" y2="230" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="216" y1="190" x2="590" y2="310" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="216" y1="190" x2="550" y2="320" stroke="#f4433666" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Highlight closest (green rings) -->
  <circle cx="380" cy="180" r="14" fill="none" stroke="#4caf50" stroke-width="2.5"/>
  <circle cx="450" cy="200" r="14" fill="none" stroke="#4caf50" stroke-width="2.5"/>
  
  <!-- Steps on left -->
  <rect x="20" y="55" width="150" height="130" rx="6" fill="rgba(255,255,255,0.04)" stroke="#555" stroke-width="1"/>
  <text x="95" y="75" text-anchor="middle" font-family="system-ui" font-size="11" fill="#aaa" font-weight="bold">Algorithm:</text>
  <text x="30" y="95" font-family="system-ui" font-size="10" fill="#ccc">1. Embed all docs</text>
  <text x="30" y="115" font-family="system-ui" font-size="10" fill="#ccc">2. Embed query</text>
  <text x="30" y="135" font-family="system-ui" font-size="10" fill="#ef5350">3. Compute distance</text>
  <text x="30" y="150" font-family="system-ui" font-size="10" fill="#ef5350">   to EVERY doc</text>
  <text x="30" y="170" font-family="system-ui" font-size="10" fill="#ccc">4. Sort, return top-k</text>
  
  <!-- Problem callout -->
  <rect x="20" y="290" width="170" height="70" rx="6" fill="rgba(244,67,54,0.1)" stroke="#f44336" stroke-width="1"/>
  <text x="105" y="312" text-anchor="middle" font-family="system-ui" font-size="11" fill="#f44336" font-weight="bold">⚠️ PROBLEM</text>
  <text x="105" y="330" text-anchor="middle" font-family="system-ui" font-size="10" fill="#ef9a9a">1B docs = 1B calculations</text>
  <text x="105" y="347" text-anchor="middle" font-family="system-ui" font-size="10" fill="#ef9a9a">O(n) — Linear scaling</text>
  
  <!-- Label for green -->
  <text x="415" y="345" text-anchor="middle" font-family="system-ui" font-size="10" fill="#4caf50">● = closest (returned)</text>
  <text x="580" y="360" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f44336">--- = all distances computed</text>
</svg>
