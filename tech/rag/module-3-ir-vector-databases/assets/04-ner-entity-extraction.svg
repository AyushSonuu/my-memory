<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <rect width="700" height="350" fill="#1a1a2e" rx="12"/>
  
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#e0e0e0">Named Entity Recognition (NER) for Query Parsing</text>
  
  <!-- Original prompt -->
  <rect x="30" y="50" width="640" height="45" rx="6" fill="rgba(255,255,255,0.05)" stroke="#666" stroke-width="1"/>
  <text x="50" y="72" font-family="system-ui" font-size="11" fill="#ccc">"I read </text>
  <text x="96" y="72" font-family="system-ui" font-size="11" fill="#4caf50" font-weight="bold">The Great Gatsby</text>
  <text x="215" y="72" font-family="system-ui" font-size="11" fill="#ccc"> by </text>
  <text x="237" y="72" font-family="system-ui" font-size="11" fill="#2196f3" font-weight="bold">F. Scott Fitzgerald</text>
  <text x="370" y="72" font-family="system-ui" font-size="11" fill="#ccc"> last summer while visiting </text>
  <text x="560" y="72" font-family="system-ui" font-size="11" fill="#ff9800" font-weight="bold">New York</text>
  <text x="620" y="72" font-family="system-ui" font-size="11" fill="#ccc">.</text>
  <text x="50" y="88" font-family="system-ui" font-size="11" fill="#ccc">Are there similar books set in the </text>
  <text x="265" y="88" font-family="system-ui" font-size="11" fill="#9c27b0" font-weight="bold">1920s</text>
  <text x="302" y="88" font-family="system-ui" font-size="11" fill="#ccc">?"</text>
  
  <!-- Arrow down to GLiNER -->
  <path d="M 350 95 L 350 120" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar2)"/>
  
  <!-- GLiNER model box -->
  <rect x="250" y="125" width="200" height="40" rx="8" fill="rgba(156,39,176,0.15)" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="350" y="150" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#ce93d8">GLiNER Model</text>
  
  <!-- Entity types input -->
  <rect x="30" y="130" width="190" height="30" rx="5" fill="rgba(255,255,255,0.03)" stroke="#555" stroke-width="1"/>
  <text x="125" y="150" text-anchor="middle" font-family="system-ui" font-size="9" fill="#aaa">Entities: person, book, location, date</text>
  <path d="M 220 145 L 248 145" stroke="#666" stroke-width="1" fill="none" marker-end="url(#ar2)"/>
  
  <!-- Arrow down to labeled output -->
  <path d="M 350 165 L 350 195" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar2)"/>
  
  <!-- Labeled entities output -->
  <rect x="80" y="200" width="540" height="80" rx="8" fill="rgba(255,255,255,0.04)" stroke="#666" stroke-width="1"/>
  <text x="350" y="222" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#e0e0e0">Extracted Entities:</text>
  
  <!-- Entity chips -->
  <rect x="100" y="235" width="130" height="24" rx="12" fill="rgba(76,175,80,0.2)" stroke="#4caf50" stroke-width="1"/>
  <text x="165" y="251" text-anchor="middle" font-family="system-ui" font-size="10" fill="#4caf50">📖 The Great Gatsby</text>
  
  <rect x="245" y="235" width="130" height="24" rx="12" fill="rgba(33,150,243,0.2)" stroke="#2196f3" stroke-width="1"/>
  <text x="310" y="251" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2196f3">👤 F. Scott Fitzgerald</text>
  
  <rect x="390" y="235" width="95" height="24" rx="12" fill="rgba(255,152,0,0.2)" stroke="#ff9800" stroke-width="1"/>
  <text x="437" y="251" text-anchor="middle" font-family="system-ui" font-size="10" fill="#ff9800">📍 New York</text>
  
  <rect x="500" y="235" width="80" height="24" rx="12" fill="rgba(156,39,176,0.2)" stroke="#9c27b0" stroke-width="1"/>
  <text x="540" y="251" text-anchor="middle" font-family="system-ui" font-size="10" fill="#ce93d8">📅 1920s</text>
  
  <!-- Use cases -->
  <rect x="80" y="295" width="540" height="40" rx="6" fill="rgba(255,255,255,0.03)" stroke="#555" stroke-width="1"/>
  <text x="350" y="314" text-anchor="middle" font-family="system-ui" font-size="10" fill="#aaa">Use entities for: </text>
  <text x="200" y="328" font-family="system-ui" font-size="10" fill="#4caf50">• Metadata filtering (date, location)</text>
  <text x="440" y="328" font-family="system-ui" font-size="10" fill="#2196f3">• Targeted vector search (book, person)</text>
</svg>
