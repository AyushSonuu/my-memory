<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="crossGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <filter id="shadowCross">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Cross-Encoder: How It Scores Documents</text>

  <!-- Prompt -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="200" height="45" rx="8" fill="#ff9800" filter="url(#shadowCross)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Prompt</text>
    <text x="100" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"Great places to eat in NY"</text>
  </g>

  <!-- Documents -->
  <g transform="translate(280, 55)">
    <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Documents in KB:</text>

    <rect x="0" y="15" width="200" height="30" rx="4" fill="#21262d"/>
    <text x="100" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Doc 1: "NYC has amazing cuisine..."</text>

    <rect x="0" y="55" width="200" height="30" rx="4" fill="#21262d"/>
    <text x="100" y="75" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Doc 2: "Weather forecast for NY..."</text>

    <rect x="0" y="95" width="200" height="30" rx="4" fill="#21262d"/>
    <text x="100" y="115" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Doc 3: "Best pizza joints in NYC..."</text>
  </g>

  <!-- Cross-Encoder Process -->
  <g transform="translate(50, 200)">
    <text x="0" y="0" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Step: Concatenate prompt + doc, then score</text>

    <!-- Doc 1 scoring -->
    <rect x="0" y="20" width="220" height="35" rx="6" fill="#161b22" stroke="#f44336" stroke-width="1"/>
    <text x="110" y="42" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">[Prompt + Doc1] → Cross-Encoder</text>

    <line x1="220" y1="37" x2="260" y2="37" stroke="#8b949e" stroke-width="2"/>
    <polygon points="260,37 250,31 250,43" fill="#8b949e"/>

    <rect x="260" y="25" width="70" height="25" rx="4" fill="#4caf50"/>
    <text x="295" y="42" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">0.72</text>

    <!-- Doc 2 scoring -->
    <rect x="0" y="65" width="220" height="35" rx="6" fill="#161b22" stroke="#f44336" stroke-width="1"/>
    <text x="110" y="87" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">[Prompt + Doc2] → Cross-Encoder</text>

    <line x1="220" y1="82" x2="260" y2="82" stroke="#8b949e" stroke-width="2"/>
    <polygon points="260,82 250,76 250,88" fill="#8b949e"/>

    <rect x="260" y="70" width="70" height="25" rx="4" fill="#f44336"/>
    <text x="295" y="87" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">0.15</text>

    <!-- Doc 3 scoring -->
    <rect x="0" y="110" width="220" height="35" rx="6" fill="#161b22" stroke="#f44336" stroke-width="1"/>
    <text x="110" y="132" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">[Prompt + Doc3] → Cross-Encoder</text>

    <line x1="220" y1="127" x2="260" y2="127" stroke="#8b949e" stroke-width="2"/>
    <polygon points="260,127 250,121 250,133" fill="#8b949e"/>

    <rect x="260" y="115" width="70" height="25" rx="4" fill="#4caf50"/>
    <text x="295" y="132" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">0.85</text>
  </g>

  <!-- Result -->
  <g transform="translate(400, 220)">
    <rect x="0" y="0" width="350" height="130" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadowCross)"/>
    <text x="175" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Final Ranking (by score)</text>

    <text x="30" y="55" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#1</text>
    <text x="60" y="55" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc 3: Best pizza joints...</text>
    <text x="290" y="55" fill="#4caf50" font-family="Inter, sans-serif" font-size="11">0.85</text>

    <text x="30" y="80" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#2</text>
    <text x="60" y="80" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc 1: NYC has amazing cuisine...</text>
    <text x="290" y="80" fill="#ff9800" font-family="Inter, sans-serif" font-size="11">0.72</text>

    <text x="30" y="105" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#3</text>
    <text x="60" y="105" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc 2: Weather forecast...</text>
    <text x="290" y="105" fill="#f44336" font-family="Inter, sans-serif" font-size="11">0.15</text>
  </g>

  <!-- Problem callout -->
  <g transform="translate(50, 370)">
    <text x="0" y="0" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold">⚠️ Problem:</text>
    <text x="70" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Must run cross-encoder for EVERY document in KB. With millions of docs = infeasible at query time!</text>
  </g>
</svg>