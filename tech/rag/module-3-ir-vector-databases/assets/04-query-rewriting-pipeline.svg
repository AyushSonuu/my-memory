<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
  <rect width="750" height="400" fill="#1a1a2e" rx="12"/>
  
  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#e0e0e0">Query Parsing Pipeline — From Messy Prompt to Optimized Search</text>
  
  <!-- User prompt (messy) -->
  <rect x="30" y="55" width="200" height="120" rx="8" fill="rgba(244,67,54,0.12)" stroke="#f44336" stroke-width="1.5"/>
  <text x="130" y="75" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#f44336">🗣️ Messy User Prompt</text>
  <text x="40" y="95" font-family="system-ui" font-size="9" fill="#ef9a9a">"I was out walking my dog,</text>
  <text x="40" y="108" font-family="system-ui" font-size="9" fill="#ef9a9a">a beautiful black lab named</text>
  <text x="40" y="121" font-family="system-ui" font-size="9" fill="#ef9a9a">Poppy, when she yanked on</text>
  <text x="40" y="134" font-family="system-ui" font-size="9" fill="#ef9a9a">her leash... my shoulder is</text>
  <text x="40" y="147" font-family="system-ui" font-size="9" fill="#ef9a9a">numb and fingers are pins</text>
  <text x="40" y="160" font-family="system-ui" font-size="9" fill="#ef9a9a">and needles. What's going on?"</text>
  
  <!-- Arrow to query rewriter -->
  <path d="M 230 115 L 280 115" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  
  <!-- Query Rewriter LLM -->
  <rect x="285" y="70" width="170" height="90" rx="10" fill="rgba(255,152,0,0.15)" stroke="#ff9800" stroke-width="2"/>
  <text x="370" y="95" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#ff9800">🤖 LLM Query Rewriter</text>
  <text x="370" y="115" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ffcc80">• Clarify ambiguity</text>
  <text x="370" y="130" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ffcc80">• Add domain terminology</text>
  <text x="370" y="145" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ffcc80">• Remove noise + add synonyms</text>
  
  <!-- Arrow to optimized prompt -->
  <path d="M 455 115 L 510 115" stroke="#4caf50" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  
  <!-- Optimized prompt -->
  <rect x="515" y="55" width="210" height="120" rx="8" fill="rgba(76,175,80,0.12)" stroke="#4caf50" stroke-width="1.5"/>
  <text x="620" y="75" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#4caf50">✅ Optimized Query</text>
  <text x="525" y="95" font-family="system-ui" font-size="9" fill="#a5d6a7">"Sudden forceful pull on</text>
  <text x="525" y="108" font-family="system-ui" font-size="9" fill="#a5d6a7">shoulder, persistent shoulder</text>
  <text x="525" y="121" font-family="system-ui" font-size="9" fill="#a5d6a7">numbness and finger numbness</text>
  <text x="525" y="134" font-family="system-ui" font-size="9" fill="#a5d6a7">for 3 days. Potential causes:</text>
  <text x="525" y="147" font-family="system-ui" font-size="9" fill="#a5d6a7">neuropathy, nerve</text>
  <text x="525" y="160" font-family="system-ui" font-size="9" fill="#a5d6a7">impingement?"</text>
  
  <!-- Arrow to retriever -->
  <path d="M 620 175 L 620 210" stroke="#2196f3" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  
  <!-- Retriever -->
  <rect x="540" y="215" width="160" height="50" rx="8" fill="rgba(33,150,243,0.15)" stroke="#2196f3" stroke-width="1.5"/>
  <text x="620" y="245" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#2196f3">🔍 Retriever (Vector DB)</text>
  
  <!-- Benefits panel -->
  <rect x="30" y="210" width="250" height="160" rx="8" fill="rgba(255,255,255,0.03)" stroke="#555" stroke-width="1"/>
  <text x="155" y="235" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#e0e0e0">What Query Rewriting Fixes</text>
  <text x="45" y="260" font-family="system-ui" font-size="10" fill="#ef5350">✗ Irrelevant info (dog name, breed)</text>
  <text x="45" y="280" font-family="system-ui" font-size="10" fill="#ef5350">✗ Casual language ("pins and needles")</text>
  <text x="45" y="300" font-family="system-ui" font-size="10" fill="#ef5350">✗ Missing domain terminology</text>
  <text x="45" y="320" font-family="system-ui" font-size="10" fill="#4caf50">✓ Medical terms added (neuropathy)</text>
  <text x="45" y="340" font-family="system-ui" font-size="10" fill="#4caf50">✓ Synonyms for better matching</text>
  <text x="45" y="360" font-family="system-ui" font-size="10" fill="#4caf50">✓ Clear, concise, retrieval-optimized</text>
  
  <!-- Footer -->
  <text x="375" y="390" text-anchor="middle" font-family="system-ui" font-size="10" fill="#888">Most widely used query parsing technique — simple LLM call with substantial retrieval quality improvement</text>
  
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>
</svg>
