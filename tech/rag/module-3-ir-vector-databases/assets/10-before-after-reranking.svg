<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="beforeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#c62828"/>
    </linearGradient>
    <linearGradient id="afterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="relevantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <filter id="shadowCompare">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Before vs After Reranking: The Rankings Change Dramatically</text>
  <text x="400" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Query: "What is the capital of Canada?"</text>

  <!-- BEFORE Section -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="320" height="350" rx="12" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadowCompare)"/>
    <rect x="0" y="0" width="320" height="40" rx="12" fill="url(#beforeGrad)"/>
    <rect x="0" y="28" width="320" height="12" fill="url(#beforeGrad)"/>
    <text x="160" y="28" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">❌ BEFORE Reranking</text>

    <text x="160" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Bi-encoder retrieval (semantic similarity)</text>

    <!-- Ranking bars -->
    <g transform="translate(20, 80)">
      <!-- Rank 1 - Not relevant -->
      <rect x="0" y="0" width="280" height="35" rx="6" fill="#21262d"/>
      <rect x="0" y="0" width="40" height="35" rx="6" fill="#ff9800"/>
      <rect x="28" y="0" width="12" height="35" fill="#ff9800"/>
      <text x="20" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">#1</text>
      <text x="55" y="15" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Toronto is in Canada</text>
      <text x="55" y="28" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Similarity: 0.89 — has "Canada" but doesn't answer ❌</text>

      <!-- Rank 2 - Not relevant -->
      <rect x="0" y="45" width="280" height="35" rx="6" fill="#21262d"/>
      <rect x="0" y="45" width="40" height="35" rx="6" fill="#ff9800"/>
      <rect x="28" y="45" width="12" height="35" fill="#ff9800"/>
      <text x="20" y="67" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">#2</text>
      <text x="55" y="60" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Capital of France is Paris</text>
      <text x="55" y="73" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Similarity: 0.85 — has "capital" but wrong country ❌</text>

      <!-- Rank 3 - THE ACTUAL ANSWER! -->
      <rect x="0" y="90" width="280" height="35" rx="6" fill="#1a3a1a" stroke="#4caf50" stroke-width="1"/>
      <rect x="0" y="90" width="40" height="35" rx="6" fill="#4caf50"/>
      <rect x="28" y="90" width="12" height="35" fill="#4caf50"/>
      <text x="20" y="112" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">#3</text>
      <text x="55" y="105" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Ottawa is Canada's capital</text>
      <text x="55" y="118" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Similarity: 0.82 — ACTUALLY ANSWERS! ✓</text>

      <!-- Rank 4 - Not relevant -->
      <rect x="0" y="135" width="280" height="35" rx="6" fill="#21262d"/>
      <rect x="0" y="135" width="40" height="35" rx="6" fill="#ff9800"/>
      <rect x="28" y="135" width="12" height="35" fill="#ff9800"/>
      <text x="20" y="157" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">#4</text>
      <text x="55" y="150" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Maple syrup capital of world</text>
      <text x="55" y="163" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Similarity: 0.78 — has "capital" misleadingly ❌</text>

      <!-- More docs indication -->
      <text x="140" y="195" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">... + more documents ranked by similarity ...</text>
    </g>

    <!-- Problem callout -->
    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="280" height="45" rx="6" fill="#3d1515" stroke="#f44336" stroke-width="1"/>
      <text x="140" y="18" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⚠️ PROBLEM</text>
      <text x="140" y="35" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Best answer is at rank #3, not #1!</text>
    </g>
  </g>

  <!-- Arrow between -->
  <g transform="translate(385, 220)">
    <rect x="0" y="0" width="30" height="60" rx="4" fill="#9c27b0"/>
    <text x="15" y="25" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Re-</text>
    <text x="15" y="38" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">rank</text>
    <polygon points="30,30 45,20 45,40" fill="#9c27b0"/>
  </g>

  <!-- AFTER Section -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="320" height="350" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowCompare)"/>
    <rect x="0" y="0" width="320" height="40" rx="12" fill="url(#afterGrad)"/>
    <rect x="0" y="28" width="320" height="12" fill="url(#afterGrad)"/>
    <text x="160" y="28" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✓ AFTER Reranking</text>

    <text x="160" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Cross-encoder scoring (true relevance)</text>

    <!-- Ranking bars -->
    <g transform="translate(20, 80)">
      <!-- Rank 1 - Now correct! -->
      <rect x="0" y="0" width="280" height="35" rx="6" fill="#1a3a1a" stroke="#4caf50" stroke-width="2"/>
      <rect x="0" y="0" width="40" height="35" rx="6" fill="url(#relevantGrad)"/>
      <rect x="28" y="0" width="12" height="35" fill="url(#relevantGrad)"/>
      <text x="20" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">#1</text>
      <text x="55" y="15" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Ottawa is Canada's capital ✓</text>
      <text x="55" y="28" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Relevance: 0.97 — DIRECTLY ANSWERS! ✓✓</text>

      <!-- Rank 2 -->
      <rect x="0" y="45" width="280" height="35" rx="6" fill="#21262d"/>
      <rect x="0" y="45" width="40" height="35" rx="6" fill="#8b949e"/>
      <rect x="28" y="45" width="12" height="35" fill="#8b949e"/>
      <text x="20" y="67" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">#2</text>
      <text x="55" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Toronto is in Canada</text>
      <text x="55" y="73" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Relevance: 0.42 — related but doesn't answer</text>

      <!-- Rank 3 -->
      <rect x="0" y="90" width="280" height="35" rx="6" fill="#21262d"/>
      <rect x="0" y="90" width="40" height="35" rx="6" fill="#8b949e"/>
      <rect x="28" y="90" width="12" height="35" fill="#8b949e"/>
      <text x="20" y="112" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">#3</text>
      <text x="55" y="105" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Capital of France is Paris</text>
      <text x="55" y="118" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Relevance: 0.31 — different topic entirely</text>

      <!-- Rank 4 -->
      <rect x="0" y="135" width="280" height="35" rx="6" fill="#21262d"/>
      <rect x="0" y="135" width="40" height="35" rx="6" fill="#8b949e"/>
      <rect x="28" y="135" width="12" height="35" fill="#8b949e"/>
      <text x="20" y="157" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">#4</text>
      <text x="55" y="150" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Maple syrup capital...</text>
      <text x="55" y="163" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Relevance: 0.18 — irrelevant "capital"</text>

      <!-- More docs indication -->
      <text x="140" y="195" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">... other documents ranked lower ...</text>
    </g>

    <!-- Success callout -->
    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="280" height="45" rx="6" fill="#0d2818" stroke="#4caf50" stroke-width="1"/>
      <text x="140" y="18" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ SOLVED</text>
      <text x="140" y="35" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Best answer is now #1! LLM gets correct context.</text>
    </g>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(100, 430)">
    <text x="300" y="0" fill="#58a6ff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">💡 Key Insight: Similarity ≠ Relevance. Cross-encoder understands "does this ANSWER the question?" not just "is this RELATED?"</text>
  </g>
</svg>
