<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="keywordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="semanticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#6a1b9a"/>
    </linearGradient>
    <linearGradient id="fusionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
    <linearGradient id="rerankGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="100%" style="stop-color:#ad1457"/>
    </linearGradient>
    <linearGradient id="llmGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <filter id="shadowStack">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Complete RAG Retrieval Stack: From Query to Answer</text>

  <!-- Left sidebar: Component descriptions -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="180" height="470" rx="10" fill="#161b22"/>
    <text x="90" y="25" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Stage Descriptions</text>

    <line x1="10" y1="35" x2="170" y2="35" stroke="#30363d" stroke-width="1"/>

    <text x="15" y="55" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold">① Query</text>
    <text x="15" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">User's natural language</text>
    <text x="15" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">question or request</text>

    <text x="15" y="110" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" font-weight="bold">② Keyword Search</text>
    <text x="15" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">BM25 exact matching</text>
    <text x="15" y="137" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Good for names, IDs</text>

    <text x="15" y="165" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" font-weight="bold">③ Semantic Search</text>
    <text x="15" y="180" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Bi-encoder embeddings</text>
    <text x="15" y="192" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Good for meaning</text>

    <text x="15" y="220" fill="#00bcd4" font-family="Inter, sans-serif" font-size="9" font-weight="bold">④ Rank Fusion</text>
    <text x="15" y="235" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">RRF or α-blending</text>
    <text x="15" y="247" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Combines both rankings</text>

    <text x="15" y="275" fill="#e91e63" font-family="Inter, sans-serif" font-size="9" font-weight="bold">⑤ Reranking</text>
    <text x="15" y="290" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Cross-encoder scoring</text>
    <text x="15" y="302" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Deep relevance check</text>

    <text x="15" y="330" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold">⑥ LLM Generation</text>
    <text x="15" y="345" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Synthesizes answer</text>
    <text x="15" y="357" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">from best context</text>

    <line x1="10" y1="375" x2="170" y2="375" stroke="#30363d" stroke-width="1"/>

    <text x="90" y="395" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Document Flow</text>
    <text x="15" y="415" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">KB: 1M+ docs</text>
    <text x="15" y="430" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">→ Hybrid: ~100 docs</text>
    <text x="15" y="445" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">→ Rerank: 20-100</text>
    <text x="15" y="460" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" font-weight="bold">→ LLM: 5-10 docs</text>
  </g>

  <!-- Main Pipeline -->
  <g transform="translate(220, 60)">

    <!-- Query box -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="220" height="50" rx="10" fill="url(#promptGrad)" filter="url(#shadowStack)"/>
      <text x="110" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">① User Query</text>
      <text x="110" y="40" fill="#fff" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">"Best restaurants in NYC?"</text>
    </g>

    <!-- Arrow down -->
    <line x1="310" y1="55" x2="310" y2="85" stroke="#8b949e" stroke-width="2"/>
    <polygon points="310,90 304,80 316,80" fill="#8b949e"/>

    <!-- Split into two paths -->
    <g transform="translate(0, 100)">
      <!-- Left path: Keyword -->
      <line x1="310" y1="0" x2="140" y2="40" stroke="#2196f3" stroke-width="2"/>
      <rect x="40" y="45" width="200" height="70" rx="10" fill="url(#keywordGrad)" filter="url(#shadowStack)"/>
      <text x="140" y="70" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">② Keyword Search</text>
      <text x="140" y="88" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">BM25 on inverted index</text>
      <text x="140" y="103" fill="#bbdefb" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">⚡ O(log n) — milliseconds</text>

      <!-- Right path: Semantic -->
      <line x1="310" y1="0" x2="480" y2="40" stroke="#9c27b0" stroke-width="2"/>
      <rect x="380" y="45" width="200" height="70" rx="10" fill="url(#semanticGrad)" filter="url(#shadowStack)"/>
      <text x="480" y="70" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">③ Semantic Search</text>
      <text x="480" y="88" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Bi-encoder + HNSW</text>
      <text x="480" y="103" fill="#e1bee7" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">⚡ O(log n) — milliseconds</text>
    </g>

    <!-- Merge arrows -->
    <line x1="140" y1="220" x2="240" y2="260" stroke="#2196f3" stroke-width="2"/>
    <line x1="480" y1="220" x2="380" y2="260" stroke="#9c27b0" stroke-width="2"/>

    <!-- Rank Fusion -->
    <g transform="translate(160, 265)">
      <rect x="0" y="0" width="300" height="60" rx="10" fill="url(#fusionGrad)" filter="url(#shadowStack)"/>
      <text x="150" y="25" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">④ Rank Fusion (Hybrid)</text>
      <text x="150" y="45" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">RRF or α-blending → ~100 candidates</text>
    </g>

    <!-- Document count annotation -->
    <g transform="translate(480, 285)">
      <rect x="0" y="0" width="140" height="30" rx="5" fill="#21262d"/>
      <text x="70" y="20" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">~100 docs (overfetch)</text>
    </g>

    <!-- Arrow to reranker -->
    <line x1="310" y1="330" x2="310" y2="355" stroke="#8b949e" stroke-width="2"/>
    <polygon points="310,360 304,350 316,350" fill="#8b949e"/>

    <!-- Reranker (highlighted as the key stage) -->
    <g transform="translate(110, 365)">
      <rect x="0" y="0" width="400" height="80" rx="12" fill="#161b22" stroke="#e91e63" stroke-width="3" filter="url(#shadowStack)"/>
      <rect x="0" y="0" width="400" height="35" rx="12" fill="url(#rerankGrad2)"/>
      <rect x="0" y="23" width="400" height="12" fill="url(#rerankGrad2)"/>
      <text x="200" y="25" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⑤ RERANKER (Cross-Encoder)</text>
      <text x="200" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Re-scores each [query + doc] pair with deep attention</text>
      <text x="200" y="70" fill="#e91e63" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">🐢 Slower — but ONLY 20-100 docs, not millions!</text>
    </g>

    <!-- "YOU ARE HERE" callout -->
    <g transform="translate(530, 385)">
      <rect x="0" y="0" width="100" height="35" rx="5" fill="#e91e63"/>
      <text x="50" y="15" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">🎯 YOU ARE</text>
      <text x="50" y="28" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">HERE</text>
    </g>

    <!-- Arrow to final selection -->
    <line x1="310" y1="450" x2="310" y2="475" stroke="#8b949e" stroke-width="2"/>
    <polygon points="310,480 304,470 316,470" fill="#8b949e"/>

    <!-- LLM -->
    <g transform="translate(160, 485)">
      <rect x="0" y="0" width="300" height="50" rx="10" fill="url(#llmGrad2)" filter="url(#shadowStack)"/>
      <text x="150" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⑥ LLM Generation</text>
      <text x="150" y="40" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Top 5-10 docs → synthesized answer</text>
    </g>

    <!-- Final doc count -->
    <g transform="translate(480, 495)">
      <rect x="0" y="0" width="140" height="30" rx="5" fill="#0d2818" stroke="#4caf50" stroke-width="1"/>
      <text x="70" y="20" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">5-10 best docs ✓</text>
    </g>
  </g>

  <!-- Right sidebar: Latency breakdown -->
  <g transform="translate(700, 60)">
    <rect x="0" y="0" width="180" height="200" rx="10" fill="#161b22"/>
    <text x="90" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⏱️ Latency Budget</text>

    <line x1="10" y1="35" x2="170" y2="35" stroke="#30363d" stroke-width="1"/>

    <text x="15" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Keyword: ~10ms</text>
    <rect x="15" y="60" width="30" height="6" rx="2" fill="#2196f3"/>

    <text x="15" y="85" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Semantic: ~20ms</text>
    <rect x="15" y="90" width="40" height="6" rx="2" fill="#9c27b0"/>

    <text x="15" y="115" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Fusion: ~5ms</text>
    <rect x="15" y="120" width="20" height="6" rx="2" fill="#00bcd4"/>

    <text x="15" y="145" fill="#e91e63" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Reranking: 100-500ms</text>
    <rect x="15" y="150" width="150" height="6" rx="2" fill="#e91e63"/>

    <line x1="10" y1="170" x2="170" y2="170" stroke="#30363d" stroke-width="1"/>

    <text x="15" y="190" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Total: ~150-600ms</text>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(700, 280)">
    <rect x="0" y="0" width="180" height="180" rx="10" fill="#21262d"/>
    <text x="90" y="22" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Why It Works</text>

    <line x1="10" y1="32" x2="170" y2="32" stroke="#30363d" stroke-width="1"/>

    <text x="15" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">① Keyword catches</text>
    <text x="20" y="68" fill="#2196f3" font-family="Inter, sans-serif" font-size="8">exact matches</text>

    <text x="15" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">② Semantic catches</text>
    <text x="20" y="103" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8">meaning matches</text>

    <text x="15" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">③ Fusion combines</text>
    <text x="20" y="138" fill="#00bcd4" font-family="Inter, sans-serif" font-size="8">both rankings</text>

    <text x="15" y="160" fill="#e91e63" font-family="Inter, sans-serif" font-size="8" font-weight="bold">④ Reranking ensures</text>
    <text x="20" y="173" fill="#e91e63" font-family="Inter, sans-serif" font-size="8" font-weight="bold">the best win!</text>
  </g>
</svg>
