<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="sizeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="costGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="cutoffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#c62828"/>
    </linearGradient>
    <filter id="shadowChar">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">5 Key LLM Characteristics for Selection</text>

  <!-- Model Size -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="260" height="160" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadowChar)"/>
    <rect x="0" y="0" width="260" height="32" rx="10" fill="url(#sizeGrad)"/>
    <rect x="0" y="20" width="260" height="12" fill="url(#sizeGrad)"/>
    <text x="130" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Model Size (Parameters)</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="60" height="40" rx="4" fill="#21262d"/>
      <text x="30" y="18" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Small</text>
      <text x="30" y="32" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1-10B</text>

      <rect x="75" y="0" width="80" height="40" rx="4" fill="#21262d"/>
      <text x="115" y="18" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Medium</text>
      <text x="115" y="32" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">10-100B</text>

      <rect x="170" y="0" width="70" height="40" rx="4" fill="#21262d"/>
      <text x="205" y="18" fill="#f44336" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Large</text>
      <text x="205" y="32" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">100-500B+</text>
    </g>

    <text x="130" y="110" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Larger = More capable</text>
    <text x="130" y="125" fill="#f44336" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Larger = Always more expensive</text>
    <text x="130" y="145" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Not always: smaller can beat larger!</text>
  </g>

  <!-- Cost -->
  <g transform="translate(320, 55)">
    <rect x="0" y="0" width="260" height="160" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowChar)"/>
    <rect x="0" y="0" width="260" height="32" rx="10" fill="url(#costGrad)"/>
    <rect x="0" y="20" width="260" height="12" fill="url(#costGrad)"/>
    <text x="130" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cost ($ per M tokens)</text>

    <g transform="translate(15, 50)">
      <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Input tokens:</text>
      <text x="80" y="0" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">$0.15 - $15</text>

      <text x="0" y="22" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Output tokens:</text>
      <text x="80" y="22" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">$0.60 - $75</text>

      <text x="0" y="50" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8">Output usually 4-5x more expensive!</text>
    </g>

    <text x="130" y="130" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Newer + Larger = More expensive</text>
    <text x="130" y="145" fill="#f44336" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Cost can 100x between models</text>
  </g>

  <!-- Context Window -->
  <g transform="translate(610, 55)">
    <rect x="0" y="0" width="260" height="160" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadowChar)"/>
    <rect x="0" y="0" width="260" height="32" rx="10" fill="url(#windowGrad)"/>
    <rect x="0" y="20" width="260" height="12" fill="url(#windowGrad)"/>
    <text x="130" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Context Window</text>

    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="50" height="30" rx="3" fill="#21262d"/>
      <text x="25" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">4K</text>

      <rect x="60" y="0" width="60" height="30" rx="3" fill="#21262d"/>
      <text x="90" y="20" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">32K</text>

      <rect x="130" y="0" width="50" height="30" rx="3" fill="#21262d"/>
      <text x="155" y="20" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">128K</text>

      <rect x="190" y="0" width="50" height="30" rx="3" fill="#0d2818"/>
      <text x="215" y="20" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">1M+</text>
    </g>

    <text x="130" y="110" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Max tokens = Prompt + Completion</text>
    <text x="130" y="130" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Larger window = More flexibility</text>
    <text x="130" y="145" fill="#f44336" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Still pay per token used!</text>
  </g>

  <!-- Latency/Speed -->
  <g transform="translate(100, 235)">
    <rect x="0" y="0" width="300" height="160" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadowChar)"/>
    <rect x="0" y="0" width="300" height="32" rx="10" fill="url(#speedGrad)"/>
    <rect x="0" y="20" width="300" height="12" fill="url(#speedGrad)"/>
    <text x="150" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Latency &amp; Speed</text>

    <g transform="translate(20, 50)">
      <text x="0" y="0" fill="#58a6ff" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Time to First Token (TTFT)</text>
      <text x="0" y="18" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">How fast does output start streaming?</text>
      <rect x="0" y="25" width="100" height="8" rx="2" fill="#9c27b0"/>
      <text x="110" y="32" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8">100ms - 2s</text>

      <text x="0" y="55" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Tokens per Second (TPS)</text>
      <text x="0" y="73" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">How fast does output generate?</text>
      <rect x="0" y="80" width="150" height="8" rx="2" fill="#ff9800"/>
      <text x="160" y="87" fill="#ff9800" font-family="Inter, sans-serif" font-size="8">10 - 100+ TPS</text>
    </g>

    <text x="150" y="145" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Critical for real-time interactions!</text>
  </g>

  <!-- Training Cutoff -->
  <g transform="translate(500, 235)">
    <rect x="0" y="0" width="300" height="160" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadowChar)"/>
    <rect x="0" y="0" width="300" height="32" rx="10" fill="url(#cutoffGrad)"/>
    <rect x="0" y="20" width="300" height="12" fill="url(#cutoffGrad)"/>
    <text x="150" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Training Cutoff Date</text>

    <g transform="translate(20, 50)">
      <!-- Timeline -->
      <line x1="0" y1="30" x2="260" y2="30" stroke="#8b949e" stroke-width="2"/>

      <circle cx="40" cy="30" r="6" fill="#f44336"/>
      <text x="40" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">2022</text>

      <circle cx="130" cy="30" r="6" fill="#ff9800"/>
      <text x="130" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">2024</text>

      <circle cx="220" cy="30" r="6" fill="#4caf50"/>
      <text x="220" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">2026</text>

      <text x="130" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Last date in training data</text>
    </g>

    <text x="150" y="125" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Later cutoff = knows recent events</text>
    <text x="150" y="145" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">RAG helps compensate for old cutoffs!</text>
  </g>
</svg>
