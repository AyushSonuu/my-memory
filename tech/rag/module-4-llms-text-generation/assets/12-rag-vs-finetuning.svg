<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="ftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">RAG vs Fine-Tuning — When to Use Which?</text>

  <!-- Decision Tree Start -->
  <g transform="translate(330, 70)">
    <rect width="140" height="50" rx="8" fill="#21262d" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">What's your</text>
    <text x="70" y="40" fill="#ff9800" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">primary goal?</text>
  </g>

  <!-- Left Branch: RAG -->
  <line x1="330" y1="95" x2="200" y2="150" stroke="#2196f3" stroke-width="2"/>
  <polygon points="200,150 208,145 205,155" fill="#2196f3"/>

  <g transform="translate(80, 160)">
    <rect width="240" height="140" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
    <rect width="240" height="30" rx="10" fill="url(#ragGrad)"/>
    <text x="120" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✅ Use RAG</text>

    <text x="120" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Knowledge Injection</text>
    <text x="15" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• LLM needs new/updated information</text>
    <text x="15" y="84" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Information changes frequently</text>
    <text x="15" y="98" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Need transparent sources (citations)</text>
    <text x="15" y="112" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Quick setup, instant updates</text>
    <text x="15" y="126" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Example: Company docs, news, Q&amp;A</text>
  </g>

  <!-- Right Branch: Fine-Tuning -->
  <line x1="470" y1="95" x2="600" y2="150" stroke="#9c27b0" stroke-width="2"/>
  <polygon points="600,150 592,145 595,155" fill="#9c27b0"/>

  <g transform="translate(480, 160)">
    <rect width="240" height="140" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <rect width="240" height="30" rx="10" fill="url(#ftGrad)"/>
    <text x="120" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✅ Use Fine-Tuning</text>

    <text x="120" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Domain Adaptation</text>
    <text x="15" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• LLM needs specific tone/style/format</text>
    <text x="15" y="84" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Specialized task (router, classifier)</text>
    <text x="15" y="98" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Want small, fast model for one job</text>
    <text x="15" y="112" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Domain patterns are stable</text>
    <text x="15" y="126" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Example: Medical diagnosis, legal briefs</text>
  </g>

  <!-- Middle: Both! -->
  <line x1="400" y1="120" x2="400" y2="160" stroke="#4caf50" stroke-width="2"/>
  <polygon points="400,160 395,150 405,150" fill="#4caf50"/>

  <g transform="translate(280, 170)">
    <rect width="240" height="110" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect width="240" height="30" rx="10" fill="#4caf50"/>
    <text x="120" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔥 Use BOTH!</text>

    <text x="15" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Fine-tune LLM to be better at RAG:</text>
    <text x="15" y="67" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Fine-tune generator to incorporate</text>
    <text x="15" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">  retrieved docs more effectively</text>
    <text x="15" y="93" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Use RAG for fresh knowledge injection</text>
    <text x="120" y="108" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Best of both worlds!</text>
  </g>

  <!-- Comparison Table -->
  <g transform="translate(50, 330)">
    <text x="350" y="0" fill="#e6edf3" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Quick Comparison</text>

    <!-- Table Header -->
    <rect x="0" y="15" width="200" height="30" fill="#21262d"/>
    <rect x="200" y="15" width="250" height="30" fill="#1e3a5f"/>
    <rect x="450" y="15" width="250" height="30" fill="#3d1e5f"/>

    <text x="100" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Factor</text>
    <text x="325" y="35" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RAG</text>
    <text x="575" y="35" fill="#9c27b0" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Fine-Tuning</text>

    <!-- Row 1: Best for -->
    <rect x="0" y="45" width="200" height="25" fill="#161b22"/>
    <rect x="200" y="45" width="250" height="25" fill="#161b22"/>
    <rect x="450" y="45" width="250" height="25" fill="#161b22"/>
    <text x="10" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">🎯 Best for</text>
    <text x="210" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Knowledge injection</text>
    <text x="460" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Domain adaptation</text>

    <!-- Row 2: Setup time -->
    <rect x="0" y="70" width="200" height="25" fill="#0d1117"/>
    <rect x="200" y="70" width="250" height="25" fill="#0d1117"/>
    <rect x="450" y="70" width="250" height="25" fill="#0d1117"/>
    <text x="10" y="87" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">⏱️ Setup time</text>
    <text x="210" y="87" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">Minutes</text>
    <text x="460" y="87" fill="#f44336" font-family="Inter, sans-serif" font-size="9">Hours to days</text>

    <!-- Row 3: Updates -->
    <rect x="0" y="95" width="200" height="25" fill="#161b22"/>
    <rect x="200" y="95" width="250" height="25" fill="#161b22"/>
    <rect x="450" y="95" width="250" height="25" fill="#161b22"/>
    <text x="10" y="112" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">🔄 Updates</text>
    <text x="210" y="112" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">Instant (update vector DB)</text>
    <text x="460" y="112" fill="#f44336" font-family="Inter, sans-serif" font-size="9">Requires retraining</text>

    <!-- Row 4: New info -->
    <rect x="0" y="120" width="200" height="25" fill="#0d1117"/>
    <rect x="200" y="120" width="250" height="25" fill="#0d1117"/>
    <rect x="450" y="120" width="250" height="25" fill="#0d1117"/>
    <text x="10" y="137" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">📚 Handles new info</text>
    <text x="210" y="137" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">✅ Excellent</text>
    <text x="460" y="137" fill="#f44336" font-family="Inter, sans-serif" font-size="9">❌ Poor (needs retrain)</text>

    <!-- Row 5: Improves style -->
    <rect x="0" y="145" width="200" height="25" fill="#161b22"/>
    <rect x="200" y="145" width="250" height="25" fill="#161b22"/>
    <rect x="450" y="145" width="250" height="25" fill="#161b22"/>
    <text x="10" y="162" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">🗣️ Improves style/tone</text>
    <text x="210" y="162" fill="#f44336" font-family="Inter, sans-serif" font-size="9">❌ Limited</text>
    <text x="460" y="162" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">✅ Excellent</text>
  </g>

  <!-- Footer -->
  <text x="400" y="535" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">💡 The consensus: RAG = rent knowledge (flexible), Fine-tuning = buy expertise (powerful but rigid)</text>
</svg>
