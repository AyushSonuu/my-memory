<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420">
  <defs>
    <linearGradient id="hallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#c62828"/>
    </linearGradient>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <filter id="shadowHall">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="425" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Why LLMs Hallucinate</text>

  <!-- Core problem -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="790" height="100" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadowHall)"/>
    <text x="395" y="30" fill="#f44336" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">The Core Problem</text>

    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="350" height="35" rx="4" fill="#2a1a1a"/>
      <text x="175" y="15" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">LLMs produce PROBABLE text</text>
      <text x="175" y="28" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Probable ≠ True | LLMs can't tell the difference</text>
    </g>

    <g transform="translate(410, 50)">
      <rect x="0" y="0" width="350" height="35" rx="4" fill="#2a1a1a"/>
      <text x="175" y="15" fill="#f44336" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Hallucinations sound PLAUSIBLE</text>
      <text x="175" y="28" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Harder to detect than obvious nonsense</text>
    </g>
  </g>

  <!-- Types of hallucinations -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="380" height="220" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadowHall)"/>
    <text x="190" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Types of Hallucinations</text>

    <!-- Minor -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="340" height="45" rx="6" fill="#1a1a10"/>
      <text x="15" y="18" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Minor: Wrong details</text>
      <text x="15" y="35" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">"Senior discount is 5%" (actually 10%)</text>
    </g>

    <!-- Major -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="340" height="45" rx="6" fill="#2a1a1a"/>
      <text x="15" y="18" fill="#f44336" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Major: Invented facts</text>
      <text x="15" y="35" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">"You'll love our student discount!" (doesn't exist)</text>
    </g>

    <!-- Denial -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="340" height="45" rx="6" fill="#1a1a2a"/>
      <text x="15" y="18" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Denial: Missing real facts</text>
      <text x="15" y="35" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">"There is no senior discount" (actually exists)</text>
    </g>
  </g>

  <!-- Why it matters -->
  <g transform="translate(440, 175)">
    <rect x="0" y="0" width="380" height="220" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadowHall)"/>
    <text x="190" y="25" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Why Hallucinations Matter</text>

    <g transform="translate(20, 45)">
      <circle cx="12" cy="8" r="8" fill="#f44336"/>
      <text x="12" y="12" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1</text>
      <text x="30" y="12" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Inaccurate information</text>
      <text x="30" y="28" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Users get wrong answers → bad outcomes</text>
    </g>

    <g transform="translate(20, 90)">
      <circle cx="12" cy="8" r="8" fill="#ff9800"/>
      <text x="12" y="12" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2</text>
      <text x="30" y="12" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Hard to detect</text>
      <text x="30" y="28" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Sounds plausible, not obviously wrong</text>
    </g>

    <g transform="translate(20, 135)">
      <circle cx="12" cy="8" r="8" fill="#9c27b0"/>
      <text x="12" y="12" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">3</text>
      <text x="30" y="12" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Erodes trust over time</text>
      <text x="30" y="28" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Even occasional errors → users stop trusting</text>
    </g>

    <rect x="20" y="170" width="340" height="35" rx="4" fill="#0d2818"/>
    <text x="190" y="192" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">RAG helps but doesn't eliminate hallucinations!</text>
  </g>
</svg>
