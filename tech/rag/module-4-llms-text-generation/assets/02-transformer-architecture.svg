<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="attnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#6a1b9a"/>
    </linearGradient>
    <linearGradient id="ffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <filter id="shadowTrans">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Transformer Architecture: A Token's Journey Through an LLM</text>

  <!-- Input: Tokenization -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadowTrans)"/>
    <rect x="0" y="0" width="180" height="30" rx="10" fill="url(#tokenGrad)"/>
    <rect x="0" y="18" width="180" height="12" fill="url(#tokenGrad)"/>
    <text x="90" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">① Tokenization</text>

    <text x="90" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"the brown dog sat"</text>
    <text x="90" y="65" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">→ [the] [brown] [dog] [sat]</text>
  </g>

  <!-- Arrow -->
  <line x1="210" y1="95" x2="240" y2="95" stroke="#8b949e" stroke-width="2"/>
  <polygon points="245,95 235,89 235,101" fill="#8b949e"/>

  <!-- Embedding + Position -->
  <g transform="translate(250, 55)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadowTrans)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#tokenGrad)"/>
    <rect x="0" y="18" width="200" height="12" fill="url(#tokenGrad)"/>
    <text x="100" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">② Embedding + Position</text>

    <text x="100" y="48" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Each token gets:</text>
    <text x="100" y="60" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"First guess" vector + Position vector</text>
    <text x="100" y="72" fill="#ff9800" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">(Static — same token = same guess)</text>
  </g>

  <!-- Arrow down to main processing -->
  <line x1="350" y1="140" x2="350" y2="170" stroke="#8b949e" stroke-width="2"/>
  <polygon points="350,175 344,165 356,165" fill="#8b949e"/>

  <!-- Main Processing Loop Box -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="700" height="280" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="350" y="20" fill="#58a6ff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">🔄 REPEATED 8-64 TIMES (layers of refinement)</text>

    <!-- Attention Mechanism -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="300" height="200" rx="10" fill="#1a1625" stroke="#9c27b0" stroke-width="2" filter="url(#shadowTrans)"/>
      <rect x="0" y="0" width="300" height="35" rx="10" fill="url(#attnGrad)"/>
      <rect x="0" y="23" width="300" height="12" fill="url(#attnGrad)"/>
      <text x="150" y="25" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">③ Attention Mechanism</text>

      <!-- Attention explanation -->
      <text x="150" y="55" fill="#e1bee7" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"Which tokens should impact MY meaning?"</text>

      <!-- Dog attention example -->
      <g transform="translate(20, 70)">
        <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Example: "dog" pays attention to:</text>

        <rect x="0" y="10" width="80" height="20" rx="3" fill="#4caf50"/>
        <text x="40" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"brown" 70%</text>

        <rect x="90" y="10" width="60" height="20" rx="3" fill="#ff9800"/>
        <text x="120" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"sat" 20%</text>

        <rect x="160" y="10" width="100" height="20" rx="3" fill="#21262d"/>
        <text x="210" y="24" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">others 10%</text>
      </g>

      <!-- Multiple heads -->
      <g transform="translate(20, 115)">
        <text x="0" y="0" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Multiple Attention Heads:</text>
        <text x="0" y="15" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">• Head 1: Object-description relations</text>
        <text x="0" y="28" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">• Head 2: Spatial relationships</text>
        <text x="0" y="41" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">• Head 3-100+: Abstract patterns</text>
        <text x="0" y="58" fill="#ff9800" font-family="Inter, sans-serif" font-size="8">Small: 8-16 heads | Large: 100+ heads</text>
      </g>
    </g>

    <!-- Arrow to Feed Forward -->
    <line x1="340" y1="140" x2="370" y2="140" stroke="#8b949e" stroke-width="2"/>
    <polygon points="375,140 365,134 365,146" fill="#8b949e"/>

    <!-- Feed Forward -->
    <g transform="translate(380, 40)">
      <rect x="0" y="0" width="280" height="200" rx="10" fill="#1a1a10" stroke="#ff9800" stroke-width="2" filter="url(#shadowTrans)"/>
      <rect x="0" y="0" width="280" height="35" rx="10" fill="url(#ffGrad)"/>
      <rect x="0" y="23" width="280" height="12" fill="url(#ffGrad)"/>
      <text x="140" y="25" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">④ Feed Forward Phase</text>

      <text x="140" y="55" fill="#ffcc80" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">🧠 THE BIGGEST PART (most parameters)</text>

      <g transform="translate(20, 70)">
        <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">"dog" vector evolution:</text>

        <rect x="0" y="12" width="240" height="25" rx="4" fill="#21262d"/>
        <text x="10" y="28" fill="#2196f3" font-family="Inter, sans-serif" font-size="8">1st guess: "dog" is an animal</text>

        <rect x="0" y="42" width="240" height="25" rx="4" fill="#21262d"/>
        <text x="10" y="58" fill="#4caf50" font-family="Inter, sans-serif" font-size="8">2nd guess: "dog" is a brown animal that sat</text>

        <rect x="0" y="72" width="240" height="25" rx="4" fill="#21262d"/>
        <text x="10" y="88" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8">Nth guess: Full contextual understanding</text>
      </g>

      <text x="140" y="180" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">World knowledge lives here!</text>
    </g>
  </g>

  <!-- Arrow down to generation -->
  <line x1="400" y1="465" x2="400" y2="490" stroke="#8b949e" stroke-width="2"/>
  <polygon points="400,495 394,485 406,485" fill="#8b949e"/>

  <!-- Token Generation -->
  <g transform="translate(200, 500)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowTrans)"/>
    <rect x="0" y="0" width="400" height="30" rx="10" fill="url(#outputGrad)"/>
    <rect x="0" y="18" width="400" height="12" fill="url(#outputGrad)"/>
    <text x="200" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⑤ Token Generation</text>

    <text x="200" y="48" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"Based on training data, what tokens are likely next?"</text>
    <text x="200" y="65" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">and: 32% | in: 25% | on: 18% | ... → Pick one (weighted random)</text>
  </g>

  <!-- Right sidebar: Key insights -->
  <g transform="translate(760, 180)">
    <rect x="0" y="0" width="130" height="280" rx="8" fill="#21262d"/>
    <text x="65" y="20" fill="#58a6ff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Key Insights</text>

    <line x1="10" y1="30" x2="120" y2="30" stroke="#30363d" stroke-width="1"/>

    <text x="10" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">✓ Each token</text>
    <text x="15" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">sees ALL others</text>

    <text x="10" y="85" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">✓ Multiple heads</text>
    <text x="15" y="97" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">= multiple views</text>

    <text x="10" y="120" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">✓ 8-64 layers</text>
    <text x="15" y="132" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">= iterative refine</text>

    <text x="10" y="155" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">✓ Feed-forward</text>
    <text x="15" y="167" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">= world knowledge</text>

    <line x1="10" y1="180" x2="120" y2="180" stroke="#30363d" stroke-width="1"/>

    <text x="10" y="200" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" font-weight="bold">Cost grows with</text>
    <text x="10" y="212" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" font-weight="bold">prompt length!</text>
    <text x="10" y="230" fill="#8b949e" font-family="Inter, sans-serif" font-size="7">(each token looks</text>
    <text x="10" y="242" fill="#8b949e" font-family="Inter, sans-serif" font-size="7">at every other)</text>
  </g>
</svg>
