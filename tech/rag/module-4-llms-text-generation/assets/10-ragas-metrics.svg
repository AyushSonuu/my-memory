<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="relGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="faithGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <filter id="shadowEval">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">RAGAS Metrics: Evaluating LLM Performance</text>
  <text x="450" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM-as-Judge for subjective quality assessment</text>

  <!-- Response Relevancy -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="410" height="380" rx="12" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadowEval)"/>
    <rect x="0" y="0" width="410" height="40" rx="12" fill="url(#relGrad)"/>
    <rect x="0" y="28" width="410" height="12" fill="url(#relGrad)"/>
    <text x="205" y="28" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Response Relevancy</text>

    <g transform="translate(20, 55)">
      <text x="0" y="0" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Question: Is the response relevant to the prompt?</text>
      <text x="0" y="18" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">(regardless of factual accuracy)</text>

      <!-- Flow diagram -->
      <rect x="0" y="35" width="370" height="220" rx="6" fill="#0d1117"/>

      <!-- Step 1 -->
      <rect x="15" y="50" width="140" height="40" rx="4" fill="#0d2030"/>
      <text x="85" y="65" fill="#2196f3" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">RAG Response</text>
      <text x="85" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">"Ottawa is the capital..."</text>

      <!-- Arrow -->
      <path d="M 160 70 L 185 70" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)"/>

      <!-- Step 2 -->
      <rect x="195" y="50" width="160" height="40" rx="4" fill="#21262d"/>
      <text x="275" y="65" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Evaluator LLM</text>
      <text x="275" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Generates sample prompts</text>

      <!-- Step 3 -->
      <rect x="15" y="105" width="340" height="55" rx="4" fill="#1a1a2a"/>
      <text x="185" y="120" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Sample prompts that could lead to this response:</text>
      <text x="185" y="138" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">"What is the capital of Canada?"</text>
      <text x="185" y="152" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">"Tell me about Ottawa"</text>

      <!-- Step 4 -->
      <rect x="15" y="170" width="340" height="35" rx="4" fill="#0d2818"/>
      <text x="185" y="185" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Embed + Cosine Similarity</text>
      <text x="185" y="198" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Original prompt vs Sample prompts → Average score</text>

      <!-- Result -->
      <rect x="15" y="215" width="340" height="28" rx="4" fill="#21262d"/>
      <text x="185" y="233" fill="#2196f3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Can we work backwards from response to original prompt?</text>
    </g>

    <rect x="20" y="320" width="370" height="45" rx="4" fill="#0d2030"/>
    <text x="205" y="340" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Doesn't check factual accuracy!</text>
    <text x="205" y="355" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Just measures if response addresses the question</text>
  </g>

  <!-- Faithfulness -->
  <g transform="translate(460, 70)">
    <rect x="0" y="0" width="410" height="380" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowEval)"/>
    <rect x="0" y="0" width="410" height="40" rx="12" fill="url(#faithGrad)"/>
    <rect x="0" y="28" width="410" height="12" fill="url(#faithGrad)"/>
    <text x="205" y="28" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Faithfulness</text>

    <g transform="translate(20, 55)">
      <text x="0" y="0" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Question: Is response grounded in retrieved docs?</text>
      <text x="0" y="18" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">(are factual claims supported?)</text>

      <!-- Flow diagram -->
      <rect x="0" y="35" width="370" height="220" rx="6" fill="#0d1117"/>

      <!-- Step 1 -->
      <rect x="15" y="50" width="340" height="40" rx="4" fill="#0d2818"/>
      <text x="185" y="65" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Step 1: Extract factual claims</text>
      <text x="185" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM identifies all claims in response</text>

      <!-- Step 2 -->
      <rect x="15" y="100" width="340" height="55" rx="4" fill="#1a1a10"/>
      <text x="185" y="115" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Step 2: Check each claim against docs</text>
      <text x="185" y="133" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Claim: "Ottawa is the capital" ← DOC 1 ✓</text>
      <text x="185" y="147" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Claim: "Founded in 1857" ← DOC 2 ✓</text>

      <!-- Step 3 -->
      <rect x="15" y="165" width="340" height="45" rx="4" fill="#21262d"/>
      <text x="185" y="182" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Step 3: Calculate percentage</text>
      <text x="185" y="200" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Supported claims / Total claims = Faithfulness score</text>

      <!-- Result -->
      <rect x="15" y="218" width="340" height="28" rx="4" fill="#0d2818"/>
      <text x="185" y="236" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">100% = All claims grounded in retrieved docs</text>
    </g>

    <rect x="20" y="320" width="370" height="45" rx="4" fill="#0d2818"/>
    <text x="205" y="340" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Measures hallucination resistance!</text>
    <text x="205" y="355" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Low faithfulness = LLM making stuff up</text>
  </g>
</svg>
