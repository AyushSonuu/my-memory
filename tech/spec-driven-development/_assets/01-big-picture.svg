<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="youGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <filter id="shadowSdd">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Spec-Driven Development — The Big Picture</text>

  <!-- YOU Section -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="220" height="200" rx="16" fill="#161b22" stroke="#ff9800" stroke-width="3" filter="url(#shadowSdd)"/>
    <rect x="0" y="0" width="220" height="45" rx="16" fill="url(#youGrad)"/>
    <text x="110" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">👤 YOU (The Thinker)</text>

    <!-- Think bubble -->
    <rect x="20" y="60" width="180" height="55" rx="8" fill="#21262d"/>
    <text x="110" y="82" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DECIDE</text>
    <text x="110" y="100" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Product • Features • Architecture</text>

    <!-- Spec bubble -->
    <rect x="20" y="125" width="180" height="55" rx="8" fill="#238636" opacity="0.3"/>
    <text x="110" y="147" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WRITE SPEC</text>
    <text x="110" y="165" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Markdown → Constitution</text>
  </g>

  <!-- Arrow 1: You to Spec -->
  <g transform="translate(280, 180)">
    <path d="M 0 0 L 80 0" stroke="#4caf50" stroke-width="4" fill="none"/>
    <polygon points="80,0 70,-8 70,8" fill="#4caf50"/>
    <text x="40" y="-12" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">feed</text>
  </g>

  <!-- SPEC (Center) -->
  <g transform="translate(370, 120)">
    <rect x="0" y="0" width="120" height="120" rx="12" fill="url(#specGrad)" filter="url(#shadowSdd)"/>
    <text x="60" y="45" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">📋</text>
    <text x="60" y="70" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SPEC</text>
    <text x="60" y="90" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">What + Why</text>
    <text x="60" y="105" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">+ Constraints</text>
  </g>

  <!-- Arrow 2: Spec to Agent -->
  <g transform="translate(500, 180)">
    <path d="M 0 0 L 80 0" stroke="#2196f3" stroke-width="4" fill="none"/>
    <polygon points="80,0 70,-8 70,8" fill="#2196f3"/>
    <text x="40" y="-12" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">guides</text>
  </g>

  <!-- AGENT Section -->
  <g transform="translate(590, 80)">
    <rect x="0" y="0" width="180" height="200" rx="16" fill="#161b22" stroke="#2196f3" stroke-width="3" filter="url(#shadowSdd)"/>
    <rect x="0" y="0" width="180" height="45" rx="16" fill="url(#agentGrad)"/>
    <text x="90" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🤖 AGENT</text>

    <!-- Read -->
    <rect x="15" y="60" width="150" height="45" rx="8" fill="#21262d"/>
    <text x="90" y="82" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">READ SPEC</text>
    <text x="90" y="97" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Understands intent</text>

    <!-- Generate -->
    <rect x="15" y="115" width="150" height="65" rx="8" fill="#1f6feb" opacity="0.3"/>
    <text x="90" y="140" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GENERATE CODE</text>
    <text x="90" y="158" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Hundreds of lines</text>
    <text x="90" y="172" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">in minutes ⚡</text>
  </g>

  <!-- Bottom insight boxes -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="210" height="70" rx="8" fill="#21262d"/>
    <text x="105" y="22" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📢 DOWNSTREAM AMPLIFICATION</text>
    <text x="105" y="42" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">1 spec line →</text>
    <text x="105" y="57" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">100s of code lines</text>
  </g>

  <g transform="translate(280, 310)">
    <rect x="0" y="0" width="210" height="70" rx="8" fill="#21262d"/>
    <text x="105" y="22" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🧊 CONTEXT PRESERVATION</text>
    <text x="105" y="42" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Agents are stateless</text>
    <text x="105" y="57" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Specs survive sessions</text>
  </g>

  <g transform="translate(510, 310)">
    <rect x="0" y="0" width="210" height="70" rx="8" fill="#21262d"/>
    <text x="105" y="22" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🎯 INTENT FIDELITY</text>
    <text x="105" y="42" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">You define the problem</text>
    <text x="105" y="57" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Agent follows YOUR vision</text>
  </g>
</svg>