<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Glow for arrows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gradients: Blue (scope) -->
    <linearGradient id="grad-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Green (receive/send) -->
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <!-- Orange (flow) -->
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <!-- Purple (FastAPI) -->
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <!-- Dark card bg -->
    <linearGradient id="grad-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- WSGI muted -->
    <linearGradient id="grad-wsgi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <!-- ASGI bottom -->
    <linearGradient id="grad-asgi-strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
    <marker id="arrow-green-in" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-green-out" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M8,0 L8,6 L0,3 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-white" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="860" height="500" fill="#0d1117"/>

  <!-- ===== TITLE BAR ===== -->
  <rect x="0" y="0" width="860" height="44" fill="#101820"/>
  <text x="430" y="16" text-anchor="middle" font-size="10" fill="#64748b" font-weight="600" letter-spacing="3">FASTAPI L05</text>
  <text x="430" y="33" text-anchor="middle" font-size="15" fill="#f8fafc" font-weight="700" letter-spacing="0.5">ASGI Protocol — The Callable Contract</text>

  <!-- ===== SECTION LABELS ===== -->
  <text x="138" y="58" text-anchor="middle" font-size="9" fill="#64748b" font-weight="600" letter-spacing="2">THE CONTRACT</text>
  <text x="390" y="58" text-anchor="middle" font-size="9" fill="#64748b" font-weight="600" letter-spacing="2">3 PARAMETERS</text>
  <text x="655" y="58" text-anchor="middle" font-size="9" fill="#64748b" font-weight="600" letter-spacing="2">REQUEST FLOW</text>

  <!-- =============================== -->
  <!-- LEFT PANEL — ASGI Contract      -->
  <!-- =============================== -->
  <rect x="14" y="64" width="250" height="270" rx="10" fill="url(#grad-card)" filter="url(#shadow)" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="14" y="64" width="250" height="36" rx="10" fill="url(#grad-blue)"/>
  <rect x="14" y="82" width="250" height="18" fill="url(#grad-blue)"/>
  <text x="139" y="87" text-anchor="middle" font-size="12" fill="#bfdbfe" font-weight="700">ASGI Application Interface</text>

  <!-- Contract code block -->
  <rect x="26" y="110" width="226" height="50" rx="6" fill="#0a0e17" stroke="#1e40af" stroke-width="1"/>
  <text x="36" y="128" font-size="10" fill="#7dd3fc" font-family="'Courier New', monospace">async def app(</text>
  <text x="52" y="142" font-size="10" fill="#93c5fd" font-family="'Courier New', monospace">scope, receive, send</text>
  <text x="36" y="156" font-size="10" fill="#7dd3fc" font-family="'Courier New', monospace">):  ...</text>

  <text x="139" y="176" text-anchor="middle" font-size="9.5" fill="#94a3b8">This is the ENTIRE ASGI contract.</text>
  <text x="139" y="190" text-anchor="middle" font-size="9.5" fill="#94a3b8">Just ONE async callable.</text>

  <!-- Divider -->
  <line x1="26" y1="200" x2="252" y2="200" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- What ASGI Says -->
  <text x="139" y="217" text-anchor="middle" font-size="10" fill="#60a5fa" font-weight="700">ASGI says two things:</text>

  <!-- App side -->
  <rect x="26" y="224" width="104" height="40" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="78" y="236" text-anchor="middle" font-size="8.5" fill="#93c5fd" font-weight="600">APP must expose</text>
  <text x="78" y="248" text-anchor="middle" font-size="8" fill="#7dd3fc">async callable</text>
  <text x="78" y="259" text-anchor="middle" font-size="8" fill="#64748b">app(scope,receive,send)</text>

  <!-- Server side -->
  <rect x="138" y="224" width="104" height="40" rx="5" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
  <text x="190" y="236" text-anchor="middle" font-size="8.5" fill="#fdba74" font-weight="600">SERVER must call</text>
  <text x="190" y="248" text-anchor="middle" font-size="8" fill="#fb923c">await app(...)</text>
  <text x="190" y="259" text-anchor="middle" font-size="8" fill="#64748b">Uvicorn does this</text>

  <!-- Stack at bottom of left panel -->
  <text x="139" y="286" text-anchor="middle" font-size="9" fill="#94a3b8">Architecture Stack:</text>
  <!-- Stack pills -->
  <rect x="52" y="292" width="174" height="18" rx="4" fill="#6b21a8" opacity="0.7"/>
  <text x="139" y="305" text-anchor="middle" font-size="9" fill="#e9d5ff" font-weight="600">FastAPI → Starlette → ASGI App → Uvicorn</text>

  <!-- Run command -->
  <rect x="26" y="316" width="226" height="16" rx="4" fill="#0a0e17" stroke="#1e3a8a" stroke-width="1"/>
  <text x="139" y="328" text-anchor="middle" font-size="9" fill="#4ade80" font-family="'Courier New', monospace">$ uvicorn main:app</text>


  <!-- =============================== -->
  <!-- CENTER PANEL — 3 Parameters     -->
  <!-- =============================== -->

  <!-- SCOPE card -->
  <rect x="280" y="64" width="222" height="130" rx="10" fill="url(#grad-card)" filter="url(#shadow)" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="280" y="64" width="222" height="30" rx="10" fill="url(#grad-blue)"/>
  <rect x="280" y="82" width="222" height="12" fill="url(#grad-blue)"/>
  <text x="291" y="83" font-size="11" fill="#bfdbfe" font-weight="700">scope</text>
  <text x="493" y="83" text-anchor="end" font-size="9" fill="#93c5fd">Request Metadata</text>

  <!-- scope JSON -->
  <rect x="292" y="100" width="198" height="86" rx="6" fill="#050a14" stroke="#1e3a8a" stroke-width="1"/>
  <text x="302" y="115" font-size="9" fill="#64748b" font-family="'Courier New', monospace">{</text>
  <text x="312" y="128" font-size="9" fill="#f472b6" font-family="'Courier New', monospace">"type":</text><text x="352" y="128" font-size="9" fill="#86efac" font-family="'Courier New', monospace"> "http",</text>
  <text x="312" y="141" font-size="9" fill="#f472b6" font-family="'Courier New', monospace">"method":</text><text x="362" y="141" font-size="9" fill="#86efac" font-family="'Courier New', monospace"> "GET",</text>
  <text x="312" y="154" font-size="9" fill="#f472b6" font-family="'Courier New', monospace">"path":</text><text x="352" y="154" font-size="9" fill="#86efac" font-family="'Courier New', monospace"> "/users/123",</text>
  <text x="312" y="167" font-size="9" fill="#f472b6" font-family="'Courier New', monospace">"headers":</text><text x="369" y="167" font-size="9" fill="#7dd3fc" font-family="'Courier New', monospace"> [...]</text>
  <text x="302" y="180" font-size="9" fill="#64748b" font-family="'Courier New', monospace">}</text>

  <!-- RECEIVE card -->
  <rect x="280" y="204" width="222" height="88" rx="10" fill="url(#grad-card)" filter="url(#shadow)" stroke="#166534" stroke-width="1.5"/>
  <rect x="280" y="204" width="222" height="30" rx="10" fill="url(#grad-green)"/>
  <rect x="280" y="222" width="222" height="12" fill="url(#grad-green)"/>
  <text x="291" y="221" font-size="11" fill="#bbf7d0" font-weight="700">receive()</text>
  <text x="493" y="221" text-anchor="end" font-size="9" fill="#86efac">← incoming events</text>

  <rect x="292" y="240" width="198" height="44" rx="6" fill="#050a14" stroke="#166534" stroke-width="1"/>
  <text x="302" y="254" font-size="9" fill="#94a3b8" font-family="'Courier New', monospace">msg = await receive()</text>
  <text x="302" y="267" font-size="8.5" fill="#4ade80" font-family="'Courier New', monospace">HTTP: </text><text x="336" y="267" font-size="8.5" fill="#64748b" font-family="'Courier New', monospace">{ "type": "http.request" }</text>
  <text x="302" y="279" font-size="8.5" fill="#34d399" font-family="'Courier New', monospace">WS: </text><text x="330" y="279" font-size="8.5" fill="#64748b" font-family="'Courier New', monospace">{ "type": "websocket.receive" }</text>

  <!-- SEND card -->
  <rect x="280" y="300" width="222" height="106" rx="10" fill="url(#grad-card)" filter="url(#shadow)" stroke="#991b1b" stroke-width="1.5"/>
  <rect x="280" y="300" width="222" height="30" rx="10" fill="#991b1b"/>
  <rect x="280" y="318" width="222" height="12" fill="#991b1b"/>
  <text x="291" y="319" font-size="11" fill="#fecaca" font-weight="700">send()</text>
  <text x="493" y="319" text-anchor="end" font-size="9" fill="#fca5a5">→ outgoing events</text>

  <rect x="292" y="336" width="198" height="62" rx="6" fill="#050a14" stroke="#991b1b" stroke-width="1"/>
  <text x="302" y="351" font-size="8.5" fill="#f87171" font-family="'Courier New', monospace">await send({</text>
  <text x="312" y="363" font-size="8.5" fill="#f472b6" font-family="'Courier New', monospace">"type": </text><text x="353" y="363" font-size="8.5" fill="#86efac" font-family="'Courier New', monospace">"http.response.start",</text>
  <text x="312" y="375" font-size="8.5" fill="#f472b6" font-family="'Courier New', monospace">"status": </text><text x="358" y="375" font-size="8.5" fill="#fbbf24" font-family="'Courier New', monospace">200</text>
  <text x="302" y="387" font-size="8.5" fill="#f87171" font-family="'Courier New', monospace">})</text>
  <text x="302" y="399" font-size="8.5" fill="#64748b" font-family="'Courier New', monospace">then: "http.response.body"</text>


  <!-- =============================== -->
  <!-- RIGHT PANEL — Request Flow      -->
  <!-- =============================== -->
  <rect x="520" y="64" width="326" height="336" rx="10" fill="url(#grad-card)" filter="url(#shadow)" stroke="#9a3412" stroke-width="1.5"/>
  <rect x="520" y="64" width="326" height="30" rx="10" fill="url(#grad-orange)"/>
  <rect x="520" y="82" width="326" height="12" fill="url(#grad-orange)"/>
  <text x="683" y="83" text-anchor="middle" font-size="12" fill="#fed7aa" font-weight="700">Request Flow — Browser to FastAPI</text>

  <!-- Flow nodes -->
  <!-- 1. Browser -->
  <rect x="600" y="106" width="166" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="618" y="118" font-size="9" fill="#94a3b8">&#x1F310;</text>
  <text x="634" y="118" font-size="10" fill="#e2e8f0" font-weight="600">Browser</text>
  <text x="634" y="131" font-size="9" fill="#64748b">GET /hello HTTP/1.1</text>

  <!-- arrow 1 -->
  <line x1="683" y1="138" x2="683" y2="153" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- 2. Uvicorn parses -->
  <rect x="573" y="153" width="220" height="32" rx="6" fill="#1c0a00" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="585" y="165" font-size="10" fill="#fb923c" font-weight="700">Uvicorn</text>
  <text x="636" y="165" font-size="9" fill="#94a3b8">parses HTTP</text>
  <text x="585" y="178" font-size="9" fill="#64748b" font-family="'Courier New', monospace">scope = {"type":"http","path":"/hello"}</text>

  <!-- arrow 2 -->
  <line x1="683" y1="185" x2="683" y2="200" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- 3. Uvicorn calls app -->
  <rect x="554" y="200" width="258" height="32" rx="6" fill="#1a0a00" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="683" y="216" text-anchor="middle" font-size="10" fill="#fed7aa" font-weight="600" font-family="'Courier New', monospace">await app(scope, receive, send)</text>
  <text x="683" y="228" text-anchor="middle" font-size="9" fill="#64748b">Uvicorn hands control to ASGI app</text>

  <!-- arrow 3 -->
  <line x1="683" y1="232" x2="683" y2="247" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- 4. FastAPI.__call__ -->
  <rect x="560" y="247" width="246" height="40" rx="6" fill="#1a0a2e" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="683" y="262" text-anchor="middle" font-size="10" fill="#e9d5ff" font-weight="700">FastAPI.__call__(scope, receive, send)</text>
  <text x="683" y="276" text-anchor="middle" font-size="9" fill="#94a3b8">Starlette routing → your route handler</text>

  <!-- arrow 4 -->
  <line x1="683" y1="287" x2="683" y2="302" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- 5. Route handler -->
  <rect x="585" y="302" width="196" height="32" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="683" y="314" text-anchor="middle" font-size="9" fill="#c084fc" font-weight="600">@app.get("/hello")</text>
  <text x="683" y="326" text-anchor="middle" font-size="9" fill="#64748b">async def read_hello(): ...</text>

  <!-- arrow 5 (response back) -->
  <line x1="683" y1="334" x2="683" y2="349" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green-in)"/>

  <!-- 6. send() response -->
  <rect x="573" y="349" width="220" height="32" rx="6" fill="#001a0a" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="683" y="361" text-anchor="middle" font-size="10" fill="#86efac" font-weight="600">send(http.response.start + body)</text>
  <text x="683" y="374" text-anchor="middle" font-size="9" fill="#64748b">Uvicorn sends HTTP response → Browser</text>

  <!-- Step numbers on the side -->
  <text x="532" y="126" font-size="9" fill="#fb923c" font-weight="700">1</text>
  <text x="532" y="173" font-size="9" fill="#fb923c" font-weight="700">2</text>
  <text x="532" y="220" font-size="9" fill="#fb923c" font-weight="700">3</text>
  <text x="532" y="271" font-size="9" fill="#c084fc" font-weight="700">4</text>
  <text x="532" y="321" font-size="9" fill="#c084fc" font-weight="700">5</text>
  <text x="532" y="368" font-size="9" fill="#4ade80" font-weight="700">6</text>


  <!-- =============================== -->
  <!-- BOTTOM STRIP — WSGI vs ASGI     -->
  <!-- =============================== -->
  <rect x="14" y="410" width="832" height="78" rx="10" fill="#0a0e14" filter="url(#shadow)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="14" y="410" width="832" height="24" rx="10" fill="#141b26"/>
  <rect x="14" y="422" width="832" height="12" fill="#141b26"/>
  <text x="430" y="427" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="700" letter-spacing="1">WSGI vs ASGI</text>

  <!-- WSGI column -->
  <rect x="26" y="440" width="390" height="42" rx="6" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
  <text x="30" y="454" font-size="10" fill="#a8a29e" font-weight="700">WSGI (Old — Flask, Django)</text>
  <text x="30" y="468" font-size="9" fill="#78716c" font-family="'Courier New', monospace">def app(environ, start_response): ...</text>
  <text x="30" y="480" font-size="8.5" fill="#57534e">Sync only. No WebSockets. No streaming. No SSE.</text>

  <!-- VS divider -->
  <text x="430" y="463" text-anchor="middle" font-size="14" fill="#475569" font-weight="900">vs</text>

  <!-- ASGI column -->
  <rect x="444" y="440" width="390" height="42" rx="6" fill="#0c1a2e" stroke="#1e40af" stroke-width="1"/>
  <text x="449" y="454" font-size="10" fill="#60a5fa" font-weight="700">ASGI (New — FastAPI, Starlette)</text>
  <text x="449" y="468" font-size="9" fill="#7dd3fc" font-family="'Courier New', monospace">async def app(scope, receive, send): ...</text>
  <text x="449" y="480" font-size="8.5" fill="#38bdf8">Async I/O ✓  WebSockets ✓  Streaming ✓  SSE ✓  Long-lived conns ✓</text>

</svg>
