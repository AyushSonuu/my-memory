<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2196f3"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4caf50"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff9800"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="600" fill="#0d1117"/>

  <!-- Title -->
  <text x="430" y="32" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Environment Variables — FastAPI</text>
  <text x="430" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">How env vars flow from OS / Shell → Python Code → App Config</text>

  <!-- ROW 1 CARDS: OS Shell | Per-Invocation | Python Code -->

  <!-- CARD 1: OS / Shell -->
  <g transform="translate(30, 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="170" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="32" rx="10" fill="url(#blueGrad)"/>
    <rect x="0" y="22" width="230" height="10" fill="#1976d2"/>
    <text x="115" y="21" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OS / Shell</text>

    <rect x="10" y="42" width="100" height="16" rx="4" fill="#21262d"/>
    <text x="60" y="53" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Linux / macOS</text>

    <text x="16" y="72" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">$ export MY_NAME="Wade Wilson"</text>
    <text x="16" y="86" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">$ echo "Hello $MY_NAME"</text>

    <rect x="10" y="98" width="100" height="16" rx="4" fill="#21262d"/>
    <text x="60" y="109" fill="#00bcd4" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Windows PowerShell</text>

    <text x="16" y="128" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">$Env:MY_NAME = "Wade Wilson"</text>
    <text x="16" y="142" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">echo "Hello $Env:MY_NAME"</text>

    <text x="16" y="160" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-style="italic">Lives OUTSIDE Python, in the OS</text>
  </g>

  <!-- CARD 2: Per-Invocation Env Var -->
  <g transform="translate(310, 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="170" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="32" rx="10" fill="url(#orangeGrad)"/>
    <rect x="0" y="22" width="230" height="10" fill="#f57c00"/>
    <text x="115" y="21" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Per-Invocation Env Var</text>

    <text x="115" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Set ONLY for that one command run</text>

    <rect x="10" y="62" width="210" height="46" rx="6" fill="#21262d"/>
    <text x="16" y="78" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold">$ MY_NAME="Wade Wilson" python main.py</text>
    <text x="16" y="96" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Hello Wade Wilson from Python</text>

    <text x="115" y="128" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">After the program ends →</text>
    <rect x="10" y="134" width="210" height="22" rx="6" fill="#21262d"/>
    <text x="16" y="149" fill="#f44336" font-family="Inter, sans-serif" font-size="9">$ python main.py  → Hello World from Python</text>

    <text x="16" y="165" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-style="italic">Env var GONE after program exits</text>
  </g>

  <!-- CARD 3: Python Code (os.getenv) -->
  <g transform="translate(590, 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="238" height="170" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="1.5"/>
    <rect x="0" y="0" width="238" height="32" rx="10" fill="url(#greenGrad)"/>
    <rect x="0" y="22" width="238" height="10" fill="#388e3c"/>
    <text x="119" y="21" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Python Code (main.py)</text>

    <rect x="10" y="42" width="218" height="68" rx="6" fill="#21262d"/>
    <text x="18" y="57" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">import os</text>
    <text x="18" y="72" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold">name = os.getenv("MY_NAME", "World")</text>
    <text x="18" y="86" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">print(f"Hello {'{'}name{'}'} from Python")</text>
    <text x="18" y="101" fill="#00bcd4" font-family="Inter, sans-serif" font-size="8">  ↑ 2nd arg = default if var not set</text>

    <text x="119" y="126" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Without MY_NAME set:</text>
    <text x="119" y="142" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-style="italic">Hello World from Python</text>
    <text x="119" y="157" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-style="italic">Hello Wade Wilson from Python</text>
  </g>

  <!-- ARROWS ROW 1 -->
  <line x1="261" y1="157" x2="308" y2="157" stroke="#2196f3" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="284" y="151" fill="#2196f3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">export</text>

  <line x1="541" y1="157" x2="588" y2="157" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="564" y="151" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">inline set</text>

  <!-- SEPARATOR LINE -->
  <line x1="30" y1="268" x2="830" y2="268" stroke="#21262d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="430" y="283" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Env vars are always STRINGS — conversion &amp; validation must happen in Python code</text>

  <!-- ROW 2: PATH Variable + Python Install -->

  <!-- CARD 4: PATH env var -->
  <g transform="translate(30, 295)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="190" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="32" rx="10" fill="url(#purpleGrad)"/>
    <rect x="0" y="22" width="380" height="10" fill="#7b1fa2"/>
    <text x="190" y="21" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PATH — The Special Env Var</text>

    <text x="190" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">OS uses PATH to find executable programs when you type a command</text>

    <rect x="10" y="62" width="170" height="64" rx="6" fill="#21262d"/>
    <text x="95" y="77" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Linux / macOS PATH</text>
    <text x="16" y="91" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">/usr/local/bin</text>
    <text x="16" y="103" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">/usr/bin  :  /bin</text>
    <text x="16" y="115" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">/usr/sbin  :  /sbin</text>
    <text x="16" y="120" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8">  ← separated by colon (:)</text>

    <rect x="200" y="62" width="170" height="64" rx="6" fill="#21262d"/>
    <text x="285" y="77" fill="#00bcd4" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Windows PATH</text>
    <text x="206" y="91" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">C:\Program Files\Python312\Scripts</text>
    <text x="206" y="103" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">C:\Program Files\Python312</text>
    <text x="206" y="115" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">C:\Windows\System32</text>
    <text x="206" y="120" fill="#00bcd4" font-family="Inter, sans-serif" font-size="8">  ← separated by semicolon (;)</text>

    <text x="190" y="148" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">When you type  $ python  in terminal:</text>
    <text x="190" y="163" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">OS scans PATH directories IN ORDER → runs first match found</text>
    <text x="190" y="178" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" font-style="italic">$ python  ≡  $ /opt/custompython/bin/python  (after PATH update)</text>
  </g>

  <!-- CARD 5: Python Install + PATH Update -->
  <g transform="translate(450, 295)" filter="url(#shadow)">
    <rect x="0" y="0" width="378" height="190" rx="10" fill="#161b22" stroke="#00bcd4" stroke-width="1.5"/>
    <rect x="0" y="0" width="378" height="32" rx="10" fill="url(#cyanGrad)"/>
    <rect x="0" y="22" width="378" height="10" fill="#0097a7"/>
    <text x="189" y="21" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Installing Python → PATH Update</text>

    <text x="189" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Installer asks: "Add Python to PATH?" → say YES to call python from anywhere</text>

    <rect x="10" y="60" width="172" height="88" rx="6" fill="#21262d"/>
    <text x="96" y="75" fill="#f44336" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Before Install</text>
    <text x="16" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">/usr/local/bin:/usr/bin:/bin</text>
    <text x="16" y="104" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">$ python → command not found</text>
    <text x="16" y="120" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">C:\...\Scripts;C:\Windows\System32</text>
    <text x="16" y="134" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">$ python → 'python' not recognized</text>

    <rect x="196" y="60" width="172" height="88" rx="6" fill="#21262d"/>
    <text x="282" y="75" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">After Install (PATH updated)</text>
    <text x="202" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">...:/opt/custompython/bin  ← appended</text>
    <text x="202" y="104" fill="#4caf50" font-family="Inter, sans-serif" font-size="8">$ python → runs Python 3.x</text>
    <text x="202" y="120" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">...;C:\opt\custompython\bin  ← appended</text>
    <text x="202" y="134" fill="#4caf50" font-family="Inter, sans-serif" font-size="8">$ python → runs Python 3.x</text>

    <text x="189" y="163" fill="#00bcd4" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Why this matters → Virtual Environments!</text>
    <text x="189" y="178" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">venv puts its own python first in PATH, overriding system python</text>
  </g>

  <!-- BOTTOM ROW: Key Rules summary -->
  <g transform="translate(30, 503)" filter="url(#shadow)">
    <rect x="0" y="0" width="798" height="76" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="1.5"/>
    <rect x="0" y="0" width="798" height="28" rx="10" fill="url(#orangeGrad)"/>
    <rect x="0" y="18" width="798" height="10" fill="#f57c00"/>
    <text x="399" y="19" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Key Rules to Remember</text>

    <rect x="10" y="36" width="180" height="32" rx="5" fill="#21262d"/>
    <text x="100" y="50" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Type = Always string (str)</text>
    <text x="100" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Cast to int/bool in Python code</text>

    <rect x="202" y="36" width="180" height="32" rx="5" fill="#21262d"/>
    <text x="292" y="50" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Not in git (no commit)</text>
    <text x="292" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Ideal for secrets &amp; config</text>

    <rect x="394" y="36" width="190" height="32" rx="5" fill="#21262d"/>
    <text x="489" y="50" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">12-Factor App: Config</text>
    <text x="489" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">12factor.net/config — best practice</text>

    <rect x="596" y="36" width="192" height="32" rx="5" fill="#21262d"/>
    <text x="692" y="50" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Advanced: pydantic-settings</text>
    <text x="692" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Typed config via BaseSettings class</text>
  </g>

  <!-- Flow arrow decoration -->
  <line x1="709" y1="242" x2="709" y2="293" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="730" y="271" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="start">os.getenv()</text>
</svg>
