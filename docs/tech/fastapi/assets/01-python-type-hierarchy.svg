<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <defs>
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="headerGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="headerOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="headerPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="headerCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#0d1117"/>

  <!-- Title -->
  <text x="430" y="32" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Python Type Hints — Complete Taxonomy</text>
  <text x="430" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">FastAPI is built entirely on these — master types = master FastAPI</text>

  <!-- ── CARD 1: Simple Types ── -->
  <g transform="translate(30, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="145" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="30" rx="10" fill="url(#headerBlue)"/>
    <rect x="0" y="20" width="190" height="10" fill="url(#headerBlue)"/>
    <text x="95" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🔵 Simple Types</text>
    <text x="14" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">param: str</text>
    <text x="14" y="66" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">param: int</text>
    <text x="14" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">param: float</text>
    <text x="14" y="98" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">param: bool</text>
    <text x="14" y="114" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">param: bytes</text>
    <text x="14" y="134" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" font-style="italic">Direct — no import needed</text>
  </g>

  <!-- ── CARD 2: Generic / Collection Types ── -->
  <g transform="translate(240, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="165" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="30" rx="10" fill="url(#headerGreen)"/>
    <rect x="0" y="20" width="210" height="10" fill="url(#headerGreen)"/>
    <text x="105" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🟢 Generic / Collection</text>
    <text x="14" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">list[str]</text>
    <text x="120" y="50" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">→ list of strings</text>
    <text x="14" y="68" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">tuple[int, int, str]</text>
    <text x="120" y="68" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">→ fixed 3-item</text>
    <text x="14" y="86" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">set[bytes]</text>
    <text x="120" y="86" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">→ unique bytes</text>
    <text x="14" y="104" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">dict[str, float]</text>
    <text x="120" y="104" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">→ key→value</text>
    <text x="14" y="122" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Any</text>
    <text x="60" y="122" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">→ any type (from typing)</text>
    <text x="14" y="152" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-style="italic">Type inside [ ] = "type parameter"</text>
  </g>

  <!-- ── CARD 3: Union / Optional ── -->
  <g transform="translate(468, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="165" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#headerOrange)"/>
    <rect x="0" y="20" width="200" height="10" fill="url(#headerOrange)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🟠 Union / Optional</text>
    <!-- Union row -->
    <text x="14" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">int | str</text>
    <text x="14" y="64" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">can be int OR str</text>
    <!-- Optional row -->
    <text x="14" y="84" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">str | None</text>
    <text x="14" y="98" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">can be str OR None</text>
    <!-- Default note -->
    <rect x="10" y="108" width="180" height="28" rx="6" fill="#21262d"/>
    <text x="100" y="122" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">str | None = None</text>
    <text x="100" y="133" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">↑ default value (= not :)</text>
    <text x="14" y="155" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-style="italic">| = vertical bar (Python 3.10+)</text>
  </g>

  <!-- ── CARD 4: Classes as Types ── -->
  <g transform="translate(686, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="148" height="165" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="1.5"/>
    <rect x="0" y="0" width="148" height="30" rx="10" fill="url(#headerPurple)"/>
    <rect x="0" y="20" width="148" height="10" fill="url(#headerPurple)"/>
    <text x="74" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🟣 Class Types</text>
    <text x="14" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">class Person:</text>
    <text x="22" y="64" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">name: str</text>
    <text x="14" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">def get(p: Person)</text>
    <text x="14" y="100" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9">p = instance of</text>
    <text x="14" y="112" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9">Person (NOT class)</text>
    <text x="14" y="130" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Editor knows all</text>
    <text x="14" y="142" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">attributes → autocomplete</text>
    <text x="14" y="158" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8" font-style="italic">Pydantic extends this ↓</text>
  </g>

  <!-- ── BIG BOTTOM ROW: Pydantic + Annotated + FastAPI Uses ── -->

  <!-- PYDANTIC CARD -->
  <g transform="translate(30, 262)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="210" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="32" rx="10" fill="url(#headerGreen)"/>
    <rect x="0" y="22" width="260" height="10" fill="url(#headerGreen)"/>
    <text x="130" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🧱 Pydantic Models</text>
    <text x="14" y="55" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" font-weight="bold">class User(BaseModel):</text>
    <text x="24" y="71" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">id: int</text>
    <text x="24" y="85" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">name: str = "John Doe"</text>
    <text x="24" y="99" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">signup_ts: datetime | None = None</text>
    <text x="24" y="113" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">friends: list[int] = []</text>
    <!-- Divider -->
    <line x1="14" y1="124" x2="246" y2="124" stroke="#21262d" stroke-width="1"/>
    <text x="14" y="140" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold">What Pydantic does:</text>
    <text x="14" y="156" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✅ Validates input types at runtime</text>
    <text x="14" y="170" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✅ Auto-converts (str "123" → int 123)</text>
    <text x="14" y="184" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✅ Rich editor autocomplete</text>
    <text x="14" y="198" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-style="italic">FastAPI is all based on Pydantic ⚡</text>
  </g>

  <!-- ANNOTATED CARD -->
  <g transform="translate(308, 262)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="210" rx="10" fill="#161b22" stroke="#00bcd4" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="32" rx="10" fill="url(#headerCyan)"/>
    <rect x="0" y="22" width="230" height="10" fill="url(#headerCyan)"/>
    <text x="115" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🏷️ Annotated</text>
    <text x="14" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">from typing import Annotated</text>
    <text x="14" y="75" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10">Annotated[str, "metadata"]</text>
    <!-- Arrow box -->
    <rect x="10" y="84" width="210" height="52" rx="6" fill="#21262d"/>
    <text x="115" y="100" fill="#00bcd4" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="bold">First arg = actual type</text>
    <text x="115" y="114" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Annotated[str, ...]</text>
    <text x="115" y="128" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">↑ editor still sees str</text>
    <line x1="14" y1="146" x2="216" y2="146" stroke="#21262d" stroke-width="1"/>
    <text x="14" y="162" fill="#00bcd4" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Rest = metadata for tools</text>
    <text x="14" y="178" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">FastAPI reads this metadata to:</text>
    <text x="14" y="192" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">  → add validation rules</text>
    <text x="14" y="204" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">  → mark query/path/body params</text>
  </g>

  <!-- FASTAPI USES CARD -->
  <g transform="translate(556, 262)" filter="url(#shadow)">
    <rect x="0" y="0" width="278" height="210" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2"/>
    <rect x="0" y="0" width="278" height="32" rx="10" fill="url(#headerOrange)"/>
    <rect x="0" y="22" width="278" height="10" fill="url(#headerOrange)"/>
    <text x="139" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚡ Why FastAPI Needs Types</text>
    <!-- Two column list -->
    <text x="14" y="52" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold">You declare once, FastAPI does ALL:</text>
    <text x="14" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">🔧  Editor support + autocomplete</text>
    <text x="14" y="84" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">🔍  Type checks + error detection</text>
    <text x="14" y="98" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">📥  Reads path / query / body params</text>
    <text x="14" y="112" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">🔄  Converts string "42" → int 42</text>
    <text x="14" y="126" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">❌  Auto error response when invalid</text>
    <text x="14" y="140" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">📄  Generates OpenAPI docs</text>
    <text x="14" y="154" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">🖥️  Powers interactive /docs UI</text>
    <line x1="14" y1="164" x2="264" y2="164" stroke="#21262d" stroke-width="1"/>
    <text x="14" y="180" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-style="italic">One annotation → 7 things for free 🤯</text>
    <text x="14" y="196" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">param: int  ←  declare here. FastAPI handles the rest.</text>
  </g>

  <!-- Bottom tagline -->
  <text x="430" y="502" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Type hints are NOT runtime enforcement (Python ignores them) — FastAPI / Pydantic read and act on them</text>
</svg>
