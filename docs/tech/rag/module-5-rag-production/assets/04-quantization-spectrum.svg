<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="fullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="eightBitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="fourBitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="oneBitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Quantization Spectrum: Size vs Quality Trade-off</text>
  <text x="450" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">LLM Parameters &amp; Embedding Vectors</text>

  <!-- Left axis label (Size) -->
  <g transform="translate(30, 300) rotate(-90)">
    <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Size / Cost</text>
  </g>

  <!-- Bottom axis label (Quality) -->
  <text x="450" y="535" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Quality / Accuracy →</text>

  <!-- Boxes (4 options) -->

  <!-- 32-bit / 16-bit Full Precision -->
  <g transform="translate(70, 90)">
    <rect width="180" height="350" rx="12" fill="#1e3a1e" stroke="#4caf50" stroke-width="3" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="40" rx="12" fill="url(#fullGrad)"/>
    <text x="90" y="26" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">32/16-bit Full</text>

    <text x="90" y="70" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LLM: 16-bit params</text>
    <text x="90" y="88" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Vector: 32-bit floats</text>

    <text x="90" y="120" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ Maximum Quality</text>
    <text x="90" y="140" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">No accuracy drop</text>
    <text x="90" y="155" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Baseline performance</text>

    <text x="90" y="185" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✗ Largest Size</text>
    <text x="90" y="205" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">100% of original</text>
    <text x="90" y="220" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Expensive GPU memory</text>
    <text x="90" y="235" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Slow inference</text>

    <text x="90" y="270" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" font-style="italic" text-anchor="middle">Use when:</text>
    <text x="90" y="285" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Max quality required</text>
    <text x="90" y="298" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Cost not a constraint</text>
    <text x="90" y="311" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Latency not critical</text>

    <!-- Size bar -->
    <rect x="15" y="330" width="150" height="8" rx="4" fill="#4caf50" opacity="0.8"/>
    <text x="90" y="343" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">100% size</text>
  </g>

  <!-- 8-bit Quantization (RECOMMENDED) -->
  <g transform="translate(280, 140)">
    <rect width="180" height="300" rx="12" fill="#1e3a5f" stroke="#2196f3" stroke-width="3" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="40" rx="12" fill="url(#eightBitGrad)"/>
    <text x="90" y="26" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">8-bit (BEST)</text>

    <text x="90" y="70" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LLM: 8-bit params</text>
    <text x="90" y="88" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Vector: 8-bit ints</text>

    <text x="90" y="120" fill="#2196f3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ Excellent Balance</text>
    <text x="90" y="140" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Only 1-3% quality drop</text>
    <text x="90" y="155" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Much faster inference</text>

    <text x="90" y="185" fill="#2196f3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ Huge Savings</text>
    <text x="90" y="205" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM: 50% size (half)</text>
    <text x="90" y="220" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Vector: 25% size (quarter)</text>

    <text x="90" y="250" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" font-style="italic" text-anchor="middle">Use when:</text>
    <text x="90" y="265" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Default choice!</text>
    <text x="90" y="278" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Cost-conscious</text>

    <!-- Size bar -->
    <rect x="15" y="280" width="75" height="8" rx="4" fill="#2196f3" opacity="0.8"/>
    <text x="90" y="293" fill="#2196f3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">25-50% size</text>
  </g>

  <!-- 4-bit Quantization -->
  <g transform="translate(490, 190)">
    <rect width="180" height="250" rx="12" fill="#3d2e1f" stroke="#ff9800" stroke-width="3" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="40" rx="12" fill="url(#fourBitGrad)"/>
    <text x="90" y="26" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4-bit Aggressive</text>

    <text x="90" y="70" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LLM: 4-bit params</text>

    <text x="90" y="105" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⚠ Noticeable Drop</text>
    <text x="90" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">3-5% quality loss</text>
    <text x="90" y="140" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Still usable for many tasks</text>

    <text x="90" y="170" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ Max Compression</text>
    <text x="90" y="190" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">25% of original size</text>
    <text x="90" y="205" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Very fast</text>

    <text x="90" y="230" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" font-style="italic" text-anchor="middle">Use when cost critical</text>

    <!-- Size bar -->
    <rect x="15" y="230" width="37" height="8" rx="4" fill="#ff9800" opacity="0.8"/>
    <text x="90" y="243" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">~25% size</text>
  </g>

  <!-- 1-bit Binary -->
  <g transform="translate(700, 230)">
    <rect width="180" height="210" rx="12" fill="#3d1e1e" stroke="#f44336" stroke-width="3" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="40" rx="12" fill="url(#oneBitGrad)"/>
    <text x="90" y="26" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1-bit Extreme</text>

    <text x="90" y="70" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Vector: 1-bit (0 or 1)</text>

    <text x="90" y="100" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✗ Significant Loss</text>
    <text x="90" y="120" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">5-10% quality drop</text>

    <text x="90" y="145" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ Extreme Speed</text>
    <text x="90" y="165" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">3% of original (32×)</text>
    <text x="90" y="180" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Lightning fast search</text>

    <text x="90" y="205" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" font-style="italic" text-anchor="middle">Use with rescoring:</text>
    <text x="90" y="218" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Fast 1-bit retrieval → rescore</text>
    <text x="90" y="229" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">top-K with 32-bit full vectors</text>

    <!-- Size bar -->
    <rect x="15" y="190" width="8" height="8" rx="4" fill="#f44336" opacity="0.8"/>
    <text x="90" y="203" fill="#f44336" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">~3% size</text>
  </g>

  <!-- Footer -->
  <text x="450" y="520" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">💡 Sweet spot: 8-bit quantization (huge savings, minimal quality loss) — providers make it easy!</text>
</svg>
