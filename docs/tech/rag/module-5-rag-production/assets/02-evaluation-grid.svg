<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Evaluation Grid: Scope × Evaluator Type</text>

  <!-- Column Headers -->
  <text x="300" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Code-Based</text>
  <text x="300" y="105" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(Cheapest)</text>

  <text x="515" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LLM-as-a-Judge</text>
  <text x="515" y="105" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(Medium)</text>

  <text x="730" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Human Feedback</text>
  <text x="730" y="105" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(Most Expensive)</text>

  <!-- Row Labels -->
  <g transform="translate(50, 180)">
    <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Component</text>
    <text x="0" y="15" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Level</text>
  </g>

  <g transform="translate(50, 360)">
    <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" font-weight="bold">System</text>
    <text x="0" y="15" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Level</text>
  </g>

  <!-- Grid Boxes -->

  <!-- Component × Code-Based -->
  <g transform="translate(170, 150)">
    <rect width="210" height="110" rx="10" fill="#1e3a5f" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="25" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Retriever Latency</text>
    <text x="105" y="48" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Measure time taken by retriever</text>
    <text x="105" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Automatic, deterministic,</text>
    <text x="105" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">nearly free</text>
    <text x="105" y="100" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">✓ Easy to collect</text>
  </g>

  <!-- Component × LLM-as-a-Judge -->
  <g transform="translate(390, 150)">
    <rect width="210" height="110" rx="10" fill="#3d1e5f" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="25" fill="#9c27b0" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Context Quality</text>
    <text x="105" y="48" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Are retrieved docs relevant?</text>
    <text x="105" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">LLM evaluates: relevant vs</text>
    <text x="105" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">irrelevant (discrete labels)</text>
    <text x="105" y="100" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">⚠ Needs clear rubrics</text>
  </g>

  <!-- Component × Human Feedback -->
  <g transform="translate(610, 150)">
    <rect width="210" height="110" rx="10" fill="#1e3a1e" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Retrieved Doc</text>
    <text x="105" y="38" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Relevance</text>
    <text x="105" y="58" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Human-annotated test dataset:</text>
    <text x="105" y="71" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">prompt → expected doc IDs</text>
    <text x="105" y="89" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Calculate Recall &amp; Precision</text>
    <text x="105" y="105" fill="#f44336" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">💰 Upfront annotation cost</text>
  </g>

  <!-- System × Code-Based -->
  <g transform="translate(170, 330)">
    <rect width="210" height="110" rx="10" fill="#1e3a5f" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="25" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Token Usage</text>
    <text x="105" y="48" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">End-to-end throughput,</text>
    <text x="105" y="61" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">tokens generated per second</text>
    <text x="105" y="79" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Tracks overall system</text>
    <text x="105" y="91" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">performance at scale</text>
    <text x="105" y="105" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">✓ Continuous monitoring</text>
  </g>

  <!-- System × LLM-as-a-Judge -->
  <g transform="translate(390, 330)">
    <rect width="210" height="110" rx="10" fill="#3d1e5f" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="25" fill="#9c27b0" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Citation Accuracy</text>
    <text x="105" y="48" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Do citations match sources?</text>
    <text x="105" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">LLM evaluates faithfulness</text>
    <text x="105" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(RAGAS library)</text>
    <text x="105" y="100" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">⚡ Flexible, medium cost</text>
  </g>

  <!-- System × Human Feedback -->
  <g transform="translate(610, 330)">
    <rect width="210" height="110" rx="10" fill="#1e3a1e" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Thumbs Up/Down</text>
    <text x="105" y="48" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">User satisfaction rating</text>
    <text x="105" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Overall response quality signal</text>
    <text x="105" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(high-level, simple)</text>
    <text x="105" y="100" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">✓ Real user feedback!</text>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 480)">
    <text x="400" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">💡 Balance across grid: Cheap evals (top-left) for continuous monitoring + Expensive evals (right) for quality depth</text>
    <text x="400" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">🎯 Component evals debug WHERE issues occur. System evals show WHAT is broken overall.</text>
  </g>
</svg>
