<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="embedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="lvmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="vdbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Multimodal RAG Pipeline: Text + Images</text>
  <text x="450" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Same architecture, but retriever &amp; LLM handle both modalities 🖼️📄</text>

  <!-- Top: Knowledge Base -->
  <g transform="translate(350, 90)">
    <rect width="200" height="80" rx="10" fill="#1e3a1e" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📚 Knowledge Base</text>
    <text x="100" y="45" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">📝 Text documents</text>
    <text x="100" y="60" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">🖼️ Images (photos, PDFs, slides)</text>
  </g>

  <!-- Arrow down -->
  <path d="M 450 170 L 450 210" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50"/>
    </marker>
  </defs>

  <!-- Multimodal Embedding Model -->
  <g transform="translate(300, 210)">
    <rect width="300" height="90" rx="12" fill="#3d1e5f" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="300" height="35" rx="12" fill="url(#embedGrad)"/>
    <text x="150" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🧠 Multimodal Embedding Model</text>

    <text x="150" y="55" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Embeds text &amp; images into</text>
    <text x="150" y="70" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">SAME vector space</text>
    <text x="150" y="87" fill="#e1bee7" font-family="Inter, sans-serif" font-size="9" font-style="italic" text-anchor="middle">"dog" word ≈ 🐶 photo (close vectors)</text>
  </g>

  <!-- Arrow down -->
  <path d="M 450 300 L 450 340" stroke="#9c27b0" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9c27b0"/>
    </marker>
  </defs>

  <!-- Vector Database -->
  <g transform="translate(320, 340)">
    <rect width="260" height="70" rx="10" fill="#1e3a5f" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="30" rx="10" fill="url(#vdbGrad)"/>
    <text x="130" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🗄️ Vector Database</text>

    <text x="130" y="48" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Text vectors + Image vectors (same space)</text>
    <text x="130" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Vector search finds closest matches (text or image)</text>
  </g>

  <!-- User Prompt (Left side) -->
  <g transform="translate(50, 220)">
    <rect width="180" height="80" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📝 User Prompt</text>
    <text x="90" y="45" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Text: "Show me dog photos"</text>
    <text x="90" y="60" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">OR</text>
    <text x="90" y="75" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Image: 🐶 (upload photo)</text>
  </g>

  <!-- Arrow from prompt to embedding -->
  <path d="M 230 260 L 300 250" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9800"/>
    </marker>
  </defs>
  <text x="260" y="245" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Embed prompt</text>

  <!-- Arrow from VDB to retrieval results -->
  <path d="M 580 375 L 670 375" stroke="#2196f3" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2196f3"/>
    </marker>
  </defs>

  <!-- Retrieved Results -->
  <g transform="translate(670, 330)">
    <rect width="200" height="90" rx="10" fill="#1e3a1e" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📤 Retrieved</text>
    <text x="100" y="45" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Top-K text docs</text>
    <text x="100" y="60" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Top-K images</text>
    <text x="100" y="78" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(Mixed based on similarity)</text>
  </g>

  <!-- Arrow down to LVM -->
  <path d="M 770 420 L 770 460" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- Language Vision Model -->
  <g transform="translate(640, 460)">
    <rect width="260" height="80" rx="12" fill="#1e3a1e" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="30" rx="12" fill="url(#lvmGrad)"/>
    <text x="130" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🤖 Language Vision Model</text>

    <text x="130" y="48" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Processes text + images together</text>
    <text x="130" y="63" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Images tokenized as patches</text>
    <text x="130" y="76" fill="#c8e6c9" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">→ Generates text response</text>
  </g>

  <!-- Key Difference Box -->
  <g transform="translate(50, 440)">
    <rect width="220" height="90" rx="10" fill="#3d2e1f" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔑 Key Differences</text>

    <text x="110" y="45" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">1. Multimodal embedding model</text>
    <text x="110" y="58" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(not text-only)</text>
    <text x="110" y="73" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">2. Language vision model</text>
    <text x="110" y="86" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(not text-only LLM)</text>
  </g>

  <!-- Footer -->
  <text x="450" y="540" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">💡 Architecture stays the same, but both retriever &amp; LLM handle text + images. PDFs = split into grid → 1000 vectors/page!</text>
</svg>
