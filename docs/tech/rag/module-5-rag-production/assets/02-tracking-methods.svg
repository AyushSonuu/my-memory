<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Tracking Methods: Aggregate Stats vs Detailed Logs</text>

  <!-- Left: Aggregate Statistics -->
  <g transform="translate(50, 70)">
    <rect width="320" height="280" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
    <rect width="320" height="35" rx="10" fill="url(#blueGrad)"/>
    <text x="160" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">📊 Aggregate Statistics</text>

    <!-- Purpose -->
    <text x="15" y="60" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Purpose:</text>
    <text x="15" y="78" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Track trends over time</text>
    <text x="15" y="92" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Identify regressions</text>

    <!-- Examples -->
    <text x="15" y="118" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Examples:</text>
    <text x="15" y="136" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Average latency (last hour/day/week)</text>
    <text x="15" y="150" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Throughput trends (req/sec)</text>
    <text x="15" y="164" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• % thumbs-down responses</text>
    <text x="15" y="178" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Memory usage over time</text>

    <!-- Use case -->
    <rect x="10" y="200" width="300" height="65" rx="6" fill="#0d1117" stroke="#2196f3" stroke-width="1"/>
    <text x="160" y="218" fill="#2196f3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Use Case:</text>
    <text x="160" y="235" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"Our latency spiked yesterday</text>
    <text x="160" y="248" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">— what changed?"</text>
  </g>

  <!-- Right: Detailed Logs -->
  <g transform="translate(430, 70)">
    <rect width="320" height="280" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect width="320" height="35" rx="10" fill="url(#greenGrad)"/>
    <text x="160" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔍 Detailed Logs</text>

    <!-- Purpose -->
    <text x="15" y="60" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Purpose:</text>
    <text x="15" y="78" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Trace individual prompts through pipeline</text>

    <!-- Examples -->
    <text x="15" y="104" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">What to log per request:</text>
    <text x="15" y="122" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• User prompt text</text>
    <text x="15" y="136" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Retrieved docs (IDs, scores)</text>
    <text x="15" y="150" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• LLM input (augmented prompt)</text>
    <text x="15" y="164" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• LLM output (final response)</text>
    <text x="15" y="178" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Latency per component</text>
    <text x="15" y="192" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Timestamps, user ID, session ID</text>

    <!-- Use case -->
    <rect x="10" y="210" width="300" height="55" rx="6" fill="#0d1117" stroke="#4caf50" stroke-width="1"/>
    <text x="160" y="228" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Use Case:</text>
    <text x="160" y="245" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"This response was garbage —</text>
    <text x="160" y="258" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">trace exactly what happened"</text>
  </g>

  <!-- Footer -->
  <text x="400" y="380" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">💡 You need BOTH: Aggregate = high-level trends, Detailed = debugging specific failures</text>
</svg>
