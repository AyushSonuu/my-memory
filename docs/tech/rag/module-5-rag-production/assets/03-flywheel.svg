<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">The Continuous Improvement Flywheel</text>
  <text x="400" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Real-world prompts → Debug → Experiment → Deploy → Repeat 🔄</text>

  <!-- Center circle (nucleus) -->
  <circle cx="400" cy="270" r="60" fill="#161b22" stroke="#e6edf3" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="260" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Custom</text>
  <text x="400" y="275" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Dataset</text>
  <text x="400" y="290" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(Production Logs)</text>

  <!-- Phase 1: Observe (top) -->
  <g transform="translate(300, 80)">
    <rect width="200" height="90" rx="10" fill="#1e3a5f" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#blueGrad)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🔍 1. Observe</text>

    <text x="100" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Log every production request:</text>
    <text x="100" y="63" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Prompts, responses, docs</text>
    <text x="100" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Latency, user feedback</text>
  </g>

  <!-- Arrow 1→2 (right side) -->
  <path d="M 480 140 L 560 180" stroke="#2196f3" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2196f3"/>
    </marker>
  </defs>

  <!-- Phase 2: Evaluate (right) -->
  <g transform="translate(560, 190)">
    <rect width="200" height="90" rx="10" fill="#3d2e1f" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#orangeGrad)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📊 2. Evaluate</text>

    <text x="100" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Run component-level evals:</text>
    <text x="100" y="63" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Cluster by topic</text>
    <text x="100" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Identify weak spots</text>
  </g>

  <!-- Arrow 2→3 (bottom-right) -->
  <path d="M 660 280 L 560 360" stroke="#ff9800" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9800"/>
    </marker>
  </defs>

  <!-- Phase 3: Experiment (bottom) -->
  <g transform="translate(300, 370)">
    <rect width="200" height="90" rx="10" fill="#3d1e5f" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#purpleGrad)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🔬 3. Experiment</text>

    <text x="100" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Test redesigns on real prompts:</text>
    <text x="100" y="63" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• New retriever, LLM, prompt</text>
    <text x="100" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Measure improvement</text>
  </g>

  <!-- Arrow 3→4 (left side) -->
  <path d="M 300 415 L 220 360" stroke="#9c27b0" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9c27b0"/>
    </marker>
  </defs>

  <!-- Phase 4: Deploy (left) -->
  <g transform="translate(40, 190)">
    <rect width="200" height="90" rx="10" fill="#1e3a1e" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#greenGrad)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🚀 4. Deploy</text>

    <text x="100" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Push to production:</text>
    <text x="100" y="63" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Confident (tested on real data)</text>
    <text x="100" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Monitor new prompts</text>
  </g>

  <!-- Arrow 4→1 (top-left) -->
  <path d="M 140 190 L 320 140" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50"/>
    </marker>
  </defs>

  <!-- Connecting lines to center -->
  <line x1="400" y1="210" x2="400" y2="170" stroke="#2196f3" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="460" y1="250" x2="560" y2="235" stroke="#ff9800" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="400" y1="330" x2="400" y2="370" stroke="#9c27b0" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="340" y1="250" x2="240" y2="235" stroke="#4caf50" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Footer -->
  <text x="400" y="490" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">💡 Each iteration uses production data → no guessing, no synthetic tests, just real-world optimization!</text>
</svg>
