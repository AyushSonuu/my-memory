<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="llmGradRag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="retGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="kbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="augGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadowRag">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">RAG: Retrieval-Augmented Generation</text>

  <!-- User Prompt -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="160" height="80" rx="12" fill="#161b22" stroke="#e6edf3" stroke-width="2" filter="url(#shadowRag)"/>
    <text x="80" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">👤</text>
    <text x="80" y="55" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">User Prompt</text>
    <text x="80" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"Why are hotels expensive?"</text>
  </g>

  <!-- Arrow to Retriever -->
  <g transform="translate(200, 110)">
    <path d="M 0 0 L 60 0" stroke="#2196f3" stroke-width="3"/>
    <polygon points="60,0 50,-6 50,6" fill="#2196f3"/>
  </g>

  <!-- Retriever -->
  <g transform="translate(270, 55)">
    <rect x="0" y="0" width="140" height="110" rx="12" fill="url(#retGrad)" filter="url(#shadowRag)"/>
    <text x="70" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">🔍</text>
    <text x="70" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Retriever</text>
    <text x="70" y="78" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Searches for</text>
    <text x="70" y="92" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">relevant info</text>
  </g>

  <!-- Knowledge Base -->
  <g transform="translate(270, 200)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="url(#kbGrad)" filter="url(#shadowRag)"/>
    <text x="70" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">📚</text>
    <text x="70" y="52" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Knowledge Base</text>
    <text x="70" y="70" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Private data, recent info,</text>
    <text x="70" y="82" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">specialized documents</text>
  </g>

  <!-- Bidirectional arrow Retriever <-> KB -->
  <line x1="340" y1="165" x2="340" y2="200" stroke="#9c27b0" stroke-width="2"/>
  <polygon points="340,200 334,190 346,190" fill="#9c27b0"/>
  <polygon points="340,165 334,175 346,175" fill="#9c27b0"/>
  <text x="365" y="185" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">queries</text>

  <!-- Arrow to Augmented Prompt -->
  <g transform="translate(420, 110)">
    <path d="M 0 0 L 50 0" stroke="#ff9800" stroke-width="3"/>
    <polygon points="50,0 40,-6 40,6" fill="#ff9800"/>
  </g>

  <!-- Augmented Prompt -->
  <g transform="translate(480, 55)">
    <rect x="0" y="0" width="140" height="110" rx="12" fill="url(#augGrad)" filter="url(#shadowRag)"/>
    <text x="70" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">📝</text>
    <text x="70" y="52" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Augmented Prompt</text>
    <rect x="15" y="62" width="110" height="38" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="70" y="76" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Question +</text>
    <text x="70" y="88" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Retrieved docs</text>
  </g>

  <!-- Arrow to LLM -->
  <g transform="translate(630, 110)">
    <path d="M 0 0 L 50 0" stroke="#4caf50" stroke-width="3"/>
    <polygon points="50,0 40,-6 40,6" fill="#4caf50"/>
  </g>

  <!-- LLM -->
  <g transform="translate(690, 55)">
    <rect x="0" y="0" width="90" height="110" rx="12" fill="url(#llmGradRag)" filter="url(#shadowRag)"/>
    <text x="45" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">🧠</text>
    <text x="45" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LLM</text>
    <text x="45" y="78" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Generates</text>
    <text x="45" y="92" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">response</text>
  </g>

  <!-- Response -->
  <g transform="translate(690, 180)">
    <rect x="0" y="0" width="90" height="60" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <text x="45" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">✅</text>
    <text x="45" y="45" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Response</text>
  </g>

  <!-- Arrow LLM to Response -->
  <line x1="735" y1="165" x2="735" y2="180" stroke="#4caf50" stroke-width="2"/>
  <polygon points="735,180 729,170 741,170" fill="#4caf50"/>

  <!-- Bottom: The 3 components explained -->
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="740" height="75" rx="10" fill="#21262d"/>
    <text x="370" y="22" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">The Three RAG Components</text>

    <!-- Retriever -->
    <circle cx="80" cy="50" r="8" fill="#2196f3"/>
    <text x="95" y="54" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Retriever — finds relevant info from KB</text>

    <!-- KB -->
    <circle cx="330" cy="50" r="8" fill="#9c27b0"/>
    <text x="345" y="54" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Knowledge Base — trusted documents</text>

    <!-- LLM -->
    <circle cx="580" cy="50" r="8" fill="#4caf50"/>
    <text x="595" y="54" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">LLM — generates response</text>
  </g>
</svg>