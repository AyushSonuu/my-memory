<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="advGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="advGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="advGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
    <linearGradient id="advGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="advGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <filter id="shadowAdv">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">5 Advantages of RAG</text>

  <!-- Center Hub -->
  <g transform="translate(325, 175)">
    <circle cx="75" cy="75" r="60" fill="#ff9800" filter="url(#shadowAdv)"/>
    <text x="75" y="65" fill="#fff" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">🔍</text>
    <text x="75" y="90" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RAG</text>
  </g>

  <!-- Advantage 1: Injects Missing Knowledge -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadowAdv)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#advGrad1)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">💉 Injects Missing Knowledge</text>
    <text x="100" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Private data, recent info,</text>
    <text x="100" y="66" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">specialized knowledge</text>
    <text x="100" y="82" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Often the ONLY way!</text>
  </g>
  <line x1="250" y1="105" x2="330" y2="190" stroke="#2196f3" stroke-width="2"/>

  <!-- Advantage 2: Reduces Hallucinations -->
  <g transform="translate(550, 60)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowAdv)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#advGrad2)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🛡️ Reduces Hallucinations</text>
    <text x="100" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Retrieved context grounds</text>
    <text x="100" y="66" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">responses in facts</text>
    <text x="100" y="82" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">LLMs hallucinate most on gaps</text>
  </g>
  <line x1="550" y1="105" x2="470" y2="190" stroke="#4caf50" stroke-width="2"/>

  <!-- Advantage 3: Easy to Update -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#161b22" stroke="#00bcd4" stroke-width="2" filter="url(#shadowAdv)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#advGrad3)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔄 Easy to Keep Up-to-Date</text>
    <text x="100" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Update KB like any database</text>
    <text x="100" y="66" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">No costly retraining needed</text>
    <text x="100" y="82" fill="#00bcd4" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Indexed = immediately available</text>
  </g>
  <line x1="250" y1="345" x2="330" y2="280" stroke="#00bcd4" stroke-width="2"/>

  <!-- Advantage 4: Source Citations -->
  <g transform="translate(550, 300)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadowAdv)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#advGrad4)"/>
    <text x="100" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📎 Enables Source Citations</text>
    <text x="100" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Citation info flows through</text>
    <text x="100" y="66" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">to the response</text>
    <text x="100" y="82" fill="#ce93d8" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Readers can verify claims</text>
  </g>
  <line x1="550" y1="345" x2="470" y2="280" stroke="#9c27b0" stroke-width="2"/>

  <!-- Advantage 5: Focuses LLM -->
  <g transform="translate(300, 395)">
    <rect x="0" y="0" width="200" height="50" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadowAdv)"/>
    <rect x="0" y="0" width="200" height="25" rx="10" fill="url(#advGrad5)"/>
    <text x="100" y="18" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🎯 Focuses LLM on Generation</text>
    <text x="100" y="42" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Retriever = fact-finder | LLM = writer</text>
  </g>
  <line x1="400" y1="310" x2="400" y2="395" stroke="#f44336" stroke-width="2"/>
</svg>