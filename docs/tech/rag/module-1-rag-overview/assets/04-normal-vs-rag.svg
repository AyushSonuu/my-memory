<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="normalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#607d8b"/>
      <stop offset="100%" style="stop-color:#455a64"/>
    </linearGradient>
    <linearGradient id="ragSysGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <filter id="shadowArch">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Normal LLM vs RAG System</text>

  <!-- NORMAL LLM (Top) -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="600" height="120" rx="12" fill="#161b22" stroke="#607d8b" stroke-width="2" filter="url(#shadowArch)"/>
    <rect x="0" y="0" width="600" height="35" rx="12" fill="url(#normalGrad)"/>
    <text x="300" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Normal LLM Usage</text>

    <!-- Flow -->
    <rect x="30" y="55" width="100" height="45" rx="6" fill="#21262d"/>
    <text x="80" y="75" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">📝 Prompt</text>
    <text x="80" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"Why hotels..."</text>

    <path d="M 140 77 L 200 77" stroke="#607d8b" stroke-width="2"/>
    <polygon points="200,77 190,71 190,83" fill="#607d8b"/>

    <rect x="210" y="55" width="100" height="45" rx="6" fill="#4caf50"/>
    <text x="260" y="82" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🧠 LLM</text>

    <path d="M 320 77 L 380 77" stroke="#607d8b" stroke-width="2"/>
    <polygon points="380,77 370,71 370,83" fill="#607d8b"/>

    <rect x="390" y="55" width="180" height="45" rx="6" fill="#21262d"/>
    <text x="480" y="75" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">💬 Response (may hallucinate)</text>
    <text x="480" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"Generic answer..."</text>
  </g>

  <!-- VS -->
  <text x="400" y="205" fill="#8b949e" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">VS</text>

  <!-- RAG SYSTEM (Bottom) -->
  <g transform="translate(50, 225)">
    <rect x="0" y="0" width="700" height="155" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowArch)"/>
    <rect x="0" y="0" width="700" height="35" rx="12" fill="url(#ragSysGrad)"/>
    <text x="350" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RAG System</text>

    <!-- Prompt -->
    <rect x="20" y="50" width="80" height="40" rx="6" fill="#21262d"/>
    <text x="60" y="75" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">📝 Prompt</text>

    <path d="M 105 70 L 135 70" stroke="#2196f3" stroke-width="2"/>
    <polygon points="135,70 125,64 125,76" fill="#2196f3"/>

    <!-- Retriever -->
    <rect x="140" y="50" width="90" height="40" rx="6" fill="#2196f3"/>
    <text x="185" y="75" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🔍 Retriever</text>

    <!-- Knowledge Base -->
    <rect x="140" y="100" width="90" height="40" rx="6" fill="#9c27b0"/>
    <text x="185" y="125" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">📚 KB</text>

    <!-- Bidirectional -->
    <line x1="185" y1="90" x2="185" y2="100" stroke="#9c27b0" stroke-width="2"/>

    <path d="M 235 70 L 275 70" stroke="#ff9800" stroke-width="2"/>
    <polygon points="275,70 265,64 265,76" fill="#ff9800"/>

    <!-- Augmented Prompt -->
    <rect x="280" y="50" width="110" height="40" rx="6" fill="#ff9800"/>
    <text x="335" y="68" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">📝 Augmented</text>
    <text x="335" y="82" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Prompt</text>

    <path d="M 395 70 L 435 70" stroke="#4caf50" stroke-width="2"/>
    <polygon points="435,70 425,64 425,76" fill="#4caf50"/>

    <!-- LLM -->
    <rect x="440" y="50" width="80" height="40" rx="6" fill="#4caf50"/>
    <text x="480" y="75" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🧠 LLM</text>

    <path d="M 525 70 L 565 70" stroke="#4caf50" stroke-width="2"/>
    <polygon points="565,70 555,64 555,76" fill="#4caf50"/>

    <!-- Response -->
    <rect x="570" y="50" width="110" height="40" rx="6" fill="#21262d" stroke="#4caf50" stroke-width="1"/>
    <text x="625" y="68" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">✅ Grounded</text>
    <text x="625" y="82" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Response</text>

    <!-- Note -->
    <text x="350" y="148" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">User sees no difference — retriever works behind the scenes!</text>
  </g>
</svg>