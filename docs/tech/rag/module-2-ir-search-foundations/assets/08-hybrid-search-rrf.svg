<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="kwGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="semGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="rrfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Reciprocal Rank Fusion (RRF) — Merging Two Rankings</text>

  <!-- Keyword Ranking -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="250" height="200" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="250" height="35" rx="10" fill="url(#kwGrad2)"/>
    <text x="125" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🔤 Keyword Ranking (BM25)</text>

    <!-- Rankings -->
    <text x="20" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Rank</text>
    <text x="80" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Document</text>
    <text x="180" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">RRF Points</text>

    <text x="20" y="85" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#1</text>
    <text x="80" y="85" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc A</text>
    <text x="180" y="85" fill="#4caf50" font-family="Inter, sans-serif" font-size="11">1/51 = 0.0196</text>

    <text x="20" y="110" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#2</text>
    <text x="80" y="110" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc C</text>
    <text x="180" y="110" fill="#4caf50" font-family="Inter, sans-serif" font-size="11">1/52 = 0.0192</text>

    <text x="20" y="135" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#3</text>
    <text x="80" y="135" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc B</text>
    <text x="180" y="135" fill="#4caf50" font-family="Inter, sans-serif" font-size="11">1/53 = 0.0189</text>

    <text x="20" y="160" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#4</text>
    <text x="80" y="160" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc D</text>
    <text x="180" y="160" fill="#4caf50" font-family="Inter, sans-serif" font-size="11">1/54 = 0.0185</text>

    <text x="20" y="185" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#5</text>
    <text x="80" y="185" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc E</text>
    <text x="180" y="185" fill="#4caf50" font-family="Inter, sans-serif" font-size="11">1/55 = 0.0182</text>
  </g>

  <!-- Semantic Ranking -->
  <g transform="translate(470, 60)">
    <rect x="0" y="0" width="250" height="200" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="250" height="35" rx="10" fill="url(#semGrad2)"/>
    <text x="125" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🧠 Semantic Ranking</text>

    <!-- Rankings -->
    <text x="20" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Rank</text>
    <text x="80" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Document</text>
    <text x="180" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">RRF Points</text>

    <text x="20" y="85" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#1</text>
    <text x="80" y="85" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc B</text>
    <text x="180" y="85" fill="#2196f3" font-family="Inter, sans-serif" font-size="11">1/51 = 0.0196</text>

    <text x="20" y="110" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#2</text>
    <text x="80" y="110" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc A</text>
    <text x="180" y="110" fill="#2196f3" font-family="Inter, sans-serif" font-size="11">1/52 = 0.0192</text>

    <text x="20" y="135" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#3</text>
    <text x="80" y="135" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc F</text>
    <text x="180" y="135" fill="#2196f3" font-family="Inter, sans-serif" font-size="11">1/53 = 0.0189</text>

    <text x="20" y="160" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#4</text>
    <text x="80" y="160" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc C</text>
    <text x="180" y="160" fill="#2196f3" font-family="Inter, sans-serif" font-size="11">1/54 = 0.0185</text>

    <text x="20" y="185" fill="#2196f3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#5</text>
    <text x="80" y="185" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Doc D</text>
    <text x="180" y="185" fill="#2196f3" font-family="Inter, sans-serif" font-size="11">1/55 = 0.0182</text>
  </g>

  <!-- Arrows down -->
  <line x1="205" y1="260" x2="205" y2="285" stroke="#4caf50" stroke-width="2"/>
  <line x1="595" y1="260" x2="595" y2="285" stroke="#2196f3" stroke-width="2"/>
  <path d="M 205 285 L 400 310" stroke="#8b949e" stroke-width="2"/>
  <path d="M 595 285 L 400 310" stroke="#8b949e" stroke-width="2"/>

  <!-- RRF Formula -->
  <g transform="translate(250, 295)">
    <rect x="0" y="0" width="300" height="45" rx="8" fill="url(#rrfGrad)" filter="url(#shadow2)"/>
    <text x="150" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RRF Score = 1/(k + rank_kw) + 1/(k + rank_sem)</text>
    <text x="150" y="36" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">k = 50 (balanced ranking)</text>
  </g>

  <!-- Final Ranking -->
  <g transform="translate(200, 360)">
    <rect x="0" y="0" width="400" height="110" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="400" height="30" rx="10" fill="#ff9800"/>
    <text x="200" y="21" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Final Unified Ranking</text>

    <text x="20" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Rank</text>
    <text x="80" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Doc</text>
    <text x="150" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">KW Points</text>
    <text x="240" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Sem Points</text>
    <text x="330" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Total</text>

    <text x="20" y="75" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#1</text>
    <text x="80" y="75" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Doc A</text>
    <text x="150" y="75" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">0.0196 (#1)</text>
    <text x="240" y="75" fill="#2196f3" font-family="Inter, sans-serif" font-size="10">0.0192 (#2)</text>
    <text x="330" y="75" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold">0.0388</text>

    <text x="20" y="95" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold">#2</text>
    <text x="80" y="95" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Doc B</text>
    <text x="150" y="95" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">0.0189 (#3)</text>
    <text x="240" y="95" fill="#2196f3" font-family="Inter, sans-serif" font-size="10">0.0196 (#1)</text>
    <text x="330" y="95" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold">0.0385</text>
  </g>

  <!-- Key insight -->
  <text x="400" y="478" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Doc A wins: strong in BOTH rankings (1st + 2nd) beats Doc B (3rd + 1st)</text>
</svg>