<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadowK">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="350" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Precision@K — How K Changes the Score</text>

  <!-- Ranked list visualization -->
  <g transform="translate(50, 60)">
    <!-- Header -->
    <rect x="0" y="0" width="250" height="30" rx="5" fill="url(#headerGrad)"/>
    <text x="40" y="21" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Rank</text>
    <text x="125" y="21" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Document</text>
    <text x="200" y="21" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Relevant?</text>

    <!-- Rows -->
    <rect x="0" y="35" width="250" height="28" fill="#238636" opacity="0.3"/>
    <text x="40" y="54" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">1</text>
    <text x="125" y="54" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc A</text>
    <text x="200" y="54" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✓</text>

    <rect x="0" y="63" width="250" height="28" fill="#21262d"/>
    <text x="40" y="82" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">2</text>
    <text x="125" y="82" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc B</text>
    <text x="200" y="82" fill="#f44336" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✗</text>

    <rect x="0" y="91" width="250" height="28" fill="#21262d"/>
    <text x="40" y="110" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">3</text>
    <text x="125" y="110" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc C</text>
    <text x="200" y="110" fill="#f44336" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✗</text>

    <rect x="0" y="119" width="250" height="28" fill="#238636" opacity="0.3"/>
    <text x="40" y="138" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">4</text>
    <text x="125" y="138" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc D</text>
    <text x="200" y="138" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✓</text>

    <rect x="0" y="147" width="250" height="28" fill="#21262d"/>
    <text x="40" y="166" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">5</text>
    <text x="125" y="166" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc E</text>
    <text x="200" y="166" fill="#f44336" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✗</text>

    <!-- K=5 bracket -->
    <line x1="260" y1="35" x2="260" y2="175" stroke="#ff9800" stroke-width="3"/>
    <line x1="255" y1="35" x2="270" y2="35" stroke="#ff9800" stroke-width="3"/>
    <line x1="255" y1="175" x2="270" y2="175" stroke="#ff9800" stroke-width="3"/>
    <text x="280" y="110" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold">K=5</text>

    <!-- More rows for K=10 -->
    <rect x="0" y="175" width="250" height="28" fill="#238636" opacity="0.3"/>
    <text x="40" y="194" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">6</text>
    <text x="125" y="194" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc F</text>
    <text x="200" y="194" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✓</text>

    <rect x="0" y="203" width="250" height="28" fill="#238636" opacity="0.3"/>
    <text x="40" y="222" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">7</text>
    <text x="125" y="222" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc G</text>
    <text x="200" y="222" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✓</text>

    <rect x="0" y="231" width="250" height="28" fill="#21262d"/>
    <text x="40" y="250" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">8</text>
    <text x="125" y="250" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc H</text>
    <text x="200" y="250" fill="#f44336" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✗</text>

    <rect x="0" y="259" width="250" height="28" fill="#238636" opacity="0.3"/>
    <text x="40" y="278" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">9</text>
    <text x="125" y="278" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc I</text>
    <text x="200" y="278" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✓</text>

    <rect x="0" y="287" width="250" height="28" fill="#238636" opacity="0.3"/>
    <text x="40" y="306" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">10</text>
    <text x="125" y="306" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Doc J</text>
    <text x="200" y="306" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">✓</text>

    <!-- K=10 bracket -->
    <line x1="315" y1="35" x2="315" y2="315" stroke="#2196f3" stroke-width="3"/>
    <line x1="310" y1="35" x2="325" y2="35" stroke="#2196f3" stroke-width="3"/>
    <line x1="310" y1="315" x2="325" y2="315" stroke="#2196f3" stroke-width="3"/>
    <text x="335" y="180" fill="#2196f3" font-family="Inter, sans-serif" font-size="12" font-weight="bold">K=10</text>
  </g>

  <!-- Metric boxes -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="230" height="80" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadowK)"/>
    <text x="115" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Precision@5</text>
    <text x="115" y="55" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">2 relevant / 5 total</text>
    <text x="115" y="75" fill="#ff9800" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">40%</text>

    <rect x="0" y="100" width="230" height="80" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadowK)"/>
    <text x="115" y="125" fill="#2196f3" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Precision@10</text>
    <text x="115" y="155" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">6 relevant / 10 total</text>
    <text x="115" y="175" fill="#2196f3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">60%</text>

    <rect x="0" y="200" width="230" height="80" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowK)"/>
    <text x="115" y="225" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Recall@10</text>
    <text x="115" y="255" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">6 found / 8 in KB</text>
    <text x="115" y="275" fill="#4caf50" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">75%</text>
  </g>

  <!-- Bottom insight -->
  <text x="350" y="385" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Higher K = more forgiving (you look at more results) | Lower K = stricter (only top matters)</text>
</svg>