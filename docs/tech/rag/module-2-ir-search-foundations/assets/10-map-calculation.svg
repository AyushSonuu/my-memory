<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380">
  <defs>
    <linearGradient id="mapHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <filter id="shadowMap">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="380" fill="#0d1117"/>

  <!-- Title -->
  <text x="375" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Mean Average Precision (MAP) — Step by Step</text>

  <!-- Table -->
  <g transform="translate(40, 55)">
    <!-- Header -->
    <rect x="0" y="0" width="350" height="35" rx="5" fill="url(#mapHeader)"/>
    <text x="35" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Rank</text>
    <text x="120" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Relevant?</text>
    <text x="230" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Precision@K</text>
    <text x="315" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Include?</text>

    <!-- Row 1 - Relevant -->
    <rect x="0" y="40" width="350" height="32" fill="#238636" opacity="0.3"/>
    <text x="35" y="61" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">1</text>
    <text x="120" y="61" fill="#4caf50" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">✓</text>
    <text x="230" y="61" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">1/1 = 1.0</text>
    <text x="315" y="61" fill="#ffd54f" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✓ 1.0</text>

    <!-- Row 2 - Irrelevant -->
    <rect x="0" y="72" width="350" height="32" fill="#21262d"/>
    <text x="35" y="93" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">2</text>
    <text x="120" y="93" fill="#f44336" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">✗</text>
    <text x="230" y="93" fill="#8b949e" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">1/2 = 0.5</text>
    <text x="315" y="93" fill="#8b949e" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">—</text>

    <!-- Row 3 - Irrelevant -->
    <rect x="0" y="104" width="350" height="32" fill="#21262d"/>
    <text x="35" y="125" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">3</text>
    <text x="120" y="125" fill="#f44336" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">✗</text>
    <text x="230" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">1/3 = 0.33</text>
    <text x="315" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">—</text>

    <!-- Row 4 - Relevant -->
    <rect x="0" y="136" width="350" height="32" fill="#238636" opacity="0.3"/>
    <text x="35" y="157" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">4</text>
    <text x="120" y="157" fill="#4caf50" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">✓</text>
    <text x="230" y="157" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">2/4 = 0.5</text>
    <text x="315" y="157" fill="#ffd54f" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✓ 0.5</text>

    <!-- Row 5 - Relevant -->
    <rect x="0" y="168" width="350" height="32" fill="#238636" opacity="0.3"/>
    <text x="35" y="189" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">5</text>
    <text x="120" y="189" fill="#4caf50" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">✓</text>
    <text x="230" y="189" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">3/5 = 0.6</text>
    <text x="315" y="189" fill="#ffd54f" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✓ 0.6</text>

    <!-- Row 6 - Irrelevant -->
    <rect x="0" y="200" width="350" height="32" fill="#21262d"/>
    <text x="35" y="221" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">6</text>
    <text x="120" y="221" fill="#f44336" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">✗</text>
    <text x="230" y="221" fill="#8b949e" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">3/6 = 0.5</text>
    <text x="315" y="221" fill="#8b949e" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">—</text>
  </g>

  <!-- Calculation steps -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="280" height="180" rx="10" fill="#161b22" stroke="#f5576c" stroke-width="2" filter="url(#shadowMap)"/>

    <text x="140" y="30" fill="#f5576c" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AP@6 Calculation</text>

    <!-- Step 1 -->
    <circle cx="25" cy="60" r="12" fill="#1f6feb"/>
    <text x="25" y="65" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <text x="45" y="55" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Sum precisions at relevant rows:</text>
    <text x="45" y="72" fill="#ffd54f" font-family="monospace" font-size="12">1.0 + 0.5 + 0.6 = 2.1</text>

    <!-- Step 2 -->
    <circle cx="25" cy="105" r="12" fill="#1f6feb"/>
    <text x="25" y="110" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <text x="45" y="100" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11">Divide by # of relevant docs:</text>
    <text x="45" y="117" fill="#ffd54f" font-family="monospace" font-size="12">2.1 / 3 = 0.7</text>

    <!-- Result -->
    <rect x="20" y="135" width="240" height="35" rx="6" fill="#238636"/>
    <text x="140" y="158" fill="#fff" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">AP@6 = 0.7</text>
  </g>

  <!-- MAP formula -->
  <g transform="translate(430, 260)">
    <rect x="0" y="0" width="280" height="80" rx="10" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadowMap)"/>
    <text x="140" y="25" fill="#2196f3" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Mean Average Precision</text>
    <text x="140" y="50" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Run AP across many queries</text>
    <text x="140" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">MAP = average of all AP values</text>
  </g>

  <!-- Bottom insight -->
  <text x="375" y="365" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Key insight: Irrelevant docs in high ranks HURT precision at every relevant doc below → lower AP</text>
</svg>