<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <linearGradient id="precGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="recGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81c784"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="overlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb74d"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="320" fill="#0d1117"/>

  <!-- Title -->
  <text x="350" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Precision vs Recall: The Venn View</text>

  <!-- Retrieved circle (left) -->
  <circle cx="220" cy="170" r="100" fill="url(#precGrad)" opacity="0.7" filter="url(#shadow)"/>

  <!-- Relevant circle (right) -->
  <circle cx="340" cy="170" r="100" fill="url(#recGrad)" opacity="0.7" filter="url(#shadow)"/>

  <!-- Overlap highlight -->
  <clipPath id="clip1">
    <circle cx="220" cy="170" r="100"/>
  </clipPath>
  <circle cx="340" cy="170" r="100" fill="url(#overlapGrad)" opacity="0.9" clip-path="url(#clip1)"/>

  <!-- Labels inside circles -->
  <text x="170" y="175" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Retrieved</text>
  <text x="170" y="195" fill="#fff" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">(Irrelevant)</text>

  <text x="390" y="175" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Relevant</text>
  <text x="390" y="195" fill="#fff" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">(Missed)</text>

  <text x="280" y="165" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Relevant</text>
  <text x="280" y="182" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&amp;</text>
  <text x="280" y="199" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Retrieved</text>

  <!-- Formula boxes -->
  <rect x="480" y="80" width="200" height="60" rx="8" fill="#1f6feb" filter="url(#shadow)"/>
  <text x="580" y="105" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PRECISION</text>
  <text x="580" y="128" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">= Orange / Blue circle</text>

  <rect x="480" y="160" width="200" height="60" rx="8" fill="#238636" filter="url(#shadow)"/>
  <text x="580" y="185" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RECALL</text>
  <text x="580" y="208" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">= Orange / Green circle</text>

  <!-- Bottom insight -->
  <text x="350" y="295" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Perfect score: Orange fills BOTH circles completely</text>
</svg>