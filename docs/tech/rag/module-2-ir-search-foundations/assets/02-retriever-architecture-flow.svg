<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="kwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="semGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="fusionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Retriever Architecture — Hybrid Search Pipeline</text>

  <!-- User Prompt -->
  <g transform="translate(330, 50)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#161b22" stroke="#e6edf3" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="22" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" text-anchor="middle">👤</text>
    <text x="70" y="40" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">User Prompt</text>
  </g>

  <!-- Arrow down to split -->
  <line x1="400" y1="100" x2="400" y2="130" stroke="#8b949e" stroke-width="2"/>

  <!-- Retriever Box -->
  <g transform="translate(300, 130)">
    <rect x="0" y="0" width="200" height="35" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="100" y="23" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RETRIEVER</text>
  </g>

  <!-- Split arrows -->
  <path d="M 400 165 L 400 190 L 200 190 L 200 220" stroke="#8b949e" stroke-width="2" fill="none"/>
  <path d="M 400 165 L 400 190 L 600 190 L 600 220" stroke="#8b949e" stroke-width="2" fill="none"/>
  <polygon points="200,220 194,210 206,210" fill="#8b949e"/>
  <polygon points="600,220 594,210 606,210" fill="#8b949e"/>

  <!-- Keyword Search -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="url(#kwGrad)" filter="url(#shadow)"/>
    <text x="100" y="28" fill="#fff" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">🔤</text>
    <text x="100" y="48" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Keyword Search</text>
    <text x="100" y="63" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Exact term matching</text>
  </g>

  <!-- Semantic Search -->
  <g transform="translate(500, 220)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="url(#semGrad)" filter="url(#shadow)"/>
    <text x="100" y="28" fill="#fff" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">🧠</text>
    <text x="100" y="48" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Semantic Search</text>
    <text x="100" y="63" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Meaning similarity</text>
  </g>

  <!-- Arrows to metadata filters -->
  <line x1="200" y1="290" x2="200" y2="320" stroke="#4caf50" stroke-width="2"/>
  <polygon points="200,320 194,310 206,310" fill="#4caf50"/>
  <line x1="600" y1="290" x2="600" y2="320" stroke="#2196f3" stroke-width="2"/>
  <polygon points="600,320 594,310 606,310" fill="#2196f3"/>

  <!-- Metadata Filters -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#161b22" stroke="#f44336" stroke-width="2"/>
    <text x="100" y="22" fill="#f44336" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🏷️</text>
    <text x="100" y="40" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Metadata Filter</text>
  </g>

  <g transform="translate(500, 320)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#161b22" stroke="#f44336" stroke-width="2"/>
    <text x="100" y="22" fill="#f44336" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🏷️</text>
    <text x="100" y="40" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Metadata Filter</text>
  </g>

  <!-- Arrows to fusion -->
  <path d="M 200 370 L 200 400 L 400 400 L 400 410" stroke="#8b949e" stroke-width="2" fill="none"/>
  <path d="M 600 370 L 600 400 L 400 400" stroke="#8b949e" stroke-width="2" fill="none"/>
  <polygon points="400,410 394,400 406,400" fill="#8b949e"/>

  <!-- Fusion -->
  <g transform="translate(280, 410)">
    <rect x="0" y="0" width="240" height="45" rx="10" fill="url(#fusionGrad)" filter="url(#shadow)"/>
    <text x="120" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🔀</text>
    <text x="120" y="38" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Fusion / Final Ranking</text>
  </g>

  <!-- Arrow to LLM -->
  <line x1="400" y1="455" x2="400" y2="475" stroke="#9c27b0" stroke-width="2"/>

  <!-- Top Documents -->
  <g transform="translate(300, 460)">
    <rect x="0" y="0" width="200" height="35" rx="6" fill="url(#llmGrad)" filter="url(#shadow)"/>
    <text x="100" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📄 Top Documents → LLM</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="180" height="55" rx="6" fill="#21262d"/>
    <text x="90" y="18" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Pipeline Components</text>
    <circle cx="20" cy="32" r="5" fill="#4caf50"/>
    <text x="30" y="36" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Keyword (BM25)</text>
    <circle cx="100" cy="32" r="5" fill="#2196f3"/>
    <text x="110" y="36" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Semantic</text>
    <circle cx="20" cy="47" r="5" fill="#f44336"/>
    <text x="30" y="51" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Filter</text>
    <circle cx="100" cy="47" r="5" fill="#9c27b0"/>
    <text x="110" y="51" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Fusion</text>
  </g>
</svg>