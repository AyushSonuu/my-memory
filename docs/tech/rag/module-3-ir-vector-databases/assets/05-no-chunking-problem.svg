<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#795548"/>
      <stop offset="100%" style="stop-color:#5d4037"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadowNo">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="350" fill="#0d1117"/>

  <!-- Title -->
  <text x="375" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">The Problem: Indexing Without Chunking</text>

  <!-- Knowledge Base -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="#161b22" stroke="#795548" stroke-width="2" filter="url(#shadowNo)"/>
    <text x="90" y="25" fill="#a1887f" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📚 Knowledge Base</text>
    <text x="90" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">1,000 Books</text>

    <!-- Book icons -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="25" height="35" rx="2" fill="url(#bookGrad)"/>
      <rect x="30" y="0" width="25" height="35" rx="2" fill="url(#bookGrad)"/>
      <rect x="60" y="0" width="25" height="35" rx="2" fill="url(#bookGrad)"/>
      <rect x="90" y="0" width="25" height="35" rx="2" fill="url(#bookGrad)"/>
      <text x="130" y="22" fill="#8b949e" font-family="Inter, sans-serif" font-size="14">...</text>
    </g>

    <text x="90" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Each book = 1 vector</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(230, 130)">
    <path d="M 0 0 L 80 0" stroke="#ff9800" stroke-width="3"/>
    <polygon points="80,0 70,-6 70,6" fill="#ff9800"/>
    <text x="40" y="-10" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Embed</text>
  </g>

  <!-- Vector representation -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadowNo)"/>
    <text x="90" y="25" fill="#ce93d8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📊 Result</text>
    <text x="90" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">1,000 Vectors</text>

    <!-- Vector visualization -->
    <rect x="25" y="60" width="130" height="40" rx="4" fill="url(#vectorGrad)" opacity="0.5"/>
    <text x="90" y="85" fill="#fff" font-family="monospace" font-size="9" text-anchor="middle">[0.1, 0.4, 0.3, 0.2, 0.9, ...]</text>

    <text x="90" y="125" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Entire book → 1 vector 😬</text>
  </g>

  <!-- Problems -->
  <g transform="translate(530, 60)">
    <rect x="0" y="0" width="190" height="140" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadowNo)"/>
    <text x="95" y="25" fill="#f44336" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚠️ Problems</text>

    <text x="15" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">❌ Blurry vectors — averages</text>
    <text x="15" y="67" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">   all topics together</text>

    <text x="15" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">❌ Can't represent specific</text>
    <text x="15" y="107" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">   chapters/pages sharply</text>

    <text x="15" y="130" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">❌ Fills LLM context window</text>
  </g>

  <!-- Bottom: The Fix -->
  <g transform="translate(100, 230)">
    <rect x="0" y="0" width="550" height="100" rx="10" fill="#21262d" stroke="#4caf50" stroke-width="2"/>
    <text x="275" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✅ The Solution: CHUNK!</text>

    <text x="275" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">1,000 books → 1,000,000 paragraphs → 1,000,000 vectors</text>

    <text x="275" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Each vector = sharp, topic-specific representation</text>
    <text x="275" y="92" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Vector DBs scale easily to millions of vectors!</text>
  </g>
</svg>