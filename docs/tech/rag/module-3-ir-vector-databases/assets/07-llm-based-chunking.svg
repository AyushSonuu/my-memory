<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380">
  <defs>
    <linearGradient id="docGradLlm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#795548"/>
      <stop offset="100%" style="stop-color:#5d4037"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadowLlm">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="380" fill="#0d1117"/>

  <!-- Title -->
  <text x="375" y="28" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LLM-Based Chunking</text>

  <!-- Document -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="180" height="220" rx="10" fill="#161b22" stroke="#795548" stroke-width="2" filter="url(#shadowLlm)"/>
    <rect x="0" y="0" width="180" height="35" rx="10" fill="url(#docGradLlm)"/>
    <text x="90" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📄 Document</text>

    <!-- Document lines -->
    <rect x="15" y="50" width="150" height="8" rx="2" fill="#30363d"/>
    <rect x="15" y="65" width="140" height="8" rx="2" fill="#30363d"/>
    <rect x="15" y="80" width="145" height="8" rx="2" fill="#30363d"/>
    <rect x="15" y="95" width="130" height="8" rx="2" fill="#30363d"/>
    <rect x="15" y="115" width="150" height="8" rx="2" fill="#30363d"/>
    <rect x="15" y="130" width="135" height="8" rx="2" fill="#30363d"/>
    <rect x="15" y="145" width="148" height="8" rx="2" fill="#30363d"/>
    <rect x="15" y="165" width="150" height="8" rx="2" fill="#30363d"/>
    <rect x="15" y="180" width="140" height="8" rx="2" fill="#30363d"/>
    <rect x="15" y="195" width="120" height="8" rx="2" fill="#30363d"/>
  </g>

  <!-- Arrow to LLM -->
  <g transform="translate(230, 165)">
    <path d="M 0 0 L 60 0" stroke="#ff9800" stroke-width="3"/>
    <polygon points="60,0 50,-6 50,6" fill="#ff9800"/>
  </g>

  <!-- LLM -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="150" height="130" rx="12" fill="url(#llmGrad)" filter="url(#shadowLlm)"/>
    <text x="75" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">🤖</text>
    <text x="75" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LLM</text>

    <rect x="15" y="75" width="120" height="40" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="75" y="92" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"Keep concepts together,</text>
    <text x="75" y="104" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">split on new topics"</text>
  </g>

  <!-- Arrow to Chunks -->
  <g transform="translate(460, 165)">
    <path d="M 0 0 L 60 0" stroke="#4caf50" stroke-width="3"/>
    <polygon points="60,0 50,-6 50,6" fill="#4caf50"/>
  </g>

  <!-- Output Chunks -->
  <g transform="translate(530, 60)">
    <rect x="0" y="0" width="180" height="220" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowLlm)"/>
    <text x="90" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Chunked Output</text>

    <!-- Chunk 1 -->
    <rect x="15" y="40" width="150" height="50" rx="6" fill="#2196f3" opacity="0.3"/>
    <text x="90" y="58" fill="#58a6ff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Chunk 1</text>
    <text x="90" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Concept A</text>

    <!-- Chunk 2 -->
    <rect x="15" y="100" width="150" height="50" rx="6" fill="#ff9800" opacity="0.3"/>
    <text x="90" y="118" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Chunk 2</text>
    <text x="90" y="135" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Concept B</text>

    <!-- Chunk 3 -->
    <rect x="15" y="160" width="150" height="50" rx="6" fill="#4caf50" opacity="0.3"/>
    <text x="90" y="178" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Chunk 3</text>
    <text x="90" y="195" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Concept C</text>
  </g>

  <!-- Benefits box -->
  <g transform="translate(40, 300)">
    <rect x="0" y="0" width="670" height="65" rx="8" fill="#21262d"/>
    <text x="335" y="20" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">How It Works</text>
    <text x="335" y="40" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">• Prompt LLM with document + chunking instructions (keep concepts together, break on new topics)</text>
    <text x="335" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">• LLM generates chunks like any other text output • High performing, increasingly economical</text>
  </g>
</svg>