<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <linearGradient id="biGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="colbertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadowArch">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Three Architectures for Semantic Search</text>

  <!-- BI-ENCODER -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="230" height="180" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowArch)"/>
    <rect x="0" y="0" width="230" height="35" rx="10" fill="url(#biGrad)"/>
    <text x="115" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Bi-Encoder (Default)</text>

    <!-- Docs embedded separately -->
    <rect x="20" y="50" width="80" height="25" rx="4" fill="#21262d"/>
    <text x="60" y="67" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Doc → [vec]</text>

    <rect x="20" y="80" width="80" height="25" rx="4" fill="#21262d"/>
    <text x="60" y="97" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Doc → [vec]</text>

    <text x="60" y="120" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Pre-computed ✓</text>

    <!-- Prompt embedded separately -->
    <rect x="130" y="65" width="80" height="25" rx="4" fill="#ff9800"/>
    <text x="170" y="82" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Prompt → [vec]</text>

    <text x="170" y="110" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">At query time</text>

    <!-- ANN comparison -->
    <rect x="60" y="135" width="110" height="30" rx="6" fill="#4caf50"/>
    <text x="115" y="155" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ANN Search → Top K</text>
  </g>

  <!-- CROSS-ENCODER -->
  <g transform="translate(285, 60)">
    <rect x="0" y="0" width="230" height="180" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadowArch)"/>
    <rect x="0" y="0" width="230" height="35" rx="10" fill="url(#crossGrad)"/>
    <text x="115" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cross-Encoder (Quality)</text>

    <!-- Concatenation -->
    <rect x="20" y="50" width="190" height="30" rx="4" fill="#21262d"/>
    <text x="115" y="70" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">[Prompt + Doc] concatenated</text>

    <!-- Through model -->
    <line x1="115" y1="80" x2="115" y2="100" stroke="#8b949e" stroke-width="2"/>
    <polygon points="115,100 109,90 121,90" fill="#8b949e"/>

    <rect x="50" y="100" width="130" height="30" rx="6" fill="#f44336"/>
    <text x="115" y="120" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cross-Encoder Model</text>

    <!-- Output score -->
    <line x1="115" y1="130" x2="115" y2="145" stroke="#8b949e" stroke-width="2"/>
    <polygon points="115,145 109,135 121,135" fill="#8b949e"/>

    <rect x="60" y="145" width="110" height="20" rx="4" fill="#21262d"/>
    <text x="115" y="160" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Score: 0.72</text>
  </g>

  <!-- COLBERT -->
  <g transform="translate(540, 60)">
    <rect x="0" y="0" width="230" height="180" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadowArch)"/>
    <rect x="0" y="0" width="230" height="35" rx="10" fill="url(#colbertGrad)"/>
    <text x="115" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ColBERT (Balanced)</text>

    <!-- Doc tokens -->
    <rect x="15" y="50" width="90" height="50" rx="4" fill="#21262d"/>
    <text x="60" y="68" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Doc → N vectors</text>
    <text x="60" y="82" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">(1 per token)</text>
    <text x="60" y="94" fill="#58a6ff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Pre-computed ✓</text>

    <!-- Prompt tokens -->
    <rect x="125" y="50" width="90" height="50" rx="4" fill="#ff9800"/>
    <text x="170" y="68" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Prompt → M vecs</text>
    <text x="170" y="82" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">(1 per token)</text>
    <text x="170" y="94" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">At query time</text>

    <!-- MaxSim -->
    <rect x="40" y="115" width="150" height="50" rx="6" fill="#9c27b0"/>
    <text x="115" y="135" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">MaxSim Scoring</text>
    <text x="115" y="150" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Each prompt token finds</text>
    <text x="115" y="160" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">best doc token match</text>
  </g>

  <!-- Comparison Table -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="700" height="140" rx="10" fill="#21262d"/>

    <!-- Headers -->
    <text x="100" y="25" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Architecture</text>
    <text x="250" y="25" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Speed</text>
    <text x="380" y="25" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Quality</text>
    <text x="520" y="25" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Storage</text>
    <text x="630" y="25" fill="#e6edf3" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Use Case</text>

    <line x1="20" y1="35" x2="680" y2="35" stroke="#30363d" stroke-width="1"/>

    <!-- Bi-Encoder Row -->
    <circle cx="30" cy="55" r="6" fill="#4caf50"/>
    <text x="100" y="60" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Bi-Encoder</text>
    <text x="250" y="60" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">⚡ Fastest</text>
    <text x="380" y="60" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Good</text>
    <text x="520" y="60" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">1 vec/doc</text>
    <text x="630" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Default search</text>

    <!-- Cross-Encoder Row -->
    <circle cx="30" cy="85" r="6" fill="#f44336"/>
    <text x="100" y="90" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cross-Encoder</text>
    <text x="250" y="90" fill="#f44336" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">🐢 Slowest</text>
    <text x="380" y="90" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Best</text>
    <text x="520" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">N/A (no pre-embed)</text>
    <text x="630" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Reranking</text>

    <!-- ColBERT Row -->
    <circle cx="30" cy="115" r="6" fill="#9c27b0"/>
    <text x="100" y="120" fill="#9c27b0" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ColBERT</text>
    <text x="250" y="120" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">⚡ Fast-ish</text>
    <text x="380" y="120" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Near-best</text>
    <text x="520" y="120" fill="#f44336" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">N vecs/doc</text>
    <text x="630" y="120" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">High-precision</text>
  </g>

  <!-- Key Insight -->
  <g transform="translate(50, 430)">
    <rect x="0" y="0" width="700" height="110" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="350" y="25" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Key Insight: The Trade-off Triangle</text>

    <text x="30" y="50" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">Bi-Encoder:</text>
    <text x="110" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Embed docs once, compare vectors fast. Miss deep interactions.</text>

    <text x="30" y="70" fill="#f44336" font-family="Inter, sans-serif" font-size="10">Cross-Encoder:</text>
    <text x="130" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">See prompt+doc together = rich understanding. But must run for EVERY doc!</text>

    <text x="30" y="90" fill="#9c27b0" font-family="Inter, sans-serif" font-size="10">ColBERT:</text>
    <text x="100" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Token-level vectors = detailed matching. Cost: N vectors per doc (storage explosion).</text>
  </g>
</svg>