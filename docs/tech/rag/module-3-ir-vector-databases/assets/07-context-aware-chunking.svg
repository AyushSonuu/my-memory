<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#607d8b"/>
      <stop offset="100%" style="stop-color:#455a64"/>
    </linearGradient>
    <linearGradient id="ctxLlmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="enhancedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <filter id="shadowCtx">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="28" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Context-Aware Chunking</text>
  <text x="400" y="48" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Add context to chunks so they're interpretable on their own</text>

  <!-- Original Document -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="200" height="180" rx="10" fill="#161b22" stroke="#607d8b" stroke-width="2" filter="url(#shadowCtx)"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="url(#blogGrad)"/>
    <text x="100" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📄 "Reflections on Our App"</text>

    <!-- Chunks without context -->
    <rect x="12" y="45" width="176" height="35" rx="4" fill="#21262d"/>
    <text x="100" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"After six months, we finally</text>
    <text x="100" y="72" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">launched our first app..."</text>

    <rect x="12" y="88" width="176" height="35" rx="4" fill="#21262d"/>
    <text x="100" y="103" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"The biggest lessons were</text>
    <text x="100" y="115" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">around user feedback..."</text>

    <rect x="12" y="131" width="176" height="35" rx="4" fill="#f44336" opacity="0.2"/>
    <text x="100" y="146" fill="#f44336" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"Thanks to Daniel, Sarah,</text>
    <text x="100" y="158" fill="#f44336" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Mike, Chen..." 🤷</text>
  </g>

  <!-- Problem callout -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="200" height="50" rx="6" fill="#f44336" opacity="0.15" stroke="#f44336" stroke-width="1"/>
    <text x="100" y="20" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⚠️ Problem</text>
    <text x="100" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Just names = meaningless chunk!</text>
  </g>

  <!-- Arrow to LLM -->
  <g transform="translate(240, 155)">
    <path d="M 0 0 L 70 0" stroke="#9c27b0" stroke-width="3"/>
    <polygon points="70,0 60,-6 60,6" fill="#9c27b0"/>
  </g>

  <!-- LLM adds context -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="160" height="110" rx="12" fill="url(#ctxLlmGrad)" filter="url(#shadowCtx)"/>
    <text x="80" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">🤖</text>
    <text x="80" y="50" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LLM</text>
    <text x="80" y="70" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Adds context to</text>
    <text x="80" y="85" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">each chunk</text>
    <text x="80" y="100" fill="#ffd54f" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">📝 "context: ..."</text>
  </g>

  <!-- Arrow to Enhanced -->
  <g transform="translate(490, 155)">
    <path d="M 0 0 L 70 0" stroke="#4caf50" stroke-width="3"/>
    <polygon points="70,0 60,-6 60,6" fill="#4caf50"/>
  </g>

  <!-- Enhanced Chunks -->
  <g transform="translate(570, 70)">
    <rect x="0" y="0" width="200" height="240" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowCtx)"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="url(#enhancedGrad)"/>
    <text x="100" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✅ Enhanced Chunks</text>

    <!-- Chunk 1 with context -->
    <rect x="12" y="45" width="176" height="55" rx="4" fill="#21262d"/>
    <text x="100" y="60" fill="#4caf50" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">context: app launch title</text>
    <text x="100" y="75" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"After six months, we finally</text>
    <text x="100" y="87" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">launched our first app..."</text>

    <!-- Chunk 2 with context -->
    <rect x="12" y="108" width="176" height="55" rx="4" fill="#21262d"/>
    <text x="100" y="123" fill="#4caf50" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">context: key development lessons</text>
    <text x="100" y="138" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"The biggest lessons were</text>
    <text x="100" y="150" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">around user feedback..."</text>

    <!-- Chunk 3 with context (fixed!) -->
    <rect x="12" y="171" width="176" height="55" rx="4" fill="#4caf50" opacity="0.15"/>
    <text x="100" y="186" fill="#4caf50" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">context: list of supporters</text>
    <text x="100" y="201" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"Thanks to Daniel, Sarah,</text>
    <text x="100" y="213" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Mike, Chen..." ✅</text>
  </g>

  <!-- Benefits -->
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="740" height="100" rx="10" fill="#21262d"/>
    <text x="370" y="22" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Why Context-Aware Chunking?</text>

    <g transform="translate(30, 40)">
      <circle cx="8" cy="8" r="6" fill="#4caf50"/>
      <text x="22" y="12" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Better vectorization → improved search relevancy</text>
    </g>

    <g transform="translate(30, 60)">
      <circle cx="8" cy="8" r="6" fill="#4caf50"/>
      <text x="22" y="12" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Better LLM understanding when chunk is retrieved</text>
    </g>

    <g transform="translate(30, 80)">
      <circle cx="8" cy="8" r="6" fill="#4caf50"/>
      <text x="22" y="12" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">No impact on search speed (preprocessing only)</text>
    </g>

    <g transform="translate(400, 40)">
      <circle cx="8" cy="8" r="6" fill="#ff9800"/>
      <text x="22" y="12" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">Trade-off: LLM processes entire KB chunk by chunk</text>
    </g>

    <g transform="translate(400, 60)">
      <circle cx="8" cy="8" r="6" fill="#4caf50"/>
      <text x="22" y="12" fill="#ffd54f" font-family="Inter, sans-serif" font-size="10" font-weight="bold">⭐ Works ON TOP of any chunking strategy!</text>
    </g>
  </g>
</svg>