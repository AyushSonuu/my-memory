<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <linearGradient id="crossGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="llmRerankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <filter id="shadowRR">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Reranker Types: Cross-Encoder vs LLM-Based</text>

  <!-- Cross-Encoder Reranker -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="320" height="280" rx="12" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadowRR)"/>
    <rect x="0" y="0" width="320" height="40" rx="12" fill="url(#crossGrad3)"/>
    <text x="160" y="27" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cross-Encoder Reranker</text>

    <!-- How it works -->
    <text x="20" y="65" fill="#58a6ff" font-family="Inter, sans-serif" font-size="10" font-weight="bold">How it works:</text>

    <rect x="20" y="75" width="280" height="45" rx="4" fill="#21262d"/>
    <text x="160" y="92" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">[Prompt] + [Doc] → Cross-Encoder</text>
    <text x="160" y="110" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">→ Relevance score (0.0 to 1.0)</text>

    <!-- Pros -->
    <text x="20" y="140" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Pros:</text>
    <text x="20" y="158" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✓ Deep contextual understanding</text>
    <text x="20" y="175" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✓ Purpose-built for relevance scoring</text>
    <text x="20" y="192" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✓ Well-studied, proven approach</text>

    <!-- Cons -->
    <text x="20" y="218" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Cons:</text>
    <text x="20" y="236" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✗ Still relatively slow per doc</text>
    <text x="20" y="253" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✗ Limited to small candidate sets</text>

    <!-- When to use -->
    <rect x="20" y="265" width="280" height="25" rx="4" fill="#9c27b0"/>
    <text x="160" y="282" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Best choice: Default reranking approach</text>
  </g>

  <!-- LLM-Based Reranker -->
  <g transform="translate(430, 60)">
    <rect x="0" y="0" width="320" height="280" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowRR)"/>
    <rect x="0" y="0" width="320" height="40" rx="12" fill="url(#llmRerankGrad)"/>
    <text x="160" y="27" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LLM-Based Reranker</text>

    <!-- How it works -->
    <text x="20" y="65" fill="#58a6ff" font-family="Inter, sans-serif" font-size="10" font-weight="bold">How it works:</text>

    <rect x="20" y="75" width="280" height="45" rx="4" fill="#21262d"/>
    <text x="160" y="92" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">[Prompt] + [Doc] → LLM</text>
    <text x="160" y="110" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">→ LLM outputs relevance score</text>

    <!-- Pros -->
    <text x="20" y="140" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Pros:</text>
    <text x="20" y="158" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✓ Potentially more nuanced reasoning</text>
    <text x="20" y="175" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✓ Can use latest LLM capabilities</text>
    <text x="20" y="192" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✓ Emerging/promising approach</text>

    <!-- Cons -->
    <text x="20" y="218" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Cons:</text>
    <text x="20" y="236" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✗ Same scaling limits as cross-encoder</text>
    <text x="20" y="253" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">✗ More expensive (LLM API calls)</text>

    <!-- When to use -->
    <rect x="20" y="265" width="280" height="25" rx="4" fill="#4caf50"/>
    <text x="160" y="282" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Use when: Need advanced reasoning</text>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(200, 355)">
    <text x="200" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Both approaches: only viable AFTER initial search narrows candidates. Cannot replace bi-encoder for full KB search.</text>
  </g>
</svg>