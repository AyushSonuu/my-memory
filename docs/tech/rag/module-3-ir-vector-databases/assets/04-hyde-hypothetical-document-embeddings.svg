<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <rect width="700" height="420" fill="#1a1a2e" rx="12"/>
  
  <defs>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#e0e0e0">HyDE: Hypothetical Document Embeddings</text>
  
  <!-- Step 1: Original prompt -->
  <rect x="30" y="50" width="180" height="70" rx="8" fill="rgba(244,67,54,0.1)" stroke="#f44336" stroke-width="1.5"/>
  <text x="120" y="70" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#f44336">1. User Prompt</text>
  <text x="40" y="88" font-family="system-ui" font-size="9" fill="#ef9a9a">"My shoulder hurts and</text>
  <text x="40" y="101" font-family="system-ui" font-size="9" fill="#ef9a9a">I have numbness in my</text>
  <text x="40" y="114" font-family="system-ui" font-size="9" fill="#ef9a9a">thumb. What should I do?"</text>
  
  <!-- Arrow to LLM -->
  <path d="M 210 85 L 260 85" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
  
  <!-- Step 2: LLM generates hypothetical doc -->
  <rect x="265" y="45" width="200" height="100" rx="8" fill="rgba(255,152,0,0.12)" stroke="#ff9800" stroke-width="1.5"/>
  <text x="365" y="65" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#ff9800">2. LLM Generates Hypothetical Doc</text>
  <text x="275" y="83" font-family="system-ui" font-size="8.5" fill="#ffcc80">"Shoulder pain with numbness in</text>
  <text x="275" y="95" font-family="system-ui" font-size="8.5" fill="#ffcc80">thumb and index finger following</text>
  <text x="275" y="107" font-family="system-ui" font-size="8.5" fill="#ffcc80">acute trauma can indicate cervical</text>
  <text x="275" y="119" font-family="system-ui" font-size="8.5" fill="#ffcc80">radiculopathy or brachial plexus</text>
  <text x="275" y="131" font-family="system-ui" font-size="8.5" fill="#ffcc80">injury. Treatment includes..."</text>
  
  <!-- Arrow to embedding -->
  <path d="M 465 95 L 510 95" stroke="#2196f3" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
  
  <!-- Step 3: Embed hypothetical doc -->
  <rect x="515" y="60" width="160" height="70" rx="8" fill="rgba(33,150,243,0.12)" stroke="#2196f3" stroke-width="1.5"/>
  <text x="595" y="80" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2196f3">3. Embed Hypo Doc</text>
  <text x="595" y="100" text-anchor="middle" font-family="system-ui" font-size="10" fill="#64b5f6">[0.5, 0.4, 0.03, 0.2]</text>
  <text x="595" y="118" text-anchor="middle" font-family="system-ui" font-size="9" fill="#90caf9">↓ Use THIS vector for search</text>
  
  <!-- Comparison section -->
  <rect x="30" y="175" width="640" height="150" rx="8" fill="rgba(255,255,255,0.03)" stroke="#555" stroke-width="1"/>
  <text x="350" y="198" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#e0e0e0">Why HyDE Works: Apples to Apples</text>
  
  <!-- Normal search (apples to oranges) -->
  <rect x="50" y="210" width="270" height="95" rx="6" fill="rgba(244,67,54,0.06)" stroke="#f44336" stroke-width="1"/>
  <text x="185" y="230" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#f44336">❌ Normal Search</text>
  <rect x="70" y="240" width="90" height="30" rx="4" fill="rgba(255,152,0,0.2)" stroke="#ff9800" stroke-width="1"/>
  <text x="115" y="259" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ffcc80">Question</text>
  <text x="185" y="260" text-anchor="middle" font-family="system-ui" font-size="14" fill="#666">↔</text>
  <rect x="200" y="240" width="100" height="30" rx="4" fill="rgba(33,150,243,0.2)" stroke="#2196f3" stroke-width="1"/>
  <text x="250" y="259" text-anchor="middle" font-family="system-ui" font-size="9" fill="#90caf9">Documents</text>
  <text x="185" y="290" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ef9a9a">Matching dissimilar text types</text>
  
  <!-- HyDE search (apples to apples) -->
  <rect x="380" y="210" width="270" height="95" rx="6" fill="rgba(76,175,80,0.06)" stroke="#4caf50" stroke-width="1"/>
  <text x="515" y="230" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#4caf50">✅ HyDE Search</text>
  <rect x="400" y="240" width="105" height="30" rx="4" fill="rgba(76,175,80,0.2)" stroke="#4caf50" stroke-width="1"/>
  <text x="452" y="259" text-anchor="middle" font-family="system-ui" font-size="9" fill="#a5d6a7">Hypo Document</text>
  <text x="520" y="260" text-anchor="middle" font-family="system-ui" font-size="14" fill="#666">↔</text>
  <rect x="535" y="240" width="100" height="30" rx="4" fill="rgba(33,150,243,0.2)" stroke="#2196f3" stroke-width="1"/>
  <text x="585" y="259" text-anchor="middle" font-family="system-ui" font-size="9" fill="#90caf9">Documents</text>
  <text x="515" y="290" text-anchor="middle" font-family="system-ui" font-size="9" fill="#a5d6a7">Matching similar text types!</text>
  
  <!-- Tradeoffs -->
  <rect x="30" y="340" width="640" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="#555" stroke-width="1"/>
  <text x="120" y="362" text-anchor="middle" font-family="system-ui" font-size="10" fill="#4caf50">✅ Better retrieval quality</text>
  <text x="350" y="362" text-anchor="middle" font-family="system-ui" font-size="10" fill="#ff9800">⚠️ Added latency (LLM call)</text>
  <text x="570" y="362" text-anchor="middle" font-family="system-ui" font-size="10" fill="#ff9800">⚠️ Added cost (generation)</text>
  <text x="350" y="385" text-anchor="middle" font-family="system-ui" font-size="10" fill="#aaa">Use when retrieval quality matters more than speed — experiment and measure!</text>
</svg>
