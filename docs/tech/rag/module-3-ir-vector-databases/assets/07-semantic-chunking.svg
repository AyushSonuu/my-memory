<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
  <defs>
    <linearGradient id="sentenceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="chunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <filter id="shadowSem">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="375" y="28" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Semantic Chunking: How It Works</text>

  <!-- Document flow (top) -->
  <g transform="translate(50, 55)">
    <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">Document sentences:</text>

    <!-- Sentences -->
    <rect x="0" y="12" width="120" height="30" rx="4" fill="#2196f3" opacity="0.7"/>
    <text x="60" y="32" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Sentence 1</text>

    <rect x="130" y="12" width="120" height="30" rx="4" fill="#2196f3" opacity="0.7"/>
    <text x="190" y="32" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Sentence 2</text>

    <rect x="260" y="12" width="120" height="30" rx="4" fill="#2196f3" opacity="0.7"/>
    <text x="320" y="32" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Sentence 3</text>

    <rect x="390" y="12" width="120" height="30" rx="4" fill="#ff9800" opacity="0.7"/>
    <text x="450" y="32" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Sentence 4</text>

    <rect x="520" y="12" width="120" height="30" rx="4" fill="#ff9800" opacity="0.7"/>
    <text x="580" y="32" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Sentence 5</text>
  </g>

  <!-- Algorithm steps -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="300" height="130" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowSem)"/>
    <text x="150" y="22" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">The Algorithm</text>

    <text x="15" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">1. Vectorize current chunk</text>
    <text x="15" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">2. Vectorize next sentence</text>
    <text x="15" y="79" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">3. Calculate cosine distance</text>
    <text x="15" y="96" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">4. Distance &lt; threshold → same chunk</text>
    <text x="15" y="113" fill="#f44336" font-family="Inter, sans-serif" font-size="10">5. Distance &gt; threshold → NEW chunk</text>
  </g>

  <!-- Distance graph -->
  <g transform="translate(380, 120)">
    <rect x="0" y="0" width="320" height="130" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadowSem)"/>
    <text x="160" y="22" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Distance Over Time</text>

    <!-- Graph axes -->
    <line x1="30" y1="110" x2="290" y2="110" stroke="#30363d" stroke-width="1"/>
    <line x1="30" y1="40" x2="30" y2="110" stroke="#30363d" stroke-width="1"/>

    <!-- Threshold line -->
    <line x1="30" y1="65" x2="290" y2="65" stroke="#f44336" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="295" y="68" fill="#f44336" font-family="Inter, sans-serif" font-size="8">threshold</text>

    <!-- Distance curve -->
    <path d="M 30 100 Q 60 80, 90 95 Q 120 105, 150 70 Q 180 50, 210 90 Q 240 100, 270 55"
          stroke="#58a6ff" stroke-width="2" fill="none"/>

    <!-- Split markers -->
    <line x1="150" y1="65" x2="150" y2="110" stroke="#4caf50" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="150" y="122" fill="#4caf50" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">split!</text>

    <line x1="270" y1="55" x2="270" y2="110" stroke="#4caf50" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="270" y="122" fill="#4caf50" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">split!</text>

    <!-- Chunk labels -->
    <text x="90" y="105" fill="#2196f3" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Chunk 1</text>
    <text x="210" y="105" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Chunk 2</text>
  </g>

  <!-- Result -->
  <g transform="translate(50, 270)">
    <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">Result: Variable-sized chunks that follow author's train of thought</text>

    <!-- Chunk 1 -->
    <rect x="0" y="15" width="280" height="45" rx="6" fill="#2196f3" opacity="0.3" stroke="#2196f3" stroke-width="2"/>
    <text x="140" y="35" fill="#58a6ff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Chunk 1 (Sentences 1-3)</text>
    <text x="140" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Similar meaning → grouped together</text>

    <!-- Chunk 2 -->
    <rect x="300" y="15" width="200" height="45" rx="6" fill="#ff9800" opacity="0.3" stroke="#ff9800" stroke-width="2"/>
    <text x="400" y="35" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Chunk 2 (Sentences 4-5)</text>
    <text x="400" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">New topic → new chunk</text>
  </g>

  <!-- Pros/Cons -->
  <g transform="translate(50, 345)">
    <text x="0" y="0" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">✅ Smart boundaries, follows author's logic</text>
    <text x="320" y="0" fill="#f44336" font-family="Inter, sans-serif" font-size="10">❌ Computationally expensive (vector calc per sentence)</text>
  </g>

  <!-- Bottom insight -->
  <text x="375" y="385" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Handles tangents within paragraphs and ideas that span multiple paragraphs</text>
</svg>