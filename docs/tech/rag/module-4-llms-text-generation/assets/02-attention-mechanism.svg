<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="highAttn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="medAttn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadowAttn">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Attention Mechanism: "Which tokens should impact MY meaning?"</text>

  <!-- Sentence display -->
  <g transform="translate(50, 55)">
    <text x="350" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Sentence: "the brown dog sat next to the red fox"</text>

    <!-- Token boxes -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="70" height="30" rx="4" fill="#21262d"/>
      <text x="35" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">the</text>

      <rect x="80" y="0" width="70" height="30" rx="4" fill="#4caf50"/>
      <text x="115" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">brown</text>

      <rect x="160" y="0" width="70" height="30" rx="4" fill="#9c27b0"/>
      <text x="195" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">dog</text>

      <rect x="240" y="0" width="70" height="30" rx="4" fill="#ff9800"/>
      <text x="275" y="20" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">sat</text>

      <rect x="320" y="0" width="70" height="30" rx="4" fill="#21262d"/>
      <text x="355" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">next</text>

      <rect x="400" y="0" width="50" height="30" rx="4" fill="#21262d"/>
      <text x="425" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">to</text>

      <rect x="460" y="0" width="70" height="30" rx="4" fill="#21262d"/>
      <text x="495" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">the</text>

      <rect x="540" y="0" width="70" height="30" rx="4" fill="#21262d"/>
      <text x="575" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">red</text>

      <rect x="620" y="0" width="70" height="30" rx="4" fill="#21262d"/>
      <text x="655" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">fox</text>
    </g>
  </g>

  <!-- Attention from "dog" perspective -->
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="700" height="130" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadowAttn)"/>
    <text x="350" y="25" fill="#9c27b0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">From "dog"'s perspective: Which tokens matter most to MY meaning?</text>

    <!-- Attention bars -->
    <g transform="translate(30, 45)">
      <text x="0" y="15" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">brown</text>
      <rect x="80" y="0" width="350" height="25" rx="4" fill="#4caf50"/>
      <text x="90" y="17" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold">70% attention — "What kind of dog?"</text>

      <text x="0" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">sat</text>
      <rect x="80" y="35" width="100" height="25" rx="4" fill="#ff9800"/>
      <text x="90" y="52" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold">20%</text>
      <text x="190" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">"What did dog do?"</text>

      <text x="0" y="85" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">others</text>
      <rect x="80" y="70" width="50" height="25" rx="4" fill="#21262d"/>
      <text x="90" y="87" fill="#8b949e" font-family="Inter, sans-serif" font-size="10">10%</text>
      <text x="145" y="87" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">distributed across rest</text>
    </g>
  </g>

  <!-- Multiple Attention Heads -->
  <g transform="translate(50, 285)">
    <text x="350" y="0" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Multiple Attention Heads = Multiple Perspectives</text>

    <!-- Head 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="220" height="100" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="1"/>
      <text x="110" y="20" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Head 1: Object Relations</text>
      <text x="20" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">"fox" → focuses on "red"</text>
      <text x="20" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">"dog" → focuses on "brown"</text>
      <text x="20" y="82" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8">What describes each object?</text>
    </g>

    <!-- Head 2 -->
    <g transform="translate(240, 20)">
      <rect x="0" y="0" width="220" height="100" rx="8" fill="#161b22" stroke="#ff9800" stroke-width="1"/>
      <text x="110" y="20" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Head 2: Spatial Relations</text>
      <text x="20" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">"fox" → focuses on "sat", "next"</text>
      <text x="20" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">"dog" → focuses on "sat", "to"</text>
      <text x="20" y="82" fill="#ff9800" font-family="Inter, sans-serif" font-size="8">Where are things positioned?</text>
    </g>

    <!-- Head 3+ -->
    <g transform="translate(480, 20)">
      <rect x="0" y="0" width="220" height="100" rx="8" fill="#161b22" stroke="#9c27b0" stroke-width="1"/>
      <text x="110" y="20" fill="#9c27b0" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Heads 3-100+: Abstract</text>
      <text x="20" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Not human-defined rules!</text>
      <text x="20" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Complex patterns learned</text>
      <text x="20" y="82" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8">during training</text>
    </g>
  </g>

  <!-- Bottom note -->
  <g transform="translate(50, 405)">
    <rect x="0" y="0" width="700" height="35" rx="6" fill="#21262d"/>
    <text x="350" y="15" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Small models: 8-16 attention heads | Large models: 100+ attention heads</text>
    <text x="350" y="28" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Each token tracks relationships with ALL other tokens, from MANY different perspectives</text>
  </g>
</svg>
