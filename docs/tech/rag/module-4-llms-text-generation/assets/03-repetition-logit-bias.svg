<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380">
  <defs>
    <linearGradient id="repGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="biasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadowSpec">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="380" fill="#0d1117"/>

  <!-- Title -->
  <text x="425" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Token-Specific Strategies: Repetition Penalty &amp; Logit Bias</text>

  <!-- Repetition Penalty -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="380" height="160" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadowSpec)"/>
    <rect x="0" y="0" width="380" height="35" rx="10" fill="url(#repGrad)"/>
    <rect x="0" y="23" width="380" height="12" fill="url(#repGrad)"/>
    <text x="190" y="25" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Repetition Penalty</text>

    <text x="190" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Reduce probability of already-used tokens</text>

    <!-- Example -->
    <g transform="translate(20, 70)">
      <text x="0" y="0" fill="#58a6ff" font-family="Inter, sans-serif" font-size="9">Prompt: "The brown dog jumped over the..."</text>

      <text x="0" y="25" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">dog: 12%</text>
      <rect x="60" y="15" width="60" height="14" rx="2" fill="#21262d"/>
      <text x="130" y="25" fill="#f44336" font-family="Inter, sans-serif" font-size="8">→ 6% (penalized!)</text>

      <text x="0" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">fence: 32%</text>
      <rect x="60" y="35" width="160" height="14" rx="2" fill="#4caf50"/>
      <text x="230" y="45" fill="#4caf50" font-family="Inter, sans-serif" font-size="8">→ unchanged</text>
    </g>

    <g transform="translate(20, 130)">
      <text x="0" y="0" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" font-weight="bold">Prevents:</text>
      <text x="55" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">loops, repeated phrases, overused words</text>
    </g>
  </g>

  <!-- Logit Bias -->
  <g transform="translate(440, 55)">
    <rect x="0" y="0" width="380" height="160" rx="10" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadowSpec)"/>
    <rect x="0" y="0" width="380" height="35" rx="10" fill="url(#biasGrad)"/>
    <rect x="0" y="23" width="380" height="12" fill="url(#biasGrad)"/>
    <text x="190" y="25" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Logit Bias</text>

    <text x="190" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Permanently adjust specific token probabilities</text>

    <!-- Example -->
    <g transform="translate(20, 70)">
      <text x="0" y="0" fill="#58a6ff" font-family="Inter, sans-serif" font-size="9">Filter profanity or boost categories:</text>

      <text x="0" y="25" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">"badword": 5%</text>
      <rect x="90" y="15" width="25" height="14" rx="2" fill="#f44336"/>
      <text x="125" y="25" fill="#f44336" font-family="Inter, sans-serif" font-size="8">→ 0% (blocked!)</text>

      <text x="0" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">"positive": 8%</text>
      <rect x="90" y="35" width="80" height="14" rx="2" fill="#4caf50"/>
      <text x="180" y="45" fill="#4caf50" font-family="Inter, sans-serif" font-size="8">→ 20% (boosted!)</text>
    </g>

    <g transform="translate(20, 130)">
      <text x="0" y="0" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8" font-weight="bold">Use cases:</text>
      <text x="65" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">content filtering, classifier output control</text>
    </g>
  </g>

  <!-- Practical API Example -->
  <g transform="translate(30, 235)">
    <rect x="0" y="0" width="790" height="130" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="395" y="25" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Practical API Example</text>

    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="350" height="70" rx="6" fill="#0d1117"/>
      <text x="10" y="18" fill="#c792ea" font-family="JetBrains Mono, monospace" font-size="9">payload = {</text>
      <text x="20" y="32" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="9">"temperature": <tspan fill="#f78c6c">0.8</tspan>,</text>
      <text x="20" y="46" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="9">"top_p": <tspan fill="#f78c6c">0.9</tspan>,</text>
      <text x="20" y="60" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="9">"repetition_penalty": <tspan fill="#f78c6c">1.2</tspan></text>
    </g>

    <g transform="translate(410, 45)">
      <text x="0" y="15" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">temperature: 0.8</text>
      <text x="120" y="15" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Slightly conservative</text>

      <text x="0" y="35" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9">top_p: 0.9</text>
      <text x="120" y="35" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Avoid far tail of distribution</text>

      <text x="0" y="55" fill="#ff9800" font-family="Inter, sans-serif" font-size="9">repetition_penalty: 1.2</text>
      <text x="120" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Lightly penalize repeats</text>
    </g>
  </g>
</svg>
