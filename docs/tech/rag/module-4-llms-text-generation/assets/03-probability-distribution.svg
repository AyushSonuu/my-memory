<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500">
  <defs>
    <linearGradient id="probGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#2196f3"/>
    </linearGradient>
    <linearGradient id="flatGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#c62828"/>
      <stop offset="100%" style="stop-color:#f44336"/>
    </linearGradient>
    <filter id="shadowDist">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="425" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Token Probability Distributions: Confidence vs Uncertainty</text>

  <!-- Confident Distribution -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowDist)"/>
    <text x="175" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Peaked Distribution = CONFIDENT</text>

    <!-- Y axis -->
    <line x1="50" y1="50" x2="50" y2="170" stroke="#8b949e" stroke-width="1"/>
    <text x="30" y="110" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" transform="rotate(-90, 30, 110)">Probability</text>

    <!-- X axis -->
    <line x1="50" y1="170" x2="320" y2="170" stroke="#8b949e" stroke-width="1"/>
    <text x="185" y="190" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Tokens (ranked by probability)</text>

    <!-- Bars -->
    <rect x="60" y="60" width="35" height="110" fill="url(#probGrad)" rx="2"/>
    <text x="78" y="180" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">blue</text>
    <text x="78" y="55" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">50%</text>

    <rect x="105" y="95" width="35" height="75" fill="url(#probGrad)" rx="2"/>
    <text x="123" y="180" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">bright</text>
    <text x="123" y="90" fill="#58a6ff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">25%</text>

    <rect x="150" y="130" width="30" height="40" fill="url(#probGrad)" rx="2"/>
    <text x="165" y="180" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">clear</text>

    <rect x="190" y="145" width="25" height="25" fill="url(#probGrad)" rx="2"/>
    <rect x="225" y="155" width="20" height="15" fill="url(#probGrad)" rx="2"/>
    <rect x="255" y="160" width="15" height="10" fill="url(#probGrad)" rx="2"/>
    <rect x="280" y="163" width="10" height="7" fill="url(#probGrad)" rx="2"/>
    <rect x="300" y="165" width="8" height="5" fill="url(#probGrad)" rx="2"/>

    <text x="260" y="180" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">... long tail</text>
  </g>

  <!-- Uncertain Distribution -->
  <g transform="translate(450, 60)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadowDist)"/>
    <text x="175" y="25" fill="#f44336" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Flat Distribution = UNCERTAIN</text>

    <!-- Y axis -->
    <line x1="50" y1="50" x2="50" y2="170" stroke="#8b949e" stroke-width="1"/>
    <text x="30" y="110" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" transform="rotate(-90, 30, 110)">Probability</text>

    <!-- X axis -->
    <line x1="50" y1="170" x2="320" y2="170" stroke="#8b949e" stroke-width="1"/>
    <text x="185" y="190" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Tokens (ranked by probability)</text>

    <!-- Bars (flat) -->
    <rect x="60" y="140" width="30" height="30" fill="url(#flatGrad)" rx="2"/>
    <rect x="100" y="143" width="30" height="27" fill="url(#flatGrad)" rx="2"/>
    <rect x="140" y="145" width="30" height="25" fill="url(#flatGrad)" rx="2"/>
    <rect x="180" y="147" width="30" height="23" fill="url(#flatGrad)" rx="2"/>
    <rect x="220" y="150" width="25" height="20" fill="url(#flatGrad)" rx="2"/>
    <rect x="255" y="153" width="25" height="17" fill="url(#flatGrad)" rx="2"/>
    <rect x="290" y="155" width="20" height="15" fill="url(#flatGrad)" rx="2"/>

    <text x="185" y="130" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Many options, no clear winner!</text>
  </g>

  <!-- Prompt example -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="750" height="50" rx="8" fill="#21262d"/>
    <text x="375" y="20" fill="#ff9800" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Example Prompt: "The sky is ___"</text>
    <text x="375" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Model generates probability for EVERY token in vocabulary (100,000+), but most are ~0%</text>
  </g>

  <!-- Key insight -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="750" height="130" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="375" y="25" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Why This Matters for RAG</text>

    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="220" height="70" rx="6" fill="#0d2818"/>
      <text x="110" y="20" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Peaked (Confident)</text>
      <text x="110" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Model "knows" the answer</text>
      <text x="110" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Good for factual responses</text>
    </g>

    <g transform="translate(265, 45)">
      <rect x="0" y="0" width="220" height="70" rx="6" fill="#2a1a1a"/>
      <text x="110" y="20" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Flat (Uncertain)</text>
      <text x="110" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Model is "guessing"</text>
      <text x="110" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Higher hallucination risk!</text>
    </g>

    <g transform="translate(500, 45)">
      <rect x="0" y="0" width="220" height="70" rx="6" fill="#1a1a2a"/>
      <text x="110" y="20" fill="#9c27b0" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Sampling Strategies</text>
      <text x="110" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Control HOW the model</text>
      <text x="110" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">picks from distribution</text>
    </g>
  </g>
</svg>
