<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400">
  <defs>
    <linearGradient id="encGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="decGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <filter id="shadowED">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="425" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Encoder vs Decoder: The Two Sides of Transformers</text>

  <!-- Timeline -->
  <g transform="translate(50, 55)">
    <line x1="0" y1="0" x2="750" y2="0" stroke="#30363d" stroke-width="2"/>

    <circle cx="0" cy="0" r="8" fill="#ff9800"/>
    <text x="0" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2015</text>
    <text x="0" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Attention</text>

    <circle cx="250" cy="0" r="8" fill="#9c27b0"/>
    <text x="250" y="25" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2017</text>
    <text x="250" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Transformers</text>

    <circle cx="500" cy="0" r="8" fill="#2196f3"/>
    <text x="500" y="25" fill="#2196f3" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2018</text>
    <text x="500" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Pre-trained LMs</text>

    <circle cx="750" cy="0" r="8" fill="#4caf50"/>
    <text x="750" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2022</text>
    <text x="750" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLMs Public</text>
  </g>

  <!-- Original Paper -->
  <g transform="translate(200, 100)">
    <rect x="0" y="0" width="450" height="40" rx="6" fill="#21262d"/>
    <text x="225" y="17" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">📄 "Attention is All You Need" (2017) — Vaswani et al., Google Brain</text>
    <text x="225" y="32" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Original focus: Machine Translation (German → English)</text>
  </g>

  <!-- Encoder Box -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="350" height="180" rx="12" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadowED)"/>
    <rect x="0" y="0" width="350" height="40" rx="12" fill="url(#encGrad)"/>
    <rect x="0" y="28" width="350" height="12" fill="url(#encGrad)"/>
    <text x="175" y="28" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔍 ENCODER</text>

    <text x="175" y="65" fill="#58a6ff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Purpose: Understand Input</text>

    <g transform="translate(20, 80)">
      <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Processes original text (e.g., German paragraph)</text>
      <text x="0" y="18" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Develops deep contextual understanding</text>
      <text x="0" y="36" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Creates rich semantic representations</text>
    </g>

    <rect x="20" y="130" width="310" height="35" rx="6" fill="#1a2a3a"/>
    <text x="175" y="145" fill="#2196f3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Used in: Embedding Models</text>
    <text x="175" y="158" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">BERT, Sentence Transformers, etc.</text>
  </g>

  <!-- Arrow between -->
  <g transform="translate(410, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#8b949e" stroke-width="2"/>
    <polygon points="35,0 25,-6 25,6" fill="#8b949e"/>
  </g>

  <!-- Decoder Box -->
  <g transform="translate(450, 160)">
    <rect x="0" y="0" width="350" height="180" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowED)"/>
    <rect x="0" y="0" width="350" height="40" rx="12" fill="url(#decGrad)"/>
    <rect x="0" y="28" width="350" height="12" fill="url(#decGrad)"/>
    <text x="175" y="28" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✍️ DECODER</text>

    <text x="175" y="65" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Purpose: Generate Output</text>

    <g transform="translate(20, 80)">
      <text x="0" y="0" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Uses understanding from encoder (or prompt)</text>
      <text x="0" y="18" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Generates new text token by token</text>
      <text x="0" y="36" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Autoregressive: each token informs next</text>
    </g>

    <rect x="20" y="130" width="310" height="35" rx="6" fill="#1a3a1a"/>
    <text x="175" y="145" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Used in: LLMs (GPT, Llama, Claude)</text>
    <text x="175" y="158" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Most LLMs are decoder-only</text>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="750" height="30" rx="6" fill="#21262d"/>
    <text x="375" y="20" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">💡 RAG combines both: Embedding model (encoder) finds docs → LLM (decoder) generates answers</text>
  </g>
</svg>
