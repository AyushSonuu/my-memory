<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Multi-Agent Communication Patterns</text>

  <!-- Pattern 1: Linear (Sequential) -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="350" height="160" rx="8" fill="#161b22" stroke="#9c27b0" stroke-width="2"/>
    <text x="175" y="25" fill="#9c27b0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pattern 1: Linear (Sequential)</text>

    <rect x="30" y="70" width="80" height="40" rx="6" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="70" y="95" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">researcher</text>

    <line x1="115" y1="90" x2="145" y2="90" stroke="#8b949e" stroke-width="2"/>
    <polygon points="145,90 135,84 135,96" fill="#8b949e"/>

    <rect x="150" y="70" width="80" height="40" rx="6" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="190" y="88" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">graphic</text>
    <text x="190" y="100" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">designer</text>

    <line x1="235" y1="90" x2="265" y2="90" stroke="#8b949e" stroke-width="2"/>
    <polygon points="265,90 255,84 255,96" fill="#8b949e"/>

    <rect x="270" y="70" width="60" height="40" rx="6" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="300" y="95" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">writer</text>

    <text x="175" y="140" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Each agent passes output to next</text>
  </g>

  <!-- Pattern 2: Hub and Spoke (Manager) -->
  <g transform="translate(420, 60)">
    <rect x="0" y="0" width="350" height="160" rx="8" fill="#161b22" stroke="#2196f3" stroke-width="2"/>
    <text x="175" y="25" fill="#2196f3" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pattern 2: Hub &amp; Spoke (Manager)</text>

    <!-- Manager at top -->
    <rect x="125" y="45" width="100" height="35" rx="6" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="175" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">marketing</text>
    <text x="175" y="72" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">manager</text>

    <!-- Arrows down -->
    <line x1="140" y1="83" x2="70" y2="105" stroke="#8b949e" stroke-width="2"/>
    <polygon points="70,105 82,105 76,93" fill="#8b949e"/>
    <line x1="175" y1="83" x2="175" y2="105" stroke="#8b949e" stroke-width="2"/>
    <polygon points="175,105 169,93 181,93" fill="#8b949e"/>
    <line x1="210" y1="83" x2="280" y2="105" stroke="#8b949e" stroke-width="2"/>
    <polygon points="280,105 274,93 268,105" fill="#8b949e"/>

    <!-- Workers -->
    <rect x="30" y="110" width="75" height="30" rx="4" fill="url(#purpleGrad)"/>
    <text x="67" y="129" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">researcher</text>

    <rect x="138" y="110" width="75" height="30" rx="4" fill="url(#purpleGrad)"/>
    <text x="175" y="129" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">designer</text>

    <rect x="245" y="110" width="75" height="30" rx="4" fill="url(#purpleGrad)"/>
    <text x="282" y="129" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">writer</text>

    <text x="175" y="155" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Manager orchestrates all workers</text>
  </g>

  <!-- Pattern 3: Deep Hierarchy -->
  <g transform="translate(30, 240)">
    <rect x="0" y="0" width="350" height="190" rx="8" fill="#161b22" stroke="#ff9800" stroke-width="2"/>
    <text x="175" y="25" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pattern 3: Deep Hierarchy</text>

    <!-- Top manager -->
    <rect x="125" y="45" width="100" height="30" rx="4" fill="url(#blueGrad)"/>
    <text x="175" y="65" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">manager</text>

    <!-- Lines to middle tier -->
    <line x1="145" y1="78" x2="80" y2="95" stroke="#8b949e" stroke-width="1"/>
    <line x1="175" y1="78" x2="175" y2="95" stroke="#8b949e" stroke-width="1"/>
    <line x1="205" y1="78" x2="270" y2="95" stroke="#8b949e" stroke-width="1"/>

    <!-- Middle tier -->
    <rect x="45" y="98" width="70" height="25" rx="4" fill="url(#purpleGrad)"/>
    <text x="80" y="115" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">researcher</text>

    <rect x="140" y="98" width="70" height="25" rx="4" fill="url(#purpleGrad)"/>
    <text x="175" y="115" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">designer</text>

    <rect x="235" y="98" width="70" height="25" rx="4" fill="url(#purpleGrad)"/>
    <text x="270" y="115" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">writer</text>

    <!-- Lines to bottom tier -->
    <line x1="60" y1="125" x2="40" y2="145" stroke="#8b949e" stroke-width="1"/>
    <line x1="100" y1="125" x2="120" y2="145" stroke="#8b949e" stroke-width="1"/>
    <line x1="250" y1="125" x2="230" y2="145" stroke="#8b949e" stroke-width="1"/>
    <line x1="290" y1="125" x2="310" y2="145" stroke="#8b949e" stroke-width="1"/>

    <!-- Bottom tier -->
    <rect x="15" y="148" width="55" height="22" rx="3" fill="#21262d" stroke="#9c27b0"/>
    <text x="42" y="162" fill="#ce93d8" font-family="Inter, sans-serif" font-size="6" text-anchor="middle">web search</text>

    <rect x="95" y="148" width="55" height="22" rx="3" fill="#21262d" stroke="#9c27b0"/>
    <text x="122" y="162" fill="#ce93d8" font-family="Inter, sans-serif" font-size="6" text-anchor="middle">fact check</text>

    <rect x="205" y="148" width="55" height="22" rx="3" fill="#21262d" stroke="#9c27b0"/>
    <text x="232" y="162" fill="#ce93d8" font-family="Inter, sans-serif" font-size="6" text-anchor="middle">style</text>

    <rect x="285" y="148" width="55" height="22" rx="3" fill="#21262d" stroke="#9c27b0"/>
    <text x="312" y="162" fill="#ce93d8" font-family="Inter, sans-serif" font-size="6" text-anchor="middle">citation</text>

    <text x="175" y="183" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Agents can have sub-agents</text>
  </g>

  <!-- Pattern 4: All-to-All -->
  <g transform="translate(420, 240)">
    <rect x="0" y="0" width="350" height="190" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <text x="175" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pattern 4: All-to-All (Peer)</text>

    <!-- 4 agents in a square -->
    <rect x="70" y="55" width="75" height="30" rx="4" fill="url(#purpleGrad)"/>
    <text x="107" y="74" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">manager</text>

    <rect x="205" y="55" width="75" height="30" rx="4" fill="url(#purpleGrad)"/>
    <text x="242" y="74" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">researcher</text>

    <rect x="70" y="125" width="75" height="30" rx="4" fill="url(#purpleGrad)"/>
    <text x="107" y="144" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">designer</text>

    <rect x="205" y="125" width="75" height="30" rx="4" fill="url(#purpleGrad)"/>
    <text x="242" y="144" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">writer</text>

    <!-- Bidirectional arrows -->
    <!-- Horizontal top -->
    <line x1="150" y1="70" x2="200" y2="70" stroke="#8b949e" stroke-width="1"/>
    <polygon points="200,70 193,66 193,74" fill="#8b949e"/>
    <polygon points="150,70 157,66 157,74" fill="#8b949e"/>

    <!-- Horizontal bottom -->
    <line x1="150" y1="140" x2="200" y2="140" stroke="#8b949e" stroke-width="1"/>
    <polygon points="200,140 193,136 193,144" fill="#8b949e"/>
    <polygon points="150,140 157,136 157,144" fill="#8b949e"/>

    <!-- Vertical left -->
    <line x1="107" y1="90" x2="107" y2="120" stroke="#8b949e" stroke-width="1"/>
    <polygon points="107,120 103,113 111,113" fill="#8b949e"/>
    <polygon points="107,90 103,97 111,97" fill="#8b949e"/>

    <!-- Vertical right -->
    <line x1="242" y1="90" x2="242" y2="120" stroke="#8b949e" stroke-width="1"/>
    <polygon points="242,120 238,113 246,113" fill="#8b949e"/>
    <polygon points="242,90 238,97 246,97" fill="#8b949e"/>

    <!-- Diagonals -->
    <line x1="148" y1="87" x2="202" y2="123" stroke="#8b949e" stroke-width="1"/>
    <line x1="148" y1="123" x2="202" y2="87" stroke="#8b949e" stroke-width="1"/>

    <text x="175" y="175" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Any agent can message any other</text>
  </g>
</svg>
