<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Planning Workflow: LLM Creates Step-by-Step Plan</text>

  <!-- System prompt box -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="200" height="100" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
    <text x="100" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">System Prompt</text>
    <text x="15" y="40" fill="#e6edf3" font-family="Inter, sans-serif" font-size="8">You have access to tools:</text>
    <text x="15" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">{description of tools}</text>
    <text x="15" y="75" fill="#e6edf3" font-family="Inter, sans-serif" font-size="8">Return a step-by-step plan</text>
    <text x="15" y="90" fill="#e6edf3" font-family="Inter, sans-serif" font-size="8">to carry out the request.</text>
  </g>

  <!-- Tools box -->
  <g transform="translate(550, 50)">
    <rect x="0" y="0" width="220" height="100" rx="8" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="110" y="20" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Tools</text>
    <rect x="15" y="32" width="80" height="25" rx="4" fill="url(#greenGrad)"/>
    <text x="55" y="48" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">get_item_desc</text>
    <rect x="105" y="32" width="80" height="25" rx="4" fill="url(#greenGrad)"/>
    <text x="145" y="48" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">check_inventory</text>
    <rect x="15" y="65" width="80" height="25" rx="4" fill="url(#greenGrad)"/>
    <text x="55" y="81" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">get_item_price</text>
    <rect x="105" y="65" width="80" height="25" rx="4" fill="url(#greenGrad)"/>
    <text x="145" y="81" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">process_return</text>
  </g>

  <!-- User query -->
  <rect x="30" y="170" width="150" height="60" rx="6" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="105" y="190" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Do you have any round</text>
  <text x="105" y="205" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">sunglasses in stock</text>
  <text x="105" y="220" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">under $100?</text>

  <!-- Arrow to LLM -->
  <line x1="185" y1="200" x2="230" y2="200" stroke="#8b949e" stroke-width="2"/>
  <polygon points="230,200 220,194 220,206" fill="#8b949e"/>

  <!-- LLM -->
  <rect x="235" y="175" width="70" height="50" rx="6" fill="url(#grayGrad)" filter="url(#shadow)"/>
  <text x="270" y="205" fill="#fff" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">LLM</text>

  <!-- Arrow to plan -->
  <line x1="310" y1="200" x2="355" y2="200" stroke="#8b949e" stroke-width="2"/>
  <polygon points="355,200 345,194 345,206" fill="#8b949e"/>

  <!-- Plan box -->
  <g transform="translate(360, 160)">
    <rect x="0" y="0" width="200" height="100" rx="6" fill="#21262d" stroke="#ff9800" stroke-width="2"/>
    <text x="100" y="20" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Generated Plan</text>
    <text x="15" y="40" fill="#f44336" font-family="Inter, sans-serif" font-size="8">1. get_item_descriptions</text>
    <text x="25" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="7">→ find round sunglasses</text>
    <text x="15" y="68" fill="#2196f3" font-family="Inter, sans-serif" font-size="8">2. check_inventory</text>
    <text x="25" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="7">→ are results in stock?</text>
    <text x="15" y="96" fill="#4caf50" font-family="Inter, sans-serif" font-size="8">3. get_item_price</text>
    <text x="25" y="108" fill="#8b949e" font-family="Inter, sans-serif" font-size="7">→ filter for &lt;$100</text>
  </g>

  <!-- Execution section -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="740" height="170" rx="8" fill="#161b22" stroke="#9c27b0" stroke-width="2"/>
    <text x="370" y="25" fill="#9c27b0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Sequential Execution of Plan Steps</text>

    <!-- Step 1 -->
    <rect x="20" y="45" width="90" height="35" rx="4" fill="url(#orangeGrad)"/>
    <text x="65" y="67" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Step 1 text</text>

    <line x1="115" y1="62" x2="145" y2="62" stroke="#8b949e" stroke-width="2"/>
    <polygon points="145,62 135,56 135,68" fill="#8b949e"/>

    <rect x="150" y="45" width="60" height="35" rx="4" fill="url(#grayGrad)"/>
    <text x="180" y="67" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM</text>

    <line x1="215" y1="62" x2="245" y2="62" stroke="#8b949e" stroke-width="2"/>
    <polygon points="245,62 235,56 235,68" fill="#8b949e"/>

    <rect x="250" y="45" width="95" height="35" rx="4" fill="url(#greenGrad)"/>
    <text x="297" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">get_item_</text>
    <text x="297" y="72" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">descriptions</text>

    <!-- Step 2 -->
    <rect x="20" y="95" width="90" height="35" rx="4" fill="url(#orangeGrad)"/>
    <text x="65" y="110" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Step 1 output +</text>
    <text x="65" y="122" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Step 2 text</text>

    <line x1="115" y1="112" x2="145" y2="112" stroke="#8b949e" stroke-width="2"/>
    <polygon points="145,112 135,106 135,118" fill="#8b949e"/>

    <rect x="150" y="95" width="60" height="35" rx="4" fill="url(#grayGrad)"/>
    <text x="180" y="117" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM</text>

    <line x1="215" y1="112" x2="245" y2="112" stroke="#8b949e" stroke-width="2"/>
    <polygon points="245,112 235,106 235,118" fill="#8b949e"/>

    <rect x="250" y="95" width="95" height="35" rx="4" fill="url(#greenGrad)"/>
    <text x="297" y="110" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">check_</text>
    <text x="297" y="122" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">inventory</text>

    <!-- Step 3 -->
    <rect x="380" y="70" width="90" height="35" rx="4" fill="url(#orangeGrad)"/>
    <text x="425" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Step 2 output +</text>
    <text x="425" y="97" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Step 3 text</text>

    <line x1="475" y1="87" x2="505" y2="87" stroke="#8b949e" stroke-width="2"/>
    <polygon points="505,87 495,81 495,93" fill="#8b949e"/>

    <rect x="510" y="70" width="60" height="35" rx="4" fill="url(#grayGrad)"/>
    <text x="540" y="92" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM</text>

    <line x1="575" y1="87" x2="605" y2="87" stroke="#8b949e" stroke-width="2"/>
    <polygon points="605,87 595,81 595,93" fill="#8b949e"/>

    <rect x="610" y="70" width="95" height="35" rx="4" fill="url(#greenGrad)"/>
    <text x="657" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">get_item_</text>
    <text x="657" y="97" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">price</text>

    <!-- Final answer -->
    <line x1="657" y1="110" x2="657" y2="135" stroke="#8b949e" stroke-width="2"/>
    <polygon points="657,135 651,125 663,125" fill="#8b949e"/>

    <rect x="580" y="140" width="150" height="25" rx="4" fill="#21262d" stroke="#4caf50" stroke-width="2"/>
    <text x="655" y="157" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Classic sunglasses: $60 ✓</text>
  </g>
</svg>
