<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Multi-Agent Workflow: Marketing Team Example</text>

  <!-- Task input -->
  <rect x="30" y="60" width="140" height="60" rx="6" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="100" y="80" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Create a summer</text>
  <text x="100" y="95" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">marketing campaign</text>
  <text x="100" y="110" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">for sunglasses</text>

  <!-- Arrow -->
  <line x1="175" y1="90" x2="210" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="210,90 200,84 200,96" fill="#8b949e"/>

  <!-- Manager LLM -->
  <rect x="215" y="60" width="100" height="60" rx="6" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="265" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Marketing</text>
  <text x="265" y="100" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Manager</text>

  <!-- Plan box -->
  <rect x="340" y="50" width="180" height="80" rx="6" fill="#21262d" stroke="#ff9800" stroke-width="2"/>
  <text x="430" y="70" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Manager's Plan</text>
  <text x="355" y="88" fill="#f44336" font-family="Inter, sans-serif" font-size="8">1. Ask researcher for trends</text>
  <text x="355" y="103" fill="#4caf50" font-family="Inter, sans-serif" font-size="8">2. Ask designer for visuals</text>
  <text x="355" y="118" fill="#2196f3" font-family="Inter, sans-serif" font-size="8">3. Ask writer for copy</text>

  <!-- Arrow from manager to plan -->
  <line x1="320" y1="90" x2="335" y2="90" stroke="#8b949e" stroke-width="2"/>
  <polygon points="335,90 325,84 325,96" fill="#8b949e"/>

  <!-- Agents box -->
  <rect x="550" y="50" width="220" height="80" rx="8" fill="none" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="660" y="70" fill="#9c27b0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Available Agents</text>
  <rect x="565" y="82" width="70" height="30" rx="4" fill="url(#purpleGrad)"/>
  <text x="600" y="101" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">researcher</text>
  <rect x="645" y="82" width="55" height="30" rx="4" fill="url(#purpleGrad)"/>
  <text x="672" y="101" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">designer</text>
  <rect x="710" y="82" width="50" height="30" rx="4" fill="url(#purpleGrad)"/>
  <text x="735" y="101" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">writer</text>

  <!-- Execution flow -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="740" height="200" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <text x="370" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Sequential Execution by Manager</text>

    <!-- Step 1: Researcher -->
    <rect x="20" y="45" width="90" height="35" rx="4" fill="url(#redGrad)"/>
    <text x="65" y="67" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Step 1 task</text>

    <line x1="115" y1="62" x2="145" y2="62" stroke="#8b949e" stroke-width="2"/>
    <polygon points="145,62 135,56 135,68" fill="#8b949e"/>

    <rect x="150" y="45" width="75" height="35" rx="4" fill="url(#purpleGrad)"/>
    <text x="187" y="67" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">researcher</text>

    <line x1="230" y1="62" x2="260" y2="62" stroke="#8b949e" stroke-width="2"/>
    <polygon points="260,62 250,56 250,68" fill="#8b949e"/>

    <rect x="265" y="45" width="130" height="35" rx="4" fill="#21262d" stroke="#4caf50"/>
    <text x="330" y="60" fill="#4caf50" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Sunglasses trends:</text>
    <text x="330" y="72" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">oversized, retro...</text>

    <!-- Step 2: Designer -->
    <rect x="20" y="95" width="90" height="35" rx="4" fill="url(#greenGrad)"/>
    <text x="65" y="110" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Research +</text>
    <text x="65" y="122" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Step 2 task</text>

    <line x1="115" y1="112" x2="145" y2="112" stroke="#8b949e" stroke-width="2"/>
    <polygon points="145,112 135,106 135,118" fill="#8b949e"/>

    <rect x="150" y="95" width="75" height="35" rx="4" fill="url(#purpleGrad)"/>
    <text x="187" y="117" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">designer</text>

    <line x1="230" y1="112" x2="260" y2="112" stroke="#8b949e" stroke-width="2"/>
    <polygon points="260,112 250,106 250,118" fill="#8b949e"/>

    <rect x="265" y="95" width="130" height="35" rx="4" fill="#21262d" stroke="#4caf50"/>
    <text x="330" y="110" fill="#4caf50" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">5 visualizations +</text>
    <text x="330" y="122" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">artwork options</text>

    <!-- Step 3: Writer -->
    <rect x="420" y="70" width="90" height="35" rx="4" fill="url(#blueGrad)"/>
    <text x="465" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Research + visuals</text>
    <text x="465" y="97" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">+ Step 3 task</text>

    <line x1="515" y1="87" x2="545" y2="87" stroke="#8b949e" stroke-width="2"/>
    <polygon points="545,87 535,81 535,93" fill="#8b949e"/>

    <rect x="550" y="70" width="65" height="35" rx="4" fill="url(#purpleGrad)"/>
    <text x="582" y="92" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">writer</text>

    <line x1="620" y1="87" x2="650" y2="87" stroke="#8b949e" stroke-width="2"/>
    <polygon points="650,87 640,81 640,93" fill="#8b949e"/>

    <rect x="655" y="70" width="70" height="35" rx="4" fill="#21262d" stroke="#4caf50"/>
    <text x="690" y="85" fill="#4caf50" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Marketing</text>
    <text x="690" y="97" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">copy draft</text>

    <!-- Final output -->
    <rect x="500" y="150" width="220" height="40" rx="6" fill="#21262d" stroke="#4caf50" stroke-width="2"/>
    <text x="610" y="175" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Final Report: Research + Visuals + Copy</text>

    <line x1="610" y1="110" x2="610" y2="145" stroke="#8b949e" stroke-width="2"/>
    <polygon points="610,145 604,135 616,135" fill="#8b949e"/>
  </g>
</svg>
