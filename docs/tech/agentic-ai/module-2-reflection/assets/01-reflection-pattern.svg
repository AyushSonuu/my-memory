<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Reflection Pattern: Basic vs With External Feedback</text>

  <!-- BASIC REFLECTION (Top) -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="720" height="130" rx="12" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="720" height="35" rx="12" fill="url(#orangeGrad)"/>
    <rect x="0" y="20" width="720" height="15" fill="url(#orangeGrad)"/>
    <text x="360" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Basic Reflection (Modest Improvement)</text>

    <!-- Flow -->
    <rect x="30" y="55" width="100" height="55" rx="8" fill="url(#redGrad)"/>
    <text x="80" y="80" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LLM</text>
    <text x="80" y="95" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Generate v1</text>

    <line x1="135" y1="82" x2="175" y2="82" stroke="#8b949e" stroke-width="2"/>
    <polygon points="175,82 165,76 165,88" fill="#8b949e"/>

    <rect x="180" y="55" width="100" height="55" rx="8" fill="#21262d"/>
    <text x="230" y="80" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">v1 Output</text>
    <text x="230" y="95" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(code/essay)</text>

    <line x1="285" y1="82" x2="325" y2="82" stroke="#8b949e" stroke-width="2"/>
    <polygon points="325,82 315,76 315,88" fill="#8b949e"/>

    <rect x="330" y="55" width="100" height="55" rx="8" fill="url(#orangeGrad)"/>
    <text x="380" y="80" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LLM</text>
    <text x="380" y="95" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Critique</text>

    <line x1="435" y1="82" x2="475" y2="82" stroke="#8b949e" stroke-width="2"/>
    <polygon points="475,82 465,76 465,88" fill="#8b949e"/>

    <rect x="480" y="55" width="100" height="55" rx="8" fill="url(#blueGrad)"/>
    <text x="530" y="80" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LLM</text>
    <text x="530" y="95" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Fix → v2</text>

    <line x1="585" y1="82" x2="625" y2="82" stroke="#8b949e" stroke-width="2"/>
    <polygon points="625,82 615,76 615,88" fill="#8b949e"/>

    <rect x="630" y="55" width="60" height="55" rx="8" fill="url(#greenGrad)"/>
    <text x="660" y="87" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">v2</text>
  </g>

  <!-- REFLECTION + EXTERNAL FEEDBACK (Bottom) -->
  <g transform="translate(40, 230)">
    <rect x="0" y="0" width="720" height="150" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="720" height="35" rx="12" fill="url(#greenGrad)"/>
    <rect x="0" y="20" width="720" height="15" fill="url(#greenGrad)"/>
    <text x="360" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Reflection + External Feedback (Game Changer)</text>

    <!-- Flow with external feedback -->
    <rect x="30" y="55" width="90" height="55" rx="8" fill="url(#redGrad)"/>
    <text x="75" y="77" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LLM</text>
    <text x="75" y="92" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Write v1</text>

    <line x1="125" y1="82" x2="155" y2="82" stroke="#8b949e" stroke-width="2"/>
    <polygon points="155,82 145,76 145,88" fill="#8b949e"/>

    <rect x="160" y="55" width="80" height="55" rx="8" fill="#21262d"/>
    <text x="200" y="80" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">v1 code</text>

    <line x1="245" y1="82" x2="275" y2="82" stroke="#8b949e" stroke-width="2"/>
    <polygon points="275,82 265,76 265,88" fill="#8b949e"/>

    <!-- Execute code -->
    <rect x="280" y="45" width="100" height="75" rx="8" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="330" y="68" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Execute</text>
    <text x="330" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Code</text>
    <text x="330" y="105" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(errors? output?)</text>

    <line x1="385" y1="82" x2="415" y2="82" stroke="#9c27b0" stroke-width="2"/>
    <polygon points="415,82 405,76 405,88" fill="#9c27b0"/>
    <text x="400" y="70" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" font-weight="bold">NEW</text>
    <text x="400" y="58" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" font-weight="bold">INFO!</text>

    <rect x="420" y="55" width="100" height="55" rx="8" fill="url(#orangeGrad)"/>
    <text x="470" y="77" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LLM</text>
    <text x="470" y="92" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Reflect + Fix</text>

    <line x1="525" y1="82" x2="555" y2="82" stroke="#8b949e" stroke-width="2"/>
    <polygon points="555,82 545,76 545,88" fill="#8b949e"/>

    <rect x="560" y="55" width="60" height="55" rx="8" fill="url(#greenGrad)"/>
    <text x="590" y="80" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">v2</text>
    <text x="590" y="95" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">MUCH</text>
    <text x="590" y="105" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Better!</text>

    <!-- Loop arrow -->
    <path d="M 610 115 Q 640 140 470 140 Q 340 140 340 120" stroke="#4caf50" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  </g>

  <!-- Key insight box -->
  <g transform="translate(200, 395)">
    <text x="200" y="12" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Without external feedback = guessing what's wrong | With external feedback = knowing exactly what's wrong</text>
  </g>
</svg>