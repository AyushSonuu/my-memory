<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="375" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Evaluating Reflection Impact with Dataset</text>

  <!-- Workflow row -->
  <!-- Input Question -->
  <rect x="20" y="60" width="90" height="50" rx="6" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="65" y="80" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"Which color</text>
  <text x="65" y="92" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">has highest</text>
  <text x="65" y="104" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">sales?"</text>

  <!-- Arrow -->
  <line x1="115" y1="85" x2="145" y2="85" stroke="#8b949e" stroke-width="2"/>
  <polygon points="145,85 135,79 135,91" fill="#8b949e"/>

  <!-- LLM Generate SQL -->
  <rect x="150" y="60" width="75" height="50" rx="6" fill="url(#grayGrad)" filter="url(#shadow)"/>
  <text x="187" y="82" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM</text>
  <text x="187" y="96" fill="#e6edf3" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Generate SQL</text>

  <!-- Arrow -->
  <line x1="230" y1="85" x2="260" y2="85" stroke="#8b949e" stroke-width="2"/>
  <polygon points="260,85 250,79 250,91" fill="#8b949e"/>

  <!-- Reflect box (dashed) -->
  <rect x="265" y="55" width="95" height="60" rx="6" fill="none" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="275" y="65" width="75" height="40" rx="4" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="312" y="82" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">LLM</text>
  <text x="312" y="94" fill="#e1bee7" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Reflect, write v2</text>

  <!-- Arrow -->
  <line x1="365" y1="85" x2="395" y2="85" stroke="#8b949e" stroke-width="2"/>
  <polygon points="395,85 385,79 385,91" fill="#8b949e"/>

  <!-- Execute SQL -->
  <rect x="400" y="60" width="70" height="50" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="435" y="82" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">execute</text>
  <text x="435" y="94" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">SQL</text>

  <!-- Arrow -->
  <line x1="475" y1="85" x2="505" y2="85" stroke="#8b949e" stroke-width="2"/>
  <polygon points="505,85 495,79 495,91" fill="#8b949e"/>

  <!-- V2 results -->
  <rect x="510" y="60" width="70" height="50" rx="6" fill="#21262d" stroke="#4caf50"/>
  <text x="545" y="82" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">V2 query</text>
  <text x="545" y="94" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">results</text>

  <!-- Arrow -->
  <line x1="585" y1="85" x2="615" y2="85" stroke="#8b949e" stroke-width="2"/>
  <polygon points="615,85 605,79 605,91" fill="#8b949e"/>

  <!-- LLM Answer -->
  <rect x="620" y="60" width="70" height="50" rx="6" fill="url(#grayGrad)" filter="url(#shadow)"/>
  <text x="655" y="82" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM</text>
  <text x="655" y="94" fill="#e6edf3" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Answer Q</text>

  <!-- Dataset Table -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="680" height="180" rx="8" fill="#161b22" stroke="#2196f3" stroke-width="2"/>
    <text x="340" y="25" fill="#2196f3" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Create Dataset of Prompts and Answers</text>

    <!-- Table header -->
    <rect x="20" y="40" width="150" height="25" fill="#21262d"/>
    <text x="95" y="57" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Prompts</text>

    <rect x="180" y="40" width="130" height="25" fill="#21262d"/>
    <text x="245" y="57" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Ground Truth</text>

    <rect x="320" y="40" width="110" height="25" fill="url(#orangeGrad)"/>
    <text x="375" y="57" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">No Reflection</text>

    <rect x="440" y="40" width="110" height="25" fill="url(#greenGrad)"/>
    <text x="495" y="57" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">With Reflection</text>

    <rect x="560" y="40" width="100" height="25" fill="#21262d"/>
    <text x="610" y="57" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Run each time</text>

    <!-- Row 1 -->
    <rect x="20" y="70" width="150" height="30" fill="#0d1117"/>
    <text x="95" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Items sold in May?</text>

    <rect x="180" y="70" width="130" height="30" fill="#0d1117"/>
    <text x="245" y="90" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">1201</text>

    <rect x="320" y="70" width="110" height="30" fill="#0d1117"/>
    <text x="375" y="90" fill="#f44336" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">980 ❌</text>

    <rect x="440" y="70" width="110" height="30" fill="#0d1117"/>
    <text x="495" y="90" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">1201 ✓</text>

    <!-- Row 2 -->
    <rect x="20" y="105" width="150" height="30" fill="#0d1117"/>
    <text x="95" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Most expensive item?</text>

    <rect x="180" y="105" width="130" height="30" fill="#0d1117"/>
    <text x="245" y="125" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Airflow sneaker</text>

    <rect x="320" y="105" width="110" height="30" fill="#0d1117"/>
    <text x="375" y="125" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Airflow ✓</text>

    <rect x="440" y="105" width="110" height="30" fill="#0d1117"/>
    <text x="495" y="125" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Airflow ✓</text>

    <!-- Row 3 -->
    <rect x="20" y="140" width="150" height="30" fill="#0d1117"/>
    <text x="95" y="160" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">How many styles?</text>

    <rect x="180" y="140" width="130" height="30" fill="#0d1117"/>
    <text x="245" y="160" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">14</text>

    <rect x="320" y="140" width="110" height="30" fill="#0d1117"/>
    <text x="375" y="160" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">14 ✓</text>

    <rect x="440" y="140" width="110" height="30" fill="#0d1117"/>
    <text x="495" y="160" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">14 ✓</text>

    <!-- Arrow pointing to note -->
    <line x1="560" y1="105" x2="590" y2="105" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="610" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">you change</text>
    <text x="610" y="102" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">reflection</text>
    <text x="610" y="114" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">prompt</text>
  </g>

  <!-- Bottom scores -->
  <rect x="30" y="340" width="300" height="45" rx="6" fill="#21262d"/>
  <text x="180" y="360" fill="#ff9800" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">No Reflection: 87% correct</text>
  <text x="180" y="378" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Baseline performance</text>

  <rect x="360" y="340" width="300" height="45" rx="6" fill="#21262d"/>
  <text x="510" y="360" fill="#4caf50" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">With Reflection: 95% correct ✓</text>
  <text x="510" y="378" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Reflection adds +8% accuracy</text>
</svg>