<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Simple Tool Execution: LLM Chooses When to Use Tools</text>

  <!-- Top row: Without tool -->
  <g transform="translate(50, 55)">
    <rect x="0" y="0" width="700" height="90" rx="8" fill="#161b22" stroke="#f44336" stroke-width="2"/>
    <text x="350" y="22" fill="#f44336" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Without Tools</text>

    <rect x="30" y="40" width="90" height="40" rx="6" fill="url(#redGrad)"/>
    <text x="75" y="55" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">What time</text>
    <text x="75" y="68" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">is it?</text>

    <line x1="125" y1="60" x2="175" y2="60" stroke="#8b949e" stroke-width="2"/>
    <polygon points="175,60 165,54 165,66" fill="#8b949e"/>

    <rect x="180" y="40" width="70" height="40" rx="6" fill="url(#grayGrad)"/>
    <text x="215" y="65" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM</text>

    <line x1="255" y1="60" x2="305" y2="60" stroke="#8b949e" stroke-width="2"/>
    <polygon points="305,60 295,54 295,66" fill="#8b949e"/>

    <rect x="310" y="35" width="170" height="50" rx="6" fill="#21262d" stroke="#f44336"/>
    <text x="395" y="55" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Sorry, I don't have</text>
    <text x="395" y="70" fill="#f44336" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">access to current time.</text>
  </g>

  <!-- Bottom: With tools -->
  <g transform="translate(50, 155)">
    <rect x="0" y="0" width="700" height="140" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <text x="350" y="22" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">With Tools - LLM Calls get_current_time()</text>

    <!-- Tools box (dashed) -->
    <rect x="150" y="-15" width="120" height="45" rx="6" fill="none" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="210" y="0" fill="#9c27b0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Tools</text>
    <rect x="165" y="10" width="90" height="20" rx="3" fill="url(#greenGrad)"/>
    <text x="210" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">get_current_time</text>

    <!-- Flow -->
    <rect x="20" y="50" width="80" height="40" rx="6" fill="url(#redGrad)"/>
    <text x="60" y="65" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">What time</text>
    <text x="60" y="78" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">is it?</text>

    <line x1="105" y1="70" x2="135" y2="70" stroke="#8b949e" stroke-width="2"/>
    <polygon points="135,70 125,64 125,76" fill="#8b949e"/>

    <rect x="140" y="50" width="55" height="40" rx="6" fill="url(#grayGrad)"/>
    <text x="167" y="75" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM</text>

    <line x1="200" y1="70" x2="250" y2="70" stroke="#8b949e" stroke-width="2"/>
    <polygon points="250,70 240,64 240,76" fill="#8b949e"/>

    <rect x="255" y="45" width="100" height="50" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="305" y="68" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">get_current_time</text>
    <text x="305" y="82" fill="#c8e6c9" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">→ 15:20:45</text>

    <line x1="360" y1="70" x2="400" y2="70" stroke="#8b949e" stroke-width="2"/>
    <text x="380" y="60" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">time</text>
    <polygon points="400,70 390,64 390,76" fill="#8b949e"/>

    <rect x="405" y="50" width="55" height="40" rx="6" fill="url(#grayGrad)"/>
    <text x="432" y="75" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM</text>

    <line x1="465" y1="70" x2="495" y2="70" stroke="#8b949e" stroke-width="2"/>
    <polygon points="495,70 485,64 485,76" fill="#8b949e"/>

    <rect x="500" y="50" width="90" height="40" rx="6" fill="#21262d" stroke="#4caf50"/>
    <text x="545" y="75" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">It's 3:20pm.</text>

    <!-- Note: LLM chooses -->
    <text x="600" y="115" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM decides to call tool</text>
    <text x="600" y="128" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">when appropriate</text>
  </g>

  <!-- Bottom comparison: LLMs can choose -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="700" height="75" rx="8" fill="#161b22" stroke="#2196f3" stroke-width="2"/>
    <text x="350" y="22" fill="#2196f3" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LLMs Can Choose Tools When Appropriate</text>

    <!-- No tool needed example -->
    <rect x="30" y="35" width="300" height="30" rx="4" fill="#21262d"/>
    <text x="180" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"How much caffeine in green tea?" → Answers directly</text>
    <text x="180" y="62" fill="#4caf50" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(No tool needed - LLM already knows)</text>

    <!-- Tool needed example -->
    <rect x="370" y="35" width="300" height="30" rx="4" fill="#21262d"/>
    <text x="520" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"What time is it?" → Calls get_current_time()</text>
    <text x="520" y="62" fill="#9c27b0" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(Tool needed - needs real-time data)</text>
  </g>
</svg>