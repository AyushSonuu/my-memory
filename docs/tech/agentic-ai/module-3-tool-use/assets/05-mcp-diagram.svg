<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">MCP: M×N → M+N Integration Magic</text>

  <!-- WITHOUT MCP (Left) -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="340" height="310" rx="12" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="340" height="35" rx="12" fill="url(#redGrad)"/>
    <rect x="0" y="20" width="340" height="15" fill="url(#redGrad)"/>
    <text x="170" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Without MCP: M × N</text>

    <!-- Apps -->
    <rect x="20" y="55" width="70" height="35" rx="6" fill="url(#blueGrad)"/>
    <text x="55" y="77" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">App 1</text>

    <rect x="20" y="105" width="70" height="35" rx="6" fill="url(#blueGrad)"/>
    <text x="55" y="127" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">App 2</text>

    <rect x="20" y="155" width="70" height="35" rx="6" fill="url(#blueGrad)"/>
    <text x="55" y="177" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">App 3</text>

    <!-- Services -->
    <rect x="250" y="55" width="70" height="35" rx="6" fill="url(#purpleGrad)"/>
    <text x="285" y="77" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Slack</text>

    <rect x="250" y="105" width="70" height="35" rx="6" fill="url(#purpleGrad)"/>
    <text x="285" y="127" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GitHub</text>

    <rect x="250" y="155" width="70" height="35" rx="6" fill="url(#purpleGrad)"/>
    <text x="285" y="177" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GDrive</text>

    <rect x="250" y="205" width="70" height="35" rx="6" fill="url(#purpleGrad)"/>
    <text x="285" y="227" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Postgres</text>

    <!-- All the wrapper lines (messy!) -->
    <line x1="95" y1="72" x2="245" y2="72" stroke="#8b949e" stroke-width="1"/>
    <line x1="95" y1="72" x2="245" y2="122" stroke="#8b949e" stroke-width="1"/>
    <line x1="95" y1="72" x2="245" y2="172" stroke="#8b949e" stroke-width="1"/>
    <line x1="95" y1="72" x2="245" y2="222" stroke="#8b949e" stroke-width="1"/>

    <line x1="95" y1="122" x2="245" y2="72" stroke="#8b949e" stroke-width="1"/>
    <line x1="95" y1="122" x2="245" y2="122" stroke="#8b949e" stroke-width="1"/>
    <line x1="95" y1="122" x2="245" y2="172" stroke="#8b949e" stroke-width="1"/>
    <line x1="95" y1="122" x2="245" y2="222" stroke="#8b949e" stroke-width="1"/>

    <line x1="95" y1="172" x2="245" y2="72" stroke="#8b949e" stroke-width="1"/>
    <line x1="95" y1="172" x2="245" y2="122" stroke="#8b949e" stroke-width="1"/>
    <line x1="95" y1="172" x2="245" y2="172" stroke="#8b949e" stroke-width="1"/>
    <line x1="95" y1="172" x2="245" y2="222" stroke="#8b949e" stroke-width="1"/>

    <!-- Summary -->
    <text x="170" y="270" fill="#f44336" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3 × 4 = 12 wrappers</text>
    <text x="170" y="290" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Each app builds own wrappers</text>
  </g>

  <!-- WITH MCP (Right) -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="340" height="310" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="340" height="35" rx="12" fill="url(#greenGrad)"/>
    <rect x="0" y="20" width="340" height="15" fill="url(#greenGrad)"/>
    <text x="170" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">With MCP: M + N</text>

    <!-- Apps (Clients) -->
    <rect x="20" y="55" width="70" height="35" rx="6" fill="url(#blueGrad)"/>
    <text x="55" y="77" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">App 1</text>

    <rect x="20" y="105" width="70" height="35" rx="6" fill="url(#blueGrad)"/>
    <text x="55" y="127" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">App 2</text>

    <rect x="20" y="155" width="70" height="35" rx="6" fill="url(#blueGrad)"/>
    <text x="55" y="177" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">App 3</text>

    <!-- MCP Protocol (Center) -->
    <rect x="125" y="70" width="90" height="140" rx="8" fill="#ff9800" filter="url(#shadow)"/>
    <text x="170" y="110" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MCP</text>
    <text x="170" y="130" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Protocol</text>
    <text x="170" y="165" fill="#fff" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">🔌</text>

    <!-- Servers -->
    <rect x="250" y="55" width="70" height="35" rx="6" fill="url(#purpleGrad)"/>
    <text x="285" y="77" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Slack</text>

    <rect x="250" y="105" width="70" height="35" rx="6" fill="url(#purpleGrad)"/>
    <text x="285" y="127" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GitHub</text>

    <rect x="250" y="155" width="70" height="35" rx="6" fill="url(#purpleGrad)"/>
    <text x="285" y="177" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GDrive</text>

    <rect x="250" y="205" width="70" height="35" rx="6" fill="url(#purpleGrad)"/>
    <text x="285" y="227" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Postgres</text>

    <!-- Clean lines through MCP -->
    <line x1="95" y1="72" x2="120" y2="100" stroke="#4caf50" stroke-width="2"/>
    <line x1="95" y1="122" x2="120" y2="140" stroke="#4caf50" stroke-width="2"/>
    <line x1="95" y1="172" x2="120" y2="160" stroke="#4caf50" stroke-width="2"/>

    <line x1="220" y1="100" x2="245" y2="72" stroke="#4caf50" stroke-width="2"/>
    <line x1="220" y1="120" x2="245" y2="122" stroke="#4caf50" stroke-width="2"/>
    <line x1="220" y1="140" x2="245" y2="172" stroke="#4caf50" stroke-width="2"/>
    <line x1="220" y1="160" x2="245" y2="222" stroke="#4caf50" stroke-width="2"/>

    <!-- Summary -->
    <text x="170" y="270" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3 + 4 = 7 connections</text>
    <text x="170" y="290" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Build once, share everywhere</text>
  </g>

  <!-- Math comparison -->
  <g transform="translate(200, 400)">
    <rect x="0" y="0" width="400" height="35" rx="8" fill="#21262d"/>
    <text x="200" y="23" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">At scale: 10 apps × 20 services = 200 wrappers vs 30 connections</text>
  </g>
</svg>