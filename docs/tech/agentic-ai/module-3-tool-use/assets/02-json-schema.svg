<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Behind the Scenes: Function to JSON Schema</text>

  <!-- Python Code Box -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="320" height="180" rx="8" fill="#161b22" stroke="#2196f3" stroke-width="2"/>
    <text x="160" y="25" fill="#2196f3" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Your Python Code</text>

    <!-- Code syntax highlighting -->
    <text x="20" y="55" fill="#f44336" font-family="monospace" font-size="10">from</text>
    <text x="50" y="55" fill="#e6edf3" font-family="monospace" font-size="10">datetime</text>
    <text x="115" y="55" fill="#f44336" font-family="monospace" font-size="10">import</text>
    <text x="155" y="55" fill="#e6edf3" font-family="monospace" font-size="10">datetime</text>

    <text x="20" y="80" fill="#9c27b0" font-family="monospace" font-size="10">def</text>
    <text x="45" y="80" fill="#4caf50" font-family="monospace" font-size="10">get_current_time</text>
    <text x="150" y="80" fill="#e6edf3" font-family="monospace" font-size="10">():</text>
    <rect x="148" y="67" width="5" height="18" fill="none" stroke="#f44336" stroke-width="1"/>

    <text x="35" y="100" fill="#8b949e" font-family="monospace" font-size="10">"""Returns the current</text>
    <text x="35" y="115" fill="#8b949e" font-family="monospace" font-size="10">time as a string"""</text>
    <rect x="33" y="87" width="160" height="33" fill="none" stroke="#f44336" stroke-width="1" stroke-dasharray="3,2"/>

    <text x="35" y="145" fill="#f44336" font-family="monospace" font-size="10">return</text>
    <text x="75" y="145" fill="#e6edf3" font-family="monospace" font-size="10">datetime.now().strftime(</text>
    <text x="35" y="165" fill="#ff9800" font-family="monospace" font-size="10">"%H:%M:%S"</text>
    <text x="115" y="165" fill="#e6edf3" font-family="monospace" font-size="10">)</text>
  </g>

  <!-- Arrow -->
  <line x1="360" y1="145" x2="420" y2="145" stroke="#8b949e" stroke-width="3"/>
  <polygon points="420,145 405,135 405,155" fill="#8b949e"/>
  <text x="390" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">auto-</text>
  <text x="390" y="138" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">generated</text>

  <!-- JSON Schema Box -->
  <g transform="translate(430, 55)">
    <rect x="0" y="0" width="340" height="180" rx="8" fill="#161b22" stroke="#4caf50" stroke-width="2"/>
    <text x="170" y="25" fill="#4caf50" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">JSON Schema (What LLM Sees)</text>

    <text x="20" y="55" fill="#e6edf3" font-family="monospace" font-size="9">tools = [{</text>
    <text x="35" y="72" fill="#9c27b0" font-family="monospace" font-size="9">"type"</text>
    <text x="72" y="72" fill="#e6edf3" font-family="monospace" font-size="9">:</text>
    <text x="82" y="72" fill="#ff9800" font-family="monospace" font-size="9">"function"</text>
    <text x="145" y="72" fill="#e6edf3" font-family="monospace" font-size="9">,</text>

    <text x="35" y="92" fill="#9c27b0" font-family="monospace" font-size="9">"function"</text>
    <text x="105" y="92" fill="#e6edf3" font-family="monospace" font-size="9">: {</text>

    <text x="50" y="110" fill="#9c27b0" font-family="monospace" font-size="9">"name"</text>
    <text x="88" y="110" fill="#e6edf3" font-family="monospace" font-size="9">:</text>
    <text x="98" y="110" fill="#ff9800" font-family="monospace" font-size="9">"get_current_time"</text>
    <rect x="96" y="98" width="115" height="16" fill="none" stroke="#f44336" stroke-width="1"/>
    <text x="215" y="110" fill="#e6edf3" font-family="monospace" font-size="9">,</text>

    <text x="50" y="130" fill="#9c27b0" font-family="monospace" font-size="9">"description"</text>
    <text x="138" y="130" fill="#e6edf3" font-family="monospace" font-size="9">:</text>
    <text x="148" y="130" fill="#ff9800" font-family="monospace" font-size="9">"Returns the</text>
    <text x="65" y="145" fill="#ff9800" font-family="monospace" font-size="9">current time as a string"</text>
    <rect x="145" y="118" width="173" height="31" fill="none" stroke="#f44336" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="230" y="145" fill="#e6edf3" font-family="monospace" font-size="9">,</text>

    <text x="50" y="165" fill="#9c27b0" font-family="monospace" font-size="9">"parameters"</text>
    <text x="130" y="165" fill="#e6edf3" font-family="monospace" font-size="9">: {}</text>
    <text x="35" y="180" fill="#e6edf3" font-family="monospace" font-size="9">}</text>
    <text x="20" y="195" fill="#e6edf3" font-family="monospace" font-size="9">}]</text>
  </g>

  <!-- Bottom: aisuite code -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="740" height="170" rx="8" fill="#161b22" stroke="#9c27b0" stroke-width="2"/>
    <text x="370" y="25" fill="#9c27b0" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Using with aisuite - One Line!</text>

    <text x="25" y="55" fill="#f44336" font-family="monospace" font-size="10">import</text>
    <text x="70" y="55" fill="#e6edf3" font-family="monospace" font-size="10">aisuite as ai</text>

    <text x="25" y="80" fill="#e6edf3" font-family="monospace" font-size="10">client = ai.Client()</text>

    <text x="25" y="110" fill="#e6edf3" font-family="monospace" font-size="10">response = client.chat.completions.create(</text>

    <text x="45" y="130" fill="#e6edf3" font-family="monospace" font-size="10">model=</text>
    <text x="90" y="130" fill="#ff9800" font-family="monospace" font-size="10">"openai:gpt-4o"</text>
    <text x="195" y="130" fill="#e6edf3" font-family="monospace" font-size="10">,</text>

    <text x="45" y="150" fill="#e6edf3" font-family="monospace" font-size="10">messages=messages,</text>

    <text x="45" y="170" fill="#e6edf3" font-family="monospace" font-size="10">tools=</text>
    <text x="85" y="170" fill="#4caf50" font-family="monospace" font-size="10">[get_current_time]</text>
    <text x="220" y="170" fill="#e6edf3" font-family="monospace" font-size="10">,</text>
    <rect x="82" y="158" width="140" height="16" fill="none" stroke="#4caf50" stroke-width="2"/>

    <text x="285" y="130" fill="#e6edf3" font-family="monospace" font-size="10">max_turns=5</text>
    <text x="285" y="150" fill="#e6edf3" font-family="monospace" font-size="10">)</text>

    <!-- Annotation -->
    <line x1="225" y1="170" x2="320" y2="170" stroke="#4caf50" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="480" y="170" fill="#4caf50" font-family="Inter, sans-serif" font-size="10">Just pass the function!</text>
    <text x="480" y="185" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">aisuite handles JSON schema automatically</text>
  </g>

  <!-- Legend -->
  <g transform="translate(560, 260)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#21262d"/>
    <text x="100" y="18" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Auto-Extracted From</text>
    <rect x="10" y="28" width="80" height="14" fill="none" stroke="#f44336" stroke-width="1"/>
    <text x="95" y="39" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">= function name</text>
    <rect x="10" y="46" width="80" height="14" fill="none" stroke="#f44336" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="95" y="57" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">= docstring</text>
  </g>
</svg>