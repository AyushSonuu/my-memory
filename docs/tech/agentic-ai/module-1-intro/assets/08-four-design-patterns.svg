<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Four Agentic Design Patterns</text>

  <!-- Center Hub -->
  <circle cx="400" cy="260" r="60" fill="#161b22" stroke="#ff9800" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="255" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Design</text>
  <text x="400" y="272" fill="#ff9800" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Patterns</text>

  <!-- Pattern 1: Reflection (Top Left) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="url(#greenGrad)"/>
    <rect x="0" y="20" width="200" height="15" fill="url(#greenGrad)"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Reflection</text>

    <text x="15" y="60" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold">LLM critiques its own output</text>
    <text x="15" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Generate v1 → Critique → Fix → v2</text>
    <text x="15" y="100" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Can add external feedback (errors)</text>

    <rect x="15" y="110" width="50" height="12" rx="4" fill="#4caf50"/>
    <text x="40" y="119" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Easiest</text>
  </g>
  <!-- Line to center -->
  <line x1="280" y1="145" x2="345" y2="220" stroke="#4caf50" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Pattern 2: Tool Use (Top Right) -->
  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="url(#blueGrad)"/>
    <rect x="0" y="20" width="200" height="15" fill="url(#blueGrad)"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tool Use</text>

    <text x="15" y="60" fill="#2196f3" font-family="Inter, sans-serif" font-size="10" font-weight="bold">LLM calls external functions</text>
    <text x="15" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Web search, DB query, code exec</text>
    <text x="15" y="100" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">LLM decides which tool to call</text>

    <rect x="15" y="110" width="60" height="12" rx="4" fill="#2196f3"/>
    <text x="45" y="119" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Moderate</text>
  </g>
  <!-- Line to center -->
  <line x1="520" y1="145" x2="455" y2="220" stroke="#2196f3" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Pattern 3: Planning (Bottom Left) -->
  <g transform="translate(80, 310)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="#161b22" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="url(#purpleGrad)"/>
    <rect x="0" y="20" width="200" height="15" fill="url(#purpleGrad)"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Planning</text>

    <text x="15" y="60" fill="#9c27b0" font-family="Inter, sans-serif" font-size="10" font-weight="bold">LLM decides the steps</text>
    <text x="15" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Plan written at runtime</text>
    <text x="15" y="100" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Steps not known ahead of time</text>

    <rect x="15" y="110" width="80" height="12" rx="4" fill="#9c27b0"/>
    <text x="55" y="119" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Experimental</text>
  </g>
  <!-- Line to center -->
  <line x1="280" y1="375" x2="345" y2="300" stroke="#9c27b0" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Pattern 4: Multi-Agent (Bottom Right) -->
  <g transform="translate(520, 310)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="#161b22" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="#e91e63"/>
    <rect x="0" y="20" width="200" height="15" fill="#e91e63"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Multi-Agent</text>

    <text x="15" y="60" fill="#e91e63" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Multiple specialized agents</text>
    <text x="15" y="80" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Researcher + Writer + Editor</text>
    <text x="15" y="100" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">Agents collaborate on tasks</text>

    <rect x="15" y="110" width="80" height="12" rx="4" fill="#e91e63"/>
    <text x="55" y="119" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Experimental</text>
  </g>
  <!-- Line to center -->
  <line x1="520" y1="375" x2="455" y2="300" stroke="#e91e63" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Footer -->
  <text x="400" y="475" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Control decreases left→right, top→bottom. Real workflows often combine 2-3 patterns.</text>
</svg>