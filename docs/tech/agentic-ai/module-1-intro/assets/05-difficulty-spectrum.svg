<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="350" fill="#0d1117"/>

  <!-- Title -->
  <text x="350" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Task Difficulty Spectrum for Agentic AI</text>

  <!-- Horizontal arrow (spectrum) -->
  <line x1="80" y1="80" x2="620" y2="80" stroke="#30363d" stroke-width="3"/>
  <polygon points="620,80 600,70 600,90" fill="#30363d"/>
  <text x="80" y="70" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Easier</text>
  <text x="620" y="70" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="end">Harder</text>

  <!-- Easier section -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="180" height="200" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="90" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Easier</text>
    <line x1="20" y1="45" x2="160" y2="45" stroke="#fff" opacity="0.3"/>
    <text x="90" y="70" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Clear, step-by-step</text>
    <text x="90" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">process</text>
    <text x="90" y="115" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Standard procedures</text>
    <text x="90" y="130" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">to follow</text>
    <text x="90" y="160" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Text-only assets</text>
    <text x="90" y="190" fill="#c8e6c9" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Ex: Invoice Processing</text>
  </g>

  <!-- Medium section -->
  <g transform="translate(260, 100)">
    <rect x="0" y="0" width="180" height="200" rx="10" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    <text x="90" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Medium</text>
    <line x1="20" y1="45" x2="160" y2="45" stroke="#fff" opacity="0.3"/>
    <text x="90" y="70" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Some decisions</text>
    <text x="90" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">by LLM</text>
    <text x="90" y="115" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Multiple tool calls</text>
    <text x="90" y="130" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">needed</text>
    <text x="90" y="160" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Human-in-the-loop</text>
    <text x="90" y="190" fill="#fff3e0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Ex: Customer Order Inquiry</text>
  </g>

  <!-- Harder section -->
  <g transform="translate(470, 100)">
    <rect x="0" y="0" width="180" height="200" rx="10" fill="url(#redGrad)" filter="url(#shadow)"/>
    <text x="90" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Harder</text>
    <line x1="20" y1="45" x2="160" y2="45" stroke="#fff" opacity="0.3"/>
    <text x="90" y="70" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Steps NOT known</text>
    <text x="90" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">ahead of time</text>
    <text x="90" y="115" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Plan/solve</text>
    <text x="90" y="130" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">as you go</text>
    <text x="90" y="160" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Multimodal</text>
    <text x="90" y="175" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">(vision, audio)</text>
    <text x="90" y="195" fill="#ffcdd2" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Ex: Visual Computer Use</text>
  </g>

  <!-- Bottom insight -->
  <rect x="100" y="310" width="500" height="30" rx="6" fill="#161b22"/>
  <text x="350" y="330" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Most valuable production apps today are on the "Easier" end of the spectrum</text>
</svg>