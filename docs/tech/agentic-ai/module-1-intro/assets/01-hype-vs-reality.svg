<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="350" fill="#0d1117"/>

  <!-- Title -->
  <text x="350" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Agentic AI: Hype vs Reality</text>

  <!-- Hype Box -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="180" height="120" rx="12" fill="url(#redGrad)" filter="url(#shadow)"/>
    <text x="90" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">Hype</text>
    <text x="90" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Marketers slapped "agent"</text>
    <text x="90" y="75" fill="#fff" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">on everything</text>
    <text x="90" y="100" fill="#ffcdd2" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">ignore this</text>
  </g>

  <!-- Arrow from Hype to X -->
  <line x1="240" y1="130" x2="280" y2="160" stroke="#f44336" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="295" y="175" fill="#666" font-family="Inter, sans-serif" font-size="20">X</text>

  <!-- Real Value Box -->
  <g transform="translate(260, 70)">
    <rect x="0" y="0" width="180" height="120" rx="12" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="90" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="22" text-anchor="middle">Real Value</text>
    <text x="90" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Growing fast, valuable</text>
    <text x="90" y="75" fill="#fff" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">apps being built NOW</text>
    <text x="90" y="100" fill="#c8e6c9" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">focus on this</text>
  </g>

  <!-- Arrow from Real to Skill -->
  <line x1="450" y1="130" x2="490" y2="130" stroke="#4caf50" stroke-width="3"/>
  <polygon points="490,130 480,124 480,136" fill="#4caf50"/>

  <!-- #1 Skill Gap Box -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="180" height="120" rx="12" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    <text x="90" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">#1 Skill Gap</text>
    <text x="90" y="55" fill="#fff" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Disciplined</text>
    <text x="90" y="72" fill="#fff" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Dev Process</text>
    <line x1="30" y1="85" x2="150" y2="85" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <text x="90" y="105" fill="#fff3e0" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Evals + Error Analysis</text>
  </g>

  <!-- Bottom insight -->
  <rect x="100" y="220" width="500" height="80" rx="8" fill="#161b22" stroke="#ff9800" stroke-width="2"/>
  <text x="350" y="250" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">The builder who knows how to debug beats</text>
  <text x="350" y="270" fill="#e6edf3" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">the one who only knows how to demo</text>
  <text x="350" y="295" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">- DeepLearning.AI Course Insight</text>
</svg>