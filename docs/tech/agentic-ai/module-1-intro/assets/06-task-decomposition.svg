<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Task Decomposition Process</text>

  <!-- Main Flow -->
  <!-- Step 1: Big Task -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#161b22" stroke="#f44336" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="30" fill="#f44336" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Complex Task</text>
    <text x="70" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(what a human does)</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="195" y1="115" x2="240" y2="115" stroke="#8b949e" stroke-width="2"/>
  <polygon points="240,115 230,109 230,121" fill="#8b949e"/>

  <!-- Step 2: Question -->
  <g transform="translate(245, 80)">
    <rect x="0" y="0" width="160" height="70" rx="35" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="30" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Can ONE LLM call</text>
    <text x="80" y="48" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">handle it?</text>
  </g>

  <!-- Yes branch (up) -->
  <line x1="325" y1="80" x2="325" y2="50" stroke="#4caf50" stroke-width="2"/>
  <text x="340" y="45" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Yes</text>
  <line x1="325" y1="50" x2="500" y2="50" stroke="#4caf50" stroke-width="2"/>
  <rect x="500" y="35" width="100" height="30" rx="6" fill="url(#greenGrad)"/>
  <text x="550" y="55" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Done!</text>

  <!-- No branch (down) -->
  <line x1="325" y1="150" x2="325" y2="180" stroke="#f44336" stroke-width="2"/>
  <text x="340" y="175" fill="#f44336" font-family="Inter, sans-serif" font-size="10" font-weight="bold">No</text>
  <polygon points="325,180 319,170 331,170" fill="#f44336"/>

  <!-- Decompose box -->
  <g transform="translate(245, 190)">
    <rect x="0" y="0" width="160" height="50" rx="10" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    <text x="80" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Decompose into steps</text>
  </g>

  <!-- Arrow down from decompose -->
  <line x1="325" y1="240" x2="325" y2="260" stroke="#8b949e" stroke-width="2"/>
  <polygon points="325,265 319,255 331,255" fill="#8b949e"/>

  <!-- Three steps -->
  <rect x="140" y="275" width="80" height="40" rx="8" fill="url(#blueGrad)"/>
  <text x="180" y="300" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Step 1</text>

  <rect x="285" y="275" width="80" height="40" rx="8" fill="url(#blueGrad)"/>
  <text x="325" y="300" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Step 2</text>

  <rect x="430" y="275" width="80" height="40" rx="8" fill="url(#blueGrad)"/>
  <text x="470" y="300" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Step 3</text>

  <!-- Lines connecting decompose to steps -->
  <line x1="245" y1="240" x2="180" y2="275" stroke="#8b949e" stroke-width="1"/>
  <line x1="405" y1="240" x2="470" y2="275" stroke="#8b949e" stroke-width="1"/>

  <!-- Question for each step -->
  <line x1="180" y1="315" x2="180" y2="350" stroke="#8b949e" stroke-width="1"/>
  <line x1="325" y1="315" x2="325" y2="350" stroke="#8b949e" stroke-width="1"/>
  <line x1="470" y1="315" x2="470" y2="350" stroke="#8b949e" stroke-width="1"/>

  <!-- Unified question box -->
  <rect x="100" y="355" width="450" height="50" rx="35" fill="#161b22" stroke="#9c27b0" stroke-width="2"/>
  <text x="325" y="385" fill="#9c27b0" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Can each step be done by LLM or tool?</text>

  <!-- Yes/No branches -->
  <line x1="220" y1="405" x2="220" y2="435" stroke="#4caf50" stroke-width="2"/>
  <text x="185" y="445" fill="#4caf50" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Yes</text>
  <rect x="180" y="445" width="80" height="25" rx="6" fill="url(#greenGrad)"/>
  <text x="220" y="462" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Build it!</text>

  <line x1="430" y1="405" x2="430" y2="435" stroke="#f44336" stroke-width="2"/>
  <text x="445" y="445" fill="#f44336" font-family="Inter, sans-serif" font-size="9" font-weight="bold">No</text>
  <rect x="390" y="445" width="80" height="25" rx="6" fill="url(#purpleGrad)"/>
  <text x="430" y="462" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Split more</text>

  <!-- Loop back arrow -->
  <path d="M 470 445 Q 520 380 520 240 Q 520 200 405 215" stroke="#9c27b0" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <polygon points="405,215 415,209 415,221" fill="#9c27b0"/>

  <!-- Right side: Key Question -->
  <g transform="translate(580, 160)">
    <rect x="0" y="0" width="190" height="200" rx="12" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="190" height="40" rx="12" fill="url(#blueGrad)"/>
    <rect x="0" y="25" width="190" height="15" fill="url(#blueGrad)"/>
    <text x="95" y="26" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">The Key Question</text>

    <text x="95" y="70" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">"Can this step be done</text>
    <text x="95" y="85" fill="#e6edf3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">by either:"</text>

    <text x="25" y="110" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">• An LLM</text>
    <text x="25" y="128" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">• Short code</text>
    <text x="25" y="146" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">• Function call</text>
    <text x="25" y="164" fill="#4caf50" font-family="Inter, sans-serif" font-size="9">• Tool</text>

    <text x="95" y="190" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Ask at EVERY level</text>
  </g>
</svg>