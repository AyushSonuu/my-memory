<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#4b5563"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Parallelization for Speed</text>

  <!-- Input -->
  <rect x="30" y="200" width="100" height="60" rx="8" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="80" y="225" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Write an essay</text>
  <text x="80" y="240" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">about black holes</text>

  <!-- First level: 3 parallel searches -->
  <text x="260" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">3 parallel searches</text>

  <!-- LLM boxes level 1 -->
  <rect x="170" y="70" width="45" height="30" rx="4" fill="url(#grayGrad)"/>
  <text x="192" y="90" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM</text>

  <rect x="170" y="200" width="45" height="30" rx="4" fill="url(#grayGrad)"/>
  <text x="192" y="220" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM</text>

  <rect x="170" y="330" width="45" height="30" rx="4" fill="url(#grayGrad)"/>
  <text x="192" y="350" fill="#fff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">LLM</text>

  <!-- Arrows from input to LLMs -->
  <path d="M 130 215 L 165 85" stroke="#8b949e" stroke-width="1.5" fill="none"/>
  <path d="M 130 230 L 165 215" stroke="#8b949e" stroke-width="1.5" fill="none"/>
  <path d="M 130 245 L 165 345" stroke="#8b949e" stroke-width="1.5" fill="none"/>

  <!-- Web search boxes level 1 -->
  <rect x="240" y="70" width="55" height="30" rx="4" fill="url(#greenGrad)"/>
  <text x="267" y="90" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">web search</text>

  <rect x="240" y="200" width="55" height="30" rx="4" fill="url(#greenGrad)"/>
  <text x="267" y="220" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">web search</text>

  <rect x="240" y="330" width="55" height="30" rx="4" fill="url(#greenGrad)"/>
  <text x="267" y="350" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">web search</text>

  <!-- Arrows LLM to web search -->
  <line x1="215" y1="85" x2="235" y2="85" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="215" y1="215" x2="235" y2="215" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="215" y1="345" x2="235" y2="345" stroke="#8b949e" stroke-width="1.5"/>

  <!-- Second level: 9 parallel fetches -->
  <text x="510" y="25" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">9 parallel web page downloads</text>

  <!-- Fetch top 3 results text -->
  <text x="340" y="155" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Fetch top 3</text>
  <text x="340" y="168" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">results</text>

  <!-- Branching structure - top branch -->
  <line x1="295" y1="85" x2="340" y2="50" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="295" y1="85" x2="340" y2="85" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="295" y1="85" x2="340" y2="120" stroke="#8b949e" stroke-width="1.5"/>

  <!-- Middle branch -->
  <line x1="295" y1="215" x2="340" y2="180" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="295" y1="215" x2="340" y2="215" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="295" y1="215" x2="340" y2="250" stroke="#8b949e" stroke-width="1.5"/>

  <!-- Bottom branch -->
  <line x1="295" y1="345" x2="340" y2="310" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="295" y1="345" x2="340" y2="345" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="295" y1="345" x2="340" y2="380" stroke="#8b949e" stroke-width="1.5"/>

  <!-- LLM + web fetch pairs (9 total) -->
  <!-- Row 1 -->
  <rect x="345" y="35" width="35" height="25" rx="3" fill="url(#grayGrad)"/>
  <text x="362" y="52" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM</text>
  <rect x="385" y="35" width="45" height="25" rx="3" fill="url(#greenGrad)"/>
  <text x="407" y="52" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">web fetch</text>

  <rect x="345" y="68" width="35" height="25" rx="3" fill="url(#grayGrad)"/>
  <text x="362" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM</text>
  <rect x="385" y="68" width="45" height="25" rx="3" fill="url(#greenGrad)"/>
  <text x="407" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">web fetch</text>

  <rect x="345" y="101" width="35" height="25" rx="3" fill="url(#grayGrad)"/>
  <text x="362" y="118" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM</text>
  <rect x="385" y="101" width="45" height="25" rx="3" fill="url(#greenGrad)"/>
  <text x="407" y="118" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">web fetch</text>

  <!-- Row 2 -->
  <rect x="345" y="165" width="35" height="25" rx="3" fill="url(#grayGrad)"/>
  <text x="362" y="182" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM</text>
  <rect x="385" y="165" width="45" height="25" rx="3" fill="url(#greenGrad)"/>
  <text x="407" y="182" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">web fetch</text>

  <rect x="345" y="198" width="35" height="25" rx="3" fill="url(#grayGrad)"/>
  <text x="362" y="215" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM</text>
  <rect x="385" y="198" width="45" height="25" rx="3" fill="url(#greenGrad)"/>
  <text x="407" y="215" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">web fetch</text>

  <rect x="345" y="231" width="35" height="25" rx="3" fill="url(#grayGrad)"/>
  <text x="362" y="248" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM</text>
  <rect x="385" y="231" width="45" height="25" rx="3" fill="url(#greenGrad)"/>
  <text x="407" y="248" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">web fetch</text>

  <!-- Row 3 -->
  <rect x="345" y="295" width="35" height="25" rx="3" fill="url(#grayGrad)"/>
  <text x="362" y="312" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM</text>
  <rect x="385" y="295" width="45" height="25" rx="3" fill="url(#greenGrad)"/>
  <text x="407" y="312" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">web fetch</text>

  <rect x="345" y="328" width="35" height="25" rx="3" fill="url(#grayGrad)"/>
  <text x="362" y="345" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM</text>
  <rect x="385" y="328" width="45" height="25" rx="3" fill="url(#greenGrad)"/>
  <text x="407" y="345" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">web fetch</text>

  <rect x="345" y="361" width="35" height="25" rx="3" fill="url(#grayGrad)"/>
  <text x="362" y="378" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">LLM</text>
  <rect x="385" y="361" width="45" height="25" rx="3" fill="url(#greenGrad)"/>
  <text x="407" y="378" fill="#fff" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">web fetch</text>

  <!-- Globe icons -->
  <circle cx="460" cy="47" r="10" fill="#21262d" stroke="#8b949e"/>
  <circle cx="460" cy="80" r="10" fill="#21262d" stroke="#8b949e"/>
  <circle cx="460" cy="113" r="10" fill="#21262d" stroke="#8b949e"/>
  <circle cx="460" cy="177" r="10" fill="#21262d" stroke="#8b949e"/>
  <circle cx="460" cy="210" r="10" fill="#21262d" stroke="#8b949e"/>
  <circle cx="460" cy="243" r="10" fill="#21262d" stroke="#8b949e"/>
  <circle cx="460" cy="307" r="10" fill="#21262d" stroke="#8b949e"/>
  <circle cx="460" cy="340" r="10" fill="#21262d" stroke="#8b949e"/>
  <circle cx="460" cy="373" r="10" fill="#21262d" stroke="#8b949e"/>

  <!-- Converging arrows to final LLM -->
  <line x1="475" y1="47" x2="550" y2="200" stroke="#8b949e" stroke-width="1"/>
  <line x1="475" y1="80" x2="550" y2="200" stroke="#8b949e" stroke-width="1"/>
  <line x1="475" y1="113" x2="550" y2="200" stroke="#8b949e" stroke-width="1"/>
  <line x1="475" y1="177" x2="550" y2="210" stroke="#8b949e" stroke-width="1"/>
  <line x1="475" y1="210" x2="550" y2="215" stroke="#8b949e" stroke-width="1"/>
  <line x1="475" y1="243" x2="550" y2="220" stroke="#8b949e" stroke-width="1"/>
  <line x1="475" y1="307" x2="550" y2="230" stroke="#8b949e" stroke-width="1"/>
  <line x1="475" y1="340" x2="550" y2="230" stroke="#8b949e" stroke-width="1"/>
  <line x1="475" y1="373" x2="550" y2="235" stroke="#8b949e" stroke-width="1"/>

  <!-- Final LLM -->
  <rect x="555" y="190" width="55" height="50" rx="6" fill="url(#grayGrad)" filter="url(#shadow)"/>
  <text x="582" y="220" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LLM</text>

  <!-- Arrow to output -->
  <line x1="615" y1="215" x2="650" y2="215" stroke="#8b949e" stroke-width="2"/>
  <polygon points="650,215 640,209 640,221" fill="#8b949e"/>

  <!-- Output document -->
  <rect x="660" y="185" width="60" height="60" rx="6" fill="#21262d" stroke="#4caf50" stroke-width="2"/>
  <line x1="670" y1="200" x2="710" y2="200" stroke="#8b949e" stroke-width="1"/>
  <line x1="670" y1="212" x2="710" y2="212" stroke="#8b949e" stroke-width="1"/>
  <line x1="670" y1="224" x2="700" y2="224" stroke="#8b949e" stroke-width="1"/>

  <!-- Bottom summary -->
  <rect x="100" y="420" width="600" height="60" rx="8" fill="#161b22" stroke="#2196f3" stroke-width="2"/>
  <text x="400" y="445" fill="#e6edf3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Human reads 9 pages ONE AT A TIME. Agent downloads all 9 in PARALLEL.</text>
  <text x="400" y="465" fill="#4caf50" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WAY faster than human sequential processing!</text>
</svg>