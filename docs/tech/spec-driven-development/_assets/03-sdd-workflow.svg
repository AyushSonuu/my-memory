<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500">
  <defs>
    <linearGradient id="constGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="100%" style="stop-color:#c2185b"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="replanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadowWf">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="425" y="35" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">The Complete SDD Workflow</text>

  <!-- CONSTITUTION (Top) -->
  <g transform="translate(250, 55)">
    <rect x="0" y="0" width="350" height="130" rx="16" fill="#161b22" stroke="#e91e63" stroke-width="3" filter="url(#shadowWf)"/>
    <rect x="0" y="0" width="350" height="40" rx="16" fill="url(#constGrad)"/>
    <text x="175" y="27" fill="#fff" font-family="Inter, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">📜 CONSTITUTION (One-time, then evolving)</text>

    <!-- Three pillars -->
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="100" height="60" rx="6" fill="#21262d"/>
      <text x="50" y="20" fill="#e91e63" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🎯 Mission</text>
      <text x="50" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Vision, audience</text>
      <text x="50" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">scope, the "why"</text>
    </g>
    <g transform="translate(125, 55)">
      <rect x="0" y="0" width="100" height="60" rx="6" fill="#21262d"/>
      <text x="50" y="20" fill="#e91e63" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🛠️ Tech Stack</text>
      <text x="50" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Architecture,</text>
      <text x="50" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">tools, constraints</text>
    </g>
    <g transform="translate(235, 55)">
      <rect x="0" y="0" width="100" height="60" rx="6" fill="#21262d"/>
      <text x="50" y="20" fill="#e91e63" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🗺️ Roadmap</text>
      <text x="50" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Phases, features</text>
      <text x="50" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(living doc)</text>
    </g>
  </g>

  <!-- Arrow: Constitution to Feature Loop -->
  <path d="M 425 190 L 425 220" stroke="#e91e63" stroke-width="3" marker-end="url(#arrowPink)"/>

  <!-- FEATURE LOOP (Center) -->
  <g transform="translate(150, 230)">
    <rect x="0" y="0" width="550" height="120" rx="16" fill="#161b22" stroke="#4caf50" stroke-width="3" filter="url(#shadowWf)"/>
    <rect x="0" y="0" width="550" height="35" rx="16" fill="url(#loopGrad)"/>
    <text x="275" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔁 FEATURE LOOP (Repeat for each feature)</text>

    <!-- Plan → Implement → Validate -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#1f6feb" opacity="0.3"/>
      <text x="70" y="22" fill="#58a6ff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">📝 Plan</text>
      <text x="70" y="40" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Feature spec + requirements</text>
    </g>

    <path d="M 180 80 L 210 80" stroke="#4caf50" stroke-width="3" marker-end="url(#arrowGreen)"/>

    <g transform="translate(220, 55)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#4caf50" opacity="0.3"/>
      <text x="70" y="22" fill="#4caf50" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚙️ Implement</text>
      <text x="70" y="40" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Agent codes from spec</text>
    </g>

    <path d="M 370 80 L 400 80" stroke="#4caf50" stroke-width="3" marker-end="url(#arrowGreen)"/>

    <g transform="translate(410, 55)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#ff9800" opacity="0.3"/>
      <text x="55" y="22" fill="#ff9800" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✅ Validate</text>
      <text x="55" y="40" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Review + accept</text>
    </g>
  </g>

  <!-- Arrow: Feature Loop to Replan -->
  <path d="M 425 355 L 425 385" stroke="#4caf50" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- REPLAN (Bottom) -->
  <g transform="translate(275, 395)">
    <rect x="0" y="0" width="300" height="80" rx="16" fill="#161b22" stroke="#ff9800" stroke-width="3" filter="url(#shadowWf)"/>
    <rect x="0" y="0" width="300" height="35" rx="16" fill="url(#replanGrad)"/>
    <text x="150" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔄 REPLAN</text>
    <text x="150" y="55" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Revise constitution • Update roadmap</text>
    <text x="150" y="70" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Improve the process itself</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 580 435 C 650 435, 700 350, 700 290 C 700 230, 650 200, 600 200" stroke="#ff9800" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <polygon points="600,200 610,195 610,205" fill="#ff9800"/>
  <text x="720" y="320" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" transform="rotate(90, 720, 320)">next feature</text>

  <!-- Side annotations -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="100" height="70" rx="6" fill="#21262d"/>
    <text x="50" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">YOU</text>
    <text x="50" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Architect</text>
    <text x="50" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Supervisor</text>
    <text x="50" y="66" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Reviewer</text>
  </g>

  <g transform="translate(720, 260)">
    <rect x="0" y="0" width="100" height="70" rx="6" fill="#21262d"/>
    <text x="50" y="20" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AGENT</text>
    <text x="50" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Builder</text>
    <text x="50" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Implementer</text>
    <text x="50" y="66" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Self-validator</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e91e63"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4caf50"/>
    </marker>
  </defs>
</svg>