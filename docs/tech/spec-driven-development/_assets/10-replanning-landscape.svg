<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="replanCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="featureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="projectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="workflowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <filter id="shadowRp">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">The Replanning Landscape</text>
  <text x="400" y="52" fill="#8b949e" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">"You have to run slow to run fast"</text>

  <!-- Center Hub: REPLAN -->
  <g transform="translate(325, 180)">
    <circle cx="75" cy="75" r="70" fill="url(#replanCenterGrad)" filter="url(#shadowRp)"/>
    <text x="75" y="65" fill="#fff" font-family="Inter, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">🔄</text>
    <text x="75" y="90" fill="#fff" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">REPLAN</text>
  </g>

  <!-- Feature-Level (Top Left) -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="#161b22" stroke="#2196f3" stroke-width="2" filter="url(#shadowRp)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="url(#featureGrad)"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📝 FEATURE-LEVEL</text>

    <text x="15" y="55" fill="#58a6ff" font-family="Inter, sans-serif" font-size="10" font-weight="bold">What changes:</text>
    <text x="15" y="72" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Specs + code from recent feature</text>

    <text x="15" y="95" fill="#58a6ff" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Example:</text>
    <text x="15" y="112" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Add testing framework</text>
    <text x="15" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Fix responsive design</text>
  </g>

  <!-- Connection line: Feature to Center -->
  <line x1="250" y1="135" x2="330" y2="210" stroke="#2196f3" stroke-width="2"/>

  <!-- Project-Level (Top Right) -->
  <g transform="translate(550, 70)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="#161b22" stroke="#4caf50" stroke-width="2" filter="url(#shadowRp)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="url(#projectGrad)"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📜 PROJECT-LEVEL</text>

    <text x="15" y="55" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold">What changes:</text>
    <text x="15" y="72" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Constitution + Roadmap</text>

    <text x="15" y="95" fill="#4caf50" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Example:</text>
    <text x="15" y="112" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Consolidate phases 2-5</text>
    <text x="15" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Add new requirements</text>
  </g>

  <!-- Connection line: Project to Center -->
  <line x1="550" y1="135" x2="470" y2="210" stroke="#4caf50" stroke-width="2"/>

  <!-- Workflow-Level (Bottom Center) -->
  <g transform="translate(300, 340)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="#161b22" stroke="#ff9800" stroke-width="2" filter="url(#shadowRp)"/>
    <rect x="0" y="0" width="200" height="35" rx="12" fill="url(#workflowGrad)"/>
    <text x="100" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚡ WORKFLOW-LEVEL</text>

    <text x="15" y="55" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold">What changes:</text>
    <text x="15" y="72" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Your SDD process itself</text>

    <text x="15" y="95" fill="#ff9800" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Example:</text>
    <text x="15" y="112" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Build agent skills</text>
    <text x="15" y="125" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">• Automate validation</text>
  </g>

  <!-- Connection line: Workflow to Center -->
  <line x1="400" y1="340" x2="400" y2="310" stroke="#ff9800" stroke-width="2"/>

  <!-- Product Updates (Bottom Left) -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="180" height="90" rx="8" fill="#21262d"/>
    <text x="90" y="22" fill="#e91e63" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📋 Product Updates</text>
    <text x="90" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">PM sends new requirements</text>
    <text x="90" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Small → implement now</text>
    <text x="90" y="79" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Big → schedule as phase</text>
  </g>

  <!-- Connection: Product to Center -->
  <line x1="230" y1="355" x2="310" y2="290" stroke="#e91e63" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Retroactive Updates (Bottom Right) -->
  <g transform="translate(570, 310)">
    <rect x="0" y="0" width="180" height="90" rx="8" fill="#21262d"/>
    <text x="90" y="22" fill="#ce93d8" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔧 Retroactive</text>
    <text x="90" y="45" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Apply changes to</text>
    <text x="90" y="62" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">existing features</text>
    <text x="90" y="79" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(update specs + code)</text>
  </g>

  <!-- Connection: Retroactive to Center -->
  <line x1="570" y1="355" x2="490" y2="290" stroke="#ce93d8" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Bottom insight -->
  <text x="400" y="460" fill="#8b949e" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Most of your work = planning + validation. Make time between features to replan.</text>
</svg>