<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560">
  <defs>
    <linearGradient id="greedyG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#546e7a"/>
      <stop offset="100%" style="stop-color:#263238"/>
    </linearGradient>
    <linearGradient id="randG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="topkG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ab47bc"/>
      <stop offset="100%" style="stop-color:#6a1b9a"/>
    </linearGradient>
    <linearGradient id="toppG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26a69a"/>
      <stop offset="100%" style="stop-color:#00695c"/>
    </linearGradient>
    <linearGradient id="coolTempG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <linearGradient id="hotTempG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef5350"/>
      <stop offset="100%" style="stop-color:#b71c1c"/>
    </linearGradient>
    <filter id="shadow08">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="560" fill="#0d1117"/>

  <!-- Title -->
  <text x="460" y="28" fill="#e6edf3" font-family="Inter, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Generative Configuration Parameters for Inference</text>
  <text x="460" y="46" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Inference-time knobs — NOT training weights · Control length and creativity</text>

  <!-- ═══ TOP ROW: max_new_tokens + greedy/random ═══ -->

  <!-- max_new_tokens card -->
  <g transform="translate(20, 65)" filter="url(#shadow08)">
    <rect x="0" y="0" width="220" height="195" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="28" rx="10" fill="#ff9800"/>
    <rect x="0" y="18" width="220" height="10" fill="#ff9800"/>
    <text x="110" y="19" fill="#0d1117" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">max_new_tokens</text>
    <text x="110" y="46" fill="#ffcc80" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Cap on selection loop iterations</text>
    <text x="110" y="58" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">NOT a hard count — stop token ends it</text>
    <!-- bars -->
    <text x="20" y="80" fill="#ff9800" font-family="Inter, sans-serif" font-size="8">= 100</text>
    <rect x="60" y="70" width="100" height="12" rx="3" fill="#1565c0"/>
    <text x="20" y="108" fill="#ff9800" font-family="Inter, sans-serif" font-size="8">= 150</text>
    <rect x="60" y="98" width="140" height="12" rx="3" fill="#1565c0"/>
    <text x="20" y="136" fill="#ff9800" font-family="Inter, sans-serif" font-size="8">= 200</text>
    <rect x="60" y="126" width="128" height="12" rx="3" fill="#1565c0"/>
    <rect x="188" y="126" width="14" height="12" rx="2" fill="#e91e63"/>
    <text x="110" y="156" fill="#e91e63" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">↑ stop token hit early</text>
    <text x="110" y="172" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">(set=200, actual=160)</text>
    <rect x="20" y="180" width="180" height="1" fill="#30363d"/>
  </g>

  <!-- greedy vs random card -->
  <g transform="translate(252, 65)" filter="url(#shadow08)">
    <rect x="0" y="0" width="310" height="195" rx="10" fill="#161b22" stroke="#546e7a" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="28" rx="10" fill="url(#greedyG)"/>
    <rect x="0" y="18" width="310" height="10" fill="url(#greedyG)"/>
    <text x="155" y="19" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Greedy vs Random Sampling</text>

    <!-- Greedy half -->
    <g transform="translate(10, 36)">
      <rect x="0" y="0" width="137" height="145" rx="6" fill="#0d1117" stroke="#546e7a" stroke-width="1"/>
      <text x="68" y="16" fill="#90a4ae" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🔒 Greedy (default)</text>
      <text x="68" y="30" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Always pick highest prob</text>
      <!-- token table -->
      <rect x="8" y="37" width="52" height="12" rx="2" fill="#1565c0"/>
      <text x="34" y="47" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">0.20 cake ✅</text>
      <rect x="8" y="51" width="52" height="12" rx="2" fill="#21262d"/>
      <text x="34" y="61" fill="#484f58" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">0.10 donut</text>
      <rect x="8" y="65" width="52" height="12" rx="2" fill="#21262d"/>
      <text x="34" y="75" fill="#484f58" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">0.02 banana</text>
      <rect x="8" y="79" width="52" height="12" rx="2" fill="#21262d"/>
      <text x="34" y="89" fill="#484f58" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">0.01 apple</text>
      <text x="68" y="118" fill="#ef5350" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">❌ repetitive on</text>
      <text x="68" y="128" fill="#ef5350" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">long outputs</text>
      <text x="68" y="140" fill="#66bb6a" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">✅ good for short</text>
    </g>

    <!-- Random half -->
    <g transform="translate(158, 36)">
      <rect x="0" y="0" width="137" height="145" rx="6" fill="#0d1117" stroke="#42a5f5" stroke-width="1"/>
      <text x="68" y="16" fill="#90caf9" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🎲 Random Sampling</text>
      <text x="68" y="30" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Prob-weighted random pick</text>
      <!-- token table with random pick -->
      <rect x="8" y="37" width="52" height="12" rx="2" fill="#21262d"/>
      <text x="34" y="47" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">0.20 cake</text>
      <rect x="8" y="51" width="52" height="12" rx="2" fill="#21262d"/>
      <text x="34" y="61" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">0.10 donut</text>
      <rect x="8" y="65" width="52" height="12" rx="2" fill="#1565c0"/>
      <text x="34" y="75" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">0.02 banana ✅</text>
      <rect x="8" y="79" width="52" height="12" rx="2" fill="#21262d"/>
      <text x="34" y="89" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">0.01 apple</text>
      <text x="68" y="110" fill="#66bb6a" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">✅ less repetition</text>
      <text x="68" y="122" fill="#ef5350" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">⚠️ can wander</text>
      <text x="68" y="136" fill="#42a5f5" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">do_sample=True</text>
    </g>
  </g>

  <!-- ═══ BOTTOM-LEFT: Top-K and Top-P ═══ -->

  <!-- Top-K -->
  <g transform="translate(20, 278)" filter="url(#shadow08)">
    <rect x="0" y="0" width="265" height="260" rx="10" fill="#161b22" stroke="#ab47bc" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="10" fill="url(#topkG)"/>
    <rect x="0" y="18" width="265" height="10" fill="url(#topkG)"/>
    <text x="132" y="19" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Top-K Sampling</text>
    <text x="132" y="46" fill="#ce93d8" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Choose randomly from K highest-prob tokens</text>

    <!-- visual: k=3 box around top 3 -->
    <text x="60" y="72" fill="#ab47bc" font-family="Inter, sans-serif" font-size="10" font-weight="bold">k = 3</text>
    <!-- outer box around top 3 -->
    <rect x="90" y="58" width="150" height="70" rx="5" fill="none" stroke="#ab47bc" stroke-width="2" stroke-dasharray="4,2"/>
    <rect x="95" y="62" width="140" height="18" rx="3" fill="#21262d"/>
    <text x="165" y="75" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">0.20  cake</text>
    <rect x="95" y="83" width="140" height="18" rx="3" fill="#1565c0"/>
    <text x="165" y="96" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">0.10  donut  ← picked</text>
    <rect x="95" y="104" width="140" height="18" rx="3" fill="#21262d"/>
    <text x="165" y="117" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">0.02  banana</text>
    <!-- excluded -->
    <rect x="95" y="130" width="140" height="16" rx="3" fill="#0d1117" opacity="0.5"/>
    <text x="165" y="142" fill="#484f58" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.01  apple  ✗ excluded</text>
    <text x="165" y="157" fill="#484f58" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">...  ✗ excluded</text>

    <rect x="20" y="170" width="225" height="80" rx="6" fill="#1e0a2e"/>
    <text x="132" y="188" fill="#ce93d8" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">How to think about it</text>
    <text x="132" y="204" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"Give me the top 25 candidates,</text>
    <text x="132" y="217" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle"> then sample randomly from them"</text>
    <text x="132" y="234" fill="#ab47bc" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Fixed number of candidates</text>
  </g>

  <!-- Top-P -->
  <g transform="translate(297, 278)" filter="url(#shadow08)">
    <rect x="0" y="0" width="265" height="260" rx="10" fill="#161b22" stroke="#26a69a" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="10" fill="url(#toppG)"/>
    <rect x="0" y="18" width="265" height="10" fill="url(#toppG)"/>
    <text x="132" y="19" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Top-P Sampling (Nucleus)</text>
    <text x="132" y="46" fill="#80cbc4" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Cumulative prob ≤ P threshold</text>

    <!-- visual: p=0.30 -->
    <text x="60" y="72" fill="#26a69a" font-family="Inter, sans-serif" font-size="10" font-weight="bold">p = 0.30</text>
    <rect x="90" y="58" width="150" height="70" rx="5" fill="none" stroke="#26a69a" stroke-width="2" stroke-dasharray="4,2"/>
    <rect x="95" y="62" width="140" height="18" rx="3" fill="#21262d"/>
    <text x="165" y="75" fill="#e6edf3" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">0.20  cake  (sum=0.20)</text>
    <rect x="95" y="83" width="140" height="18" rx="3" fill="#1565c0"/>
    <text x="165" y="96" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">0.10  donut  (sum=0.30 ✅)</text>
    <!-- cutoff line -->
    <line x1="90" y1="103" x2="240" y2="103" stroke="#26a69a" stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="95" y="106" width="140" height="16" rx="3" fill="#0d1117" opacity="0.5"/>
    <text x="165" y="118" fill="#484f58" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">0.02  banana  (sum=0.32 ✗)</text>
    <text x="165" y="133" fill="#484f58" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">...  ✗ excluded</text>

    <rect x="20" y="170" width="225" height="80" rx="6" fill="#0a2018"/>
    <text x="132" y="188" fill="#80cbc4" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">How to think about it</text>
    <text x="132" y="204" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">"Include tokens until we've covered</text>
    <text x="132" y="217" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle"> 30% of the probability mass"</text>
    <text x="132" y="234" fill="#26a69a" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Dynamic number of candidates</text>
  </g>

  <!-- ═══ RIGHT: Temperature ═══ -->
  <g transform="translate(574, 65)" filter="url(#shadow08)">
    <rect x="0" y="0" width="325" height="473" rx="12" fill="#161b22" stroke="#ff7043" stroke-width="2"/>
    <rect x="0" y="0" width="325" height="32" rx="12" fill="#ff7043"/>
    <rect x="0" y="20" width="325" height="12" fill="#ff7043"/>
    <text x="162" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🌡️ Temperature</text>
    <text x="162" y="50" fill="#ffccbc" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Reshapes the softmax distribution itself</text>
    <text x="162" y="64" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Unlike top-k/p (filter after), temperature changes the predictions</text>

    <!-- Cool temperature -->
    <g transform="translate(15, 80)">
      <rect x="0" y="0" width="140" height="175" rx="8" fill="#0d1d2e" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="70" y="18" fill="#42a5f5" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">❄️ Cool  (&lt; 1)</text>
      <!-- prob table -->
      <text x="15" y="38" fill="#90caf9" font-family="ui-monospace, monospace" font-size="8">0.001  apple</text>
      <text x="15" y="50" fill="#90caf9" font-family="ui-monospace, monospace" font-size="8">0.002  banana</text>
      <text x="15" y="62" fill="#fff" font-family="ui-monospace, monospace" font-size="8" font-weight="bold">0.400  cake ◄</text>
      <text x="15" y="74" fill="#90caf9" font-family="ui-monospace, monospace" font-size="8">0.012  donut</text>
      <!-- distribution bar (strongly peaked) -->
      <rect x="5" y="90" width="5" height="5" rx="1" fill="#42a5f5"/>
      <rect x="5" y="83" width="5" height="7" rx="1" fill="#42a5f5"/>
      <rect x="5" y="62" width="5" height="28" rx="1" fill="#42a5f5"/>
      <rect x="5" y="79" width="5" height="4" rx="1" fill="#42a5f5"/>
      <text x="70" y="120" fill="#42a5f5" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Strongly peaked</text>
      <text x="70" y="133" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Deterministic,</text>
      <text x="70" y="144" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">follows training</text>
      <text x="70" y="160" fill="#42a5f5" font-family="Inter, sans-serif" font-size="7" font-style="italic" text-anchor="middle">use for factual Q&amp;A</text>
    </g>

    <!-- Temperature = 1 label -->
    <text x="162" y="182" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">= 1 → default softmax</text>

    <!-- Hot temperature -->
    <g transform="translate(170, 80)">
      <rect x="0" y="0" width="140" height="175" rx="8" fill="#2a1408" stroke="#ef5350" stroke-width="1.5"/>
      <text x="70" y="18" fill="#ef5350" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🔥 Hot  (&gt; 1)</text>
      <!-- prob table (flatter) -->
      <text x="15" y="38" fill="#ef9a9a" font-family="ui-monospace, monospace" font-size="8">0.040  apple</text>
      <text x="15" y="50" fill="#ef9a9a" font-family="ui-monospace, monospace" font-size="8">0.080  banana</text>
      <text x="15" y="62" fill="#ef9a9a" font-family="ui-monospace, monospace" font-size="8">0.150  cake</text>
      <text x="15" y="74" fill="#ef9a9a" font-family="ui-monospace, monospace" font-size="8">0.120  donut</text>
      <!-- distribution bar (flatter) -->
      <rect x="5" y="84" width="5" height="11" rx="1" fill="#ef5350"/>
      <rect x="5" y="78" width="5" height="17" rx="1" fill="#ef5350"/>
      <rect x="5" y="72" width="5" height="23" rx="1" fill="#ef5350"/>
      <rect x="5" y="75" width="5" height="20" rx="1" fill="#ef5350"/>
      <text x="70" y="120" fill="#ef5350" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Broader, flatter</text>
      <text x="70" y="133" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">More random,</text>
      <text x="70" y="144" fill="#8b949e" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">more creative</text>
      <text x="70" y="160" fill="#ef5350" font-family="Inter, sans-serif" font-size="7" font-style="italic" text-anchor="middle">use for creative writing</text>
    </g>

    <!-- Summary table -->
    <g transform="translate(15, 270)">
      <rect x="0" y="0" width="295" height="90" rx="6" fill="#0d1117"/>
      <text x="147" y="16" fill="#ff7043" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Temperature Quick Reference</text>
      <text x="20" y="34" fill="#42a5f5" font-family="Inter, sans-serif" font-size="9">T &lt; 1 (cool)</text>
      <text x="115" y="34" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">→ peaked → predictable</text>
      <text x="20" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">T = 1</text>
      <text x="115" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">→ default softmax</text>
      <text x="20" y="66" fill="#ef5350" font-family="Inter, sans-serif" font-size="9">T &gt; 1 (hot)</text>
      <text x="115" y="66" fill="#8b949e" font-family="Inter, sans-serif" font-size="9">→ flat → creative</text>
      <text x="147" y="82" fill="#ff7043" font-family="Inter, sans-serif" font-size="7" font-style="italic" text-anchor="middle">Alters predictions — not just filters</text>
    </g>

    <!-- Typical combo note -->
    <g transform="translate(15, 375)">
      <rect x="0" y="0" width="295" height="80" rx="6" fill="#1a1a00" stroke="#ffd54f" stroke-width="1"/>
      <text x="147" y="18" fill="#ffd54f" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">💡 Typical Combination</text>
      <text x="147" y="36" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">top-k or top-p</text>
      <text x="147" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">+ temperature</text>
      <text x="147" y="64" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">+ random sampling</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="552" fill="#484f58" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Inference params ≠ training weights · greedy (default, repetitive) → random → top-k/p → temperature for controlled creativity</text>
</svg>
