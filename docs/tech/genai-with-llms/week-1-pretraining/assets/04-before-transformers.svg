<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500">
  <defs>
    <linearGradient id="rnnG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81c784"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="failG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef5350"/>
      <stop offset="100%" style="stop-color:#b71c1c"/>
    </linearGradient>
    <linearGradient id="winG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#4a148c"/>
    </linearGradient>
    <linearGradient id="boomG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd54f"/>
      <stop offset="100%" style="stop-color:#ff6f00"/>
    </linearGradient>
    <filter id="shadow04">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="440" y="30" fill="#e6edf3" font-family="Inter, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Before Transformers: Why RNNs Hit a Wall</text>
  <text x="440" y="48" fill="#8b949e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">From sequential RNNs (pre-2017) → Transformer breakthrough (Attention is All You Need)</text>

  <!-- ═══════════ LEFT: RNN Problem ═══════════ -->
  <g transform="translate(20, 70)" filter="url(#shadow04)">
    <rect x="0" y="0" width="380" height="400" rx="12" fill="#161b22" stroke="#ef5350" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="32" rx="12" fill="url(#failG)"/>
    <rect x="0" y="20" width="380" height="12" fill="url(#failG)"/>
    <text x="190" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">❌ The RNN Problem (Pre-2017)</text>

    <!-- RNN diamond -->
    <g transform="translate(280, 60)">
      <polygon points="0,-20 25,0 0,20 -25,0" fill="url(#rnnG)" stroke="#388e3c" stroke-width="1.5"/>
      <text x="0" y="3" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">RNN</text>
    </g>

    <!-- Step 1: tiny window -->
    <text x="20" y="55" fill="#42a5f5" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Step 1 · 1 word seen</text>
    <rect x="20" y="62" width="190" height="22" rx="4" fill="#1e2530"/>
    <text x="115" y="76" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"? tastes ..."</text>
    <text x="20" y="98" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">→ prediction: too little context</text>

    <!-- Step 2: more words, more cost -->
    <text x="20" y="124" fill="#ff9800" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Step 2 · scale up window</text>
    <rect x="20" y="131" width="240" height="22" rx="4" fill="#1e2530"/>
    <text x="140" y="145" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"?  , my tea tastes ..."</text>
    <text x="20" y="167" fill="#ff9800" font-family="Inter, sans-serif" font-size="8" font-weight="bold">⚠️ Compute &amp; memory grow EXPONENTIALLY</text>

    <!-- Exponential cost curve -->
    <g transform="translate(20, 180)">
      <line x1="0" y1="60" x2="200" y2="60" stroke="#30363d" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#30363d" stroke-width="1"/>
      <text x="100" y="78" fill="#484f58" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">context window size →</text>
      <text x="-5" y="0" fill="#484f58" font-family="Inter, sans-serif" font-size="7" text-anchor="end">cost</text>
      <path d="M 0 60 Q 100 55 150 30 T 200 0" fill="none" stroke="#ef5350" stroke-width="2.5"/>
      <text x="170" y="20" fill="#ef5350" font-family="Inter, sans-serif" font-size="8" font-weight="bold">💥</text>
    </g>

    <!-- Step 3: failure -->
    <text x="20" y="280" fill="#ef5350" font-family="Inter, sans-serif" font-size="9" font-weight="bold">Step 3 · prediction still WRONG</text>
    <rect x="20" y="288" width="340" height="40" rx="4" fill="#2a1010"/>
    <text x="190" y="304" fill="#ef5350" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">"The milk is bad, my tea tastes great."</text>
    <text x="190" y="320" fill="#ef5350" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">milk is BAD → tea should taste BAD ❌</text>

    <!-- Language is messy -->
    <text x="20" y="350" fill="#bb86fc" font-family="Inter, sans-serif" font-size="9" font-weight="bold">+ Language is ambiguous:</text>
    <text x="20" y="365" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">• Homonyms — "I took my money to the bank"</text>
    <text x="20" y="378" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">• Syntactic ambiguity — "teacher taught student with book"</text>
    <text x="20" y="391" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">    → whose book? Teacher's? Student's? Both?</text>
  </g>

  <!-- Big arrow with paper -->
  <g transform="translate(415, 240)">
    <line x1="0" y1="20" x2="50" y2="20" stroke="#ffd54f" stroke-width="3"/>
    <polygon points="50,20 42,14 42,26" fill="#ffd54f"/>
    <text x="25" y="0" fill="#ffd54f" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2017</text>
    <text x="25" y="40" fill="#ffd54f" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">paper</text>
  </g>

  <!-- ═══════════ RIGHT: Transformer Win ═══════════ -->
  <g transform="translate(480, 70)" filter="url(#shadow04)">
    <rect x="0" y="0" width="380" height="400" rx="12" fill="#161b22" stroke="#9c27b0" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="32" rx="12" fill="url(#winG)"/>
    <rect x="0" y="20" width="380" height="12" fill="url(#winG)"/>
    <text x="190" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✅ Transformer Unlock (2017)</text>

    <!-- Paper title card -->
    <rect x="40" y="50" width="300" height="60" rx="6" fill="#1e1530" stroke="#bb86fc" stroke-width="1"/>
    <text x="190" y="72" fill="#bb86fc" font-family="Inter, sans-serif" font-size="13" font-style="italic" font-weight="bold" text-anchor="middle">"Attention is All You Need"</text>
    <text x="190" y="90" fill="#8b949e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Vaswani et al. · Google + Univ. of Toronto</text>
    <text x="190" y="103" fill="#8b949e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">June 2017 — the architecture that changed everything</text>

    <!-- Three wins -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="340" height="62" rx="6" fill="#0d1d2e" stroke="#42a5f5" stroke-width="1"/>
      <text x="15" y="20" fill="#42a5f5" font-family="Inter, sans-serif" font-size="10" font-weight="bold">🚀 Scales on multi-core GPUs</text>
      <text x="15" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Modern hardware fully utilized — no</text>
      <text x="15" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">sequential bottleneck choking the model</text>
    </g>

    <g transform="translate(20, 202)">
      <rect x="0" y="0" width="340" height="62" rx="6" fill="#0d2818" stroke="#66bb6a" stroke-width="1"/>
      <text x="15" y="20" fill="#66bb6a" font-family="Inter, sans-serif" font-size="10" font-weight="bold">⚡ Parallel processing of input</text>
      <text x="15" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">All words processed at once → train on</text>
      <text x="15" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">trillions of words from massive datasets</text>
    </g>

    <g transform="translate(20, 274)">
      <rect x="0" y="0" width="340" height="62" rx="6" fill="#2a1f00" stroke="#ffd54f" stroke-width="1"/>
      <text x="15" y="20" fill="#ffd54f" font-family="Inter, sans-serif" font-size="10" font-weight="bold">🎯 Pays attention to MEANING</text>
      <text x="15" y="38" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">Learns which words to focus on for each</text>
      <text x="15" y="50" fill="#8b949e" font-family="Inter, sans-serif" font-size="8">prediction — solves homonyms &amp; ambiguity</text>
    </g>

    <!-- Punchline -->
    <rect x="40" y="350" width="300" height="36" rx="6" fill="#1e1530"/>
    <text x="190" y="365" fill="#bb86fc" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">The title says it all:</text>
    <text x="190" y="380" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" font-style="italic" text-anchor="middle">Attention is All You Need.</text>
  </g>

  <!-- Footer -->
  <text x="440" y="488" fill="#484f58" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">RNNs: sequential, exponential cost · Transformers: parallel, attention-based — the unlock for modern Gen AI</text>
</svg>
